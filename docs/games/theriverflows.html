const S=28,SQ3=Math.sqrt(3),RAD=3;
const DIRS=[[0,-1],[1,-1],[1,0],[0,1],[-1,1],[-1,0]];
const EN=['N','NE','SE','S','SW','NW'];
const h2p=(q,r)=>({x:S*1.5*q,y:S*SQ3*(r+q/2)});
const hk=(q,r)=>`${q},${r}`;
const opp=e=>(e+3)%6;
const nbr=(q,r,e)=>({q:q+DIRS[e][0],r:r+DIRS[e][1]});
const mirE=e=>(6-e)%6;
const rpf=(pe,rot,mir)=>mir?(mirE(pe)+rot)%6:(pe+rot)%6;
function vtx(cx,cy,i){const a=(Math.PI/3)*i;return{x:cx+S*Math.cos(a),y:cy-S*Math.sin(a)};}
function hexPts(cx,cy){let s='';for(let i=0;i<6;i++){const v=vtx(cx,cy,i);s+=(i?',':'')+v.x.toFixed(1)+','+v.y.toFixed(1);}return s;}
const EV=[[1,2],[0,1],[5,0],[4,5],[3,4],[2,3]];
function eMid(cx,cy,e){const[a,b]=EV[e];const va=vtx(cx,cy,a),vb=vtx(cx,cy,b);return{x:(va.x+vb.x)/2,y:(va.y+vb.y)/2};}
function eNorm(e){const[a,b]=EV[e];const va=vtx(0,0,a),vb=vtx(0,0,b);const mx=(va.x+vb.x)/2,my=(va.y+vb.y)/2;const l=Math.sqrt(mx*mx+my*my);return{x:mx/l,y:my/l};}
let hexes=[];
for(let q=-RAD;q<=RAD;q++)for(let r=-RAD;r<=RAD;r++)if(Math.abs(q+r)<=RAD)hexes.push({q,r});

// ─── Deck Definitions ───
const WOOD_CARDS=[
{id:'river',cost:{wood:1},n:8},{id:'creek',cost:{wood:1},n:6},{id:'bend',cost:{wood:1},n:4},
{id:'narrows',cost:{wood:1},n:4},{id:'crevasse',cost:{wood:1},n:3},{id:'sinkhole',cost:{wood:1},n:3},
{id:'tributary',cost:{wood:2},n:4},{id:'canal',cost:{wood:2},n:4},{id:'rapids',cost:{wood:2},n:3},
{id:'dry_riverbed',cost:{wood:2},n:6},{id:'gorge',cost:{wood:2},n:4},{id:'shallows',cost:{wood:2},n:4},
{id:'confluence',cost:{wood:2},n:4},{id:'ford',cost:{wood:2},n:4},{id:'spillway',cost:{wood:2},n:4},

];
const WISDOM_CARDS=[
{id:'dammed',cost:{wood:3,wisdom:1},n:4},{id:'karst',cost:{wood:3,wisdom:1},n:4},
{id:'artesian',cost:{wood:3,wisdom:1},n:3},{id:'beaver',cost:{wood:3,wisdom:1},n:3},
{id:'cave_spring',cost:{wood:3,wisdom:1},n:3},{id:'well',cost:{wood:2,wisdom:2},n:2},
{id:'pipe_pair',cost:{wood:4,wisdom:2},n:2},
{id:'ref_pool',cost:{wisdom:3},n:3},
];

function buildDeck(defs){
  const d=[];
  for(const c of defs) for(let i=0;i<c.n;i++) d.push({id:c.id,cost:{...c.cost}});
  for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}
  return d;
}

function costStr(cost){
  const p=[];
  if(cost.wood) p.push(cost.wood+'w');
  if(cost.wisdom) p.push(cost.wisdom+'wi');
  return p.join('+');
}

function canAfford(cost){
  if(cost.wood&&res.wood<cost.wood) return false;
  if(cost.wisdom&&res.wisdom<cost.wisdom) return false;
  return true;
}

function payCost(cost){
  if(cost.wood) res.wood-=cost.wood;
  if(cost.wisdom) res.wisdom-=cost.wisdom;
}

// ─── Game State ───
let board={},fl={},adjInfo={};
let bSel=null,rmMode=false;
let wells={},muxCfg={};
let turn=0,phase='shop'; // shop, place, resolve
let res={seed:0,wood:0,wisdom:0,reed:0};
let logMsg=[];
let geyserPhase={},cisternStore={},caveStones={},romConfig={},pipeLink={};
let pipePlacing=null; // key of placed pipe_in waiting for pipe_out
let woodDeck=[],wisdomDeck=[];
let woodShop=[null,null,null],wisdomShop=[null,null,null];
let lockedSlot=null; // {deck:'wood'|'wisdom', idx:0-2}
let hand=[]; // array of {id, cost}
let handSel=null; // index into hand
let bought=false; // bought this turn?
let startSource=null; // chosen starting source

// ─── Flow Resolution (same engine) ───
function resolveFlow(erode){
  fl={};const vis=new Set();
  function gf(k){if(!fl[k])fl[k]={edges:{},draws:[],_gi:{},_notIn:false,_anyIn:false};return fl[k];}
  function tp(tile,pe){return rpf(pe,tile.rot,tile.mir);}

  function trace(q,r,outE,tok){
    if(tok<=0)return;
    const k=hk(q,r),vk=k+':'+outE;
    if(vis.has(vk))return;vis.add(vk);
    const f=gf(k);f.edges[outE]=Math.max(f.edges[outE]||0,tok);
    const n=nbr(q,r,outE),nk=hk(n.q,n.r),nt=board[nk];
    if(!nt)return;
    const nd=T[nt.type],ie=opp(outE),nf=gf(nk);
    nf.edges[ie]=Math.max(nf.edges[ie]||0,tok);

    if(nd.isRock){if(!erode||tok<=0)return;let outDir=opp(ie);const chkOn=d2=>hexes.some(h2=>h2.q===nbr(n.q,n.r,d2).q&&h2.r===nbr(n.q,n.r,d2).r);if(!chkOn(outDir)){let found=false;for(const off of[1,5,2,4]){const try2=(outDir+off)%6;if(try2!==ie&&chkOn(try2)){outDir=try2;found=true;break;}}if(!found)return;}const out=Math.max(0,tok-1);if(out===0){board[nk]={type:'alluvial',rot:0,mir:false,fanIn:ie};nf.draws.push({f:ie,t:-1,v:0});}else{board[nk]={type:'canyon',rot:0,mir:false,canyonIn:ie,canyonOut:outDir};nf.draws.push({f:ie,t:outDir,v:out});nf.edges[outDir]=Math.max(nf.edges[outDir]||0,out);trace(n.q,n.r,outDir,out);}return;}
    if(nd.isCanyon){const t2=board[nk];if(t2.canyonIn===ie){const out=Math.max(0,tok-1);if(out>0){nf.draws.push({f:ie,t:t2.canyonOut,v:out});nf.edges[t2.canyonOut]=Math.max(nf.edges[t2.canyonOut]||0,out);trace(n.q,n.r,t2.canyonOut,out);}}return;}
    if(nd.cat==='ter')return;
    if(nd.isFlooded){const t2=board[nk];if(t2.floodOut===undefined)return;if(!nf._floodTok)nf._floodTok=0;nf._floodTok+=tok;const out=Math.min(3,nf._floodTok);nf.draws=nf.draws.filter(d=>d.t!==t2.floodOut);nf.draws.push({f:ie,t:t2.floodOut,v:out});nf.edges[t2.floodOut]=out;vis.delete(nk+':'+t2.floodOut);trace(n.q,n.r,t2.floodOut,out);return;}
    if(erode&&nd.ports&&nd.ports.length>0){const vi2=nd.ports.filter(p=>p.d==='i'||p.d==='i2'||p.d==='b').map(p=>tp(nt,p.e));if(!vi2.includes(ie)){const op=nd.ports.find(p=>p.d==='o'||p.d==='o2');const fo=op?tp(nt,op.e):opp(ie);board[nk]={type:'flooded',rot:0,mir:false,floodOut:fo};const out=Math.min(3,tok);nf.draws.push({f:ie,t:fo,v:out});nf.edges[fo]=out;trace(n.q,n.r,fo,out);return;}}
    if(nd.cat==='util'&&!nd.gate){const ai=tp(nt,nd.ports.find(p=>p.d==='i').e);if(ai===ie)nf.draws.push({f:ie,t:-1,v:tok});return;}
    if(nd.gate==='not'){if(tp(nt,nd.ports.find(p=>p.d==='i').e)===ie)nf._notIn=true;return;}
    if(nd.gate==='nand'){const ins=nd.ports.filter(p=>p.d==='i').map(p=>tp(nt,p.e));if(!ins.includes(ie))return;nf._gi[ie]=tok;nf._anyIn=true;if(ins.every(i2=>nf._gi[i2]>0))nf._notIn=true;return;}
    if(nd.gate==='nor'){const ins=nd.ports.filter(p=>p.d==='i').map(p=>tp(nt,p.e));if(!ins.includes(ie))return;nf._anyIn=true;return;}
    if(nd.gate==='xor'){const ins=nd.ports.filter(p=>p.d==='i').map(p=>tp(nt,p.e));const ao=tp(nt,nd.ports.find(p=>p.d==='o').e);if(!ins.includes(ie))return;nf._gi[ie]=tok;const pr=ins.filter(i2=>nf._gi[i2]>0);nf.draws=nf.draws.filter(d=>d.t!==ao);if(pr.length===1){const val=nf._gi[pr[0]];nf.draws.push({f:pr[0],t:ao,v:val});vis.delete(nk+':'+ao);trace(n.q,n.r,ao,val);}return;}
    if(nd.gate==='and_min'){const ins=nd.ports.filter(p=>p.d==='i').map(p=>tp(nt,p.e));const ao=tp(nt,nd.ports.find(p=>p.d==='o').e);if(!ins.includes(ie))return;nf._gi[ie]=tok;if(ins.every(i2=>nf._gi[i2]>0)){const mv=Math.min(...ins.map(i2=>nf._gi[i2]));nf.draws=nf.draws.filter(d=>d.t!==ao);ins.forEach(i2=>nf.draws.push({f:i2,t:ao,v:mv}));trace(n.q,n.r,ao,mv);}return;}
    if(nd.gate==='and_max'){const ins=nd.ports.filter(p=>p.d==='i').map(p=>tp(nt,p.e));const ao=tp(nt,nd.ports.find(p=>p.d==='o').e);if(!ins.includes(ie))return;nf._gi[ie]=tok;if(ins.every(i2=>nf._gi[i2]>0)){const mv=Math.max(...ins.map(i2=>nf._gi[i2]));nf.draws=nf.draws.filter(d=>d.t!==ao);ins.forEach(i2=>nf.draws.push({f:i2,t:ao,v:mv}));trace(n.q,n.r,ao,mv);}return;}

    if(nd.gate==='or_add'){const ins=nd.ports.filter(p=>p.d==='i').map(p=>tp(nt,p.e));const ao=tp(nt,nd.ports.find(p=>p.d==='o').e);if(!ins.includes(ie))return;nf._gi[ie]=tok;const sum=Math.min(3,Object.values(nf._gi).reduce((a,b)=>a+b,0));nf.draws=nf.draws.filter(d=>d.t!==ao);Object.keys(nf._gi).forEach(i2=>nf.draws.push({f:parseInt(i2),t:ao,v:sum}));vis.delete(nk+':'+ao);trace(n.q,n.r,ao,sum);return;}
    if(nd.gate==='or_min'){const ins=nd.ports.filter(p=>p.d==='i').map(p=>tp(nt,p.e));const ao=tp(nt,nd.ports.find(p=>p.d==='o').e);if(!ins.includes(ie))return;nf._gi[ie]=tok;const vals=Object.values(nf._gi).filter(v=>v>0);if(vals.length>0){const mv=Math.min(...vals);nf.draws=nf.draws.filter(d=>d.t!==ao);nf.draws.push({f:ie,t:ao,v:mv});vis.delete(nk+':'+ao);trace(n.q,n.r,ao,mv);}return;}
    if(nd.gate==='or_max'){const ins=nd.ports.filter(p=>p.d==='i').map(p=>tp(nt,p.e));const ao=tp(nt,nd.ports.find(p=>p.d==='o').e);if(!ins.includes(ie))return;nf._gi[ie]=tok;const vals=Object.values(nf._gi).filter(v=>v>0);if(vals.length>0){const mv=Math.max(...vals);nf.draws=nf.draws.filter(d=>d.t!==ao);nf.draws.push({f:ie,t:ao,v:mv});vis.delete(nk+':'+ao);trace(n.q,n.r,ao,mv);}return;}
    if(nd.gate==='delta'){const ai=tp(nt,nd.ports.find(p=>p.d==='i').e);if(ai!==ie||tok<1)return;nd.ports.filter(p=>p.d==='o').forEach(op=>{const ao=tp(nt,op.e);nf.draws.push({f:ie,t:ao,v:1});nf.edges[ao]=Math.max(nf.edges[ao]||0,1);trace(n.q,n.r,ao,1);});return;}
    if(nd.gate==='split'){const ai=tp(nt,nd.ports.find(p=>p.d==='i').e);if(ai!==ie)return;const outs=nd.ports.filter(p=>p.d==='o').map(p=>tp(nt,p.e));const hi=Math.ceil(tok/2),lo=Math.floor(tok/2);if(outs[0]!==undefined&&hi>0){nf.draws.push({f:ie,t:outs[0],v:hi});nf.edges[outs[0]]=hi;trace(n.q,n.r,outs[0],hi);}if(outs[1]!==undefined&&lo>0){nf.draws.push({f:ie,t:outs[1],v:lo});nf.edges[outs[1]]=lo;trace(n.q,n.r,outs[1],lo);}return;}
    if(nd.gate==='cross'){const pAi=tp(nt,5),pAo=tp(nt,2),pBi=tp(nt,0),pBo=tp(nt,3);if(ie===pAi){nf.draws.push({f:ie,t:pAo,v:tok});trace(n.q,n.r,pAo,tok);}else if(ie===pBi){nf.draws.push({f:ie,t:pBo,v:tok});trace(n.q,n.r,pBo,tok);}return;}
    if(nd.gate==='mux'){const ai=tp(nt,nd.ports.find(p=>p.d==='i').e);if(ai!==ie)return;const outs=nd.ports.filter(p=>p.d==='o').map(p=>tp(nt,p.e));const cfg=muxCfg[nk]||0;if(cfg===0||cfg===2){if(outs[0]!==undefined){const v=cfg===2?Math.ceil(tok/2):tok;nf.draws.push({f:ie,t:outs[0],v});trace(n.q,n.r,outs[0],v);}}if(cfg===1||cfg===2){if(outs[1]!==undefined){const v=cfg===2?Math.floor(tok/2):tok;nf.draws.push({f:ie,t:outs[1],v});trace(n.q,n.r,outs[1],v);}}return;}
    if(nd.gate==='cistern'){const ai=tp(nt,nd.ports.find(p=>p.d==='i').e);if(ai!==ie)return;cisternStore[nk]=Math.min(3,(cisternStore[nk]||0)+tok);return;}
    if(nd.gate==='cave'){const ins=nd.ports.filter(p=>p.d==='i').map(p=>tp(nt,p.e));if(!ins.includes(ie))return;nf._gi[ie]=tok;const setE=tp(nt,5),rstE=tp(nt,4);const gs=nf._gi[setE]>0,gr=nf._gi[rstE]>0;if(gs&&!gr)caveStones[nk]=true;else if(!gs&&gr)caveStones[nk]=false;return;}
    if(nd.gate==='rom'){const ins=nd.ports.filter(p=>p.d==='i').map(p=>tp(nt,p.e));const ao=tp(nt,nd.ports.find(p=>p.d==='o').e);if(!ins.includes(ie))return;nf._gi[ie]=tok;const a1=tp(nt,5),a0=tp(nt,4);const b1=nf._gi[a1]>0?1:0,b0=nf._gi[a0]>0?1:0;const addr=b1*2+b0;const cfg=romConfig[nk]||[0,0,0,0];nf.draws=nf.draws.filter(d=>d.t!==ao);if(cfg[addr]){nf.draws.push({f:ie,t:ao,v:1});vis.delete(nk+':'+ao);trace(n.q,n.r,ao,1);}return;}
    if(nd.gate==='decoder'){const ins=nd.ports.filter(p=>p.d==='i').map(p=>tp(nt,p.e));if(!ins.includes(ie))return;nf._gi[ie]=tok;const a1=tp(nt,0),a0=tp(nt,1);const b1=nf._gi[a1]>0?1:0,b0=nf._gi[a0]>0?1:0;const addr=b1*2+b0;const outs=nd.ports.filter(p=>p.d==='o').map(p=>tp(nt,p.e));nf.draws=nf.draws.filter(d=>!outs.includes(d.t));if(outs[addr]!==undefined){nf.draws.push({f:ie,t:outs[addr],v:1});vis.delete(nk+':'+outs[addr]);trace(n.q,n.r,outs[addr],1);}return;}
    if(nd.gate==='pipe_in'){const ai=tp(nt,nd.ports.find(p=>p.d==='i').e);if(ai!==ie)return;nf._gi['tok']=tok;nf.draws.push({f:ie,t:-1,v:tok});return;}
    if(nd.gate==='pipe_out'||nd.gate==='tap')return;
    if(nd.bidir){const acts=nd.ports.filter(p=>p.d==='b').map(p=>tp(nt,p.e));if(!acts.includes(ie))return;const ao=acts.find(a=>a!==ie);if(ao===undefined)return;nf.draws.push({f:ie,t:ao,v:tok});trace(n.q,n.r,ao,tok);return;}
    for(const port of nd.ports){if(port.d==='i'){const ai=tp(nt,port.e);if(ai===ie){const op=nd.ports.find(p=>p.d==='o');if(!op)return;let out=tok;if(nd.clamp!==undefined)out=Math.min(out,nd.clamp);if(nd.amp!==undefined&&tok>=1)out=nd.amp;if(nd.red!==undefined)out=Math.max(0,out-nd.red);if(out<=0)return;const ao=tp(nt,op.e);nf.draws.push({f:ie,t:ao,v:out});trace(n.q,n.r,ao,out);}}}
  }

  for(const[k,tile]of Object.entries(board)){
    const d=T[tile.type];
    if(d.cat==='src'){if(d.isWell&&!wells[k])continue;if(d.isGeyser&&!geyserPhase[k])continue;const[q,r]=k.split(',').map(Number);const ao=tp(tile,d.ports.find(p=>p.d==='o').e);const f=gf(k);f.draws.push({f:-1,t:ao,v:d.w});trace(q,r,ao,d.w);}
    if(d.gate==='cistern'&&(cisternStore[k]||0)>=1){const[q,r]=k.split(',').map(Number);const ao=tp(tile,d.ports.find(p=>p.d==='o').e);const f=gf(k);f.draws.push({f:-1,t:ao,v:1});trace(q,r,ao,1);}
    if(d.gate==='cave'&&caveStones[k]){const[q,r]=k.split(',').map(Number);const ao=tp(tile,d.ports.find(p=>p.d==='o').e);const f=gf(k);f.draws.push({f:-1,t:ao,v:d.notPow});trace(q,r,ao,d.notPow);}
    if(d.gate==='rom'){const nf2=gf(k);if(!Object.keys(nf2._gi).length){const cfg=romConfig[k]||[0,0,0,0];if(cfg[0]){const[q,r]=k.split(',').map(Number);const ao=tp(tile,d.ports.find(p=>p.d==='o').e);nf2.draws.push({f:-1,t:ao,v:1});trace(q,r,ao,1);}}}
    if(d.gate==='tap'){const[q,r]=k.split(',').map(Number);let has=false;for(let e=0;e<6;e++){const nb2=nbr(q,r,e);if(board[hk(nb2.q,nb2.r)]&&board[hk(nb2.q,nb2.r)].type==='lake')has=true;}if(has){const ao=tp(tile,d.ports.find(p=>p.d==='o').e);const f=gf(k);f.draws.push({f:-1,t:ao,v:1});trace(q,r,ao,1);}}
    if(d.gate==='pipe_out'){const lk=pipeLink[k];if(lk&&fl[lk]&&fl[lk]._gi&&fl[lk]._gi['tok']>0){const[q,r]=k.split(',').map(Number);const ao=tp(tile,d.ports.find(p=>p.d==='o').e);const f=gf(k);f.draws.push({f:-1,t:ao,v:fl[lk]._gi['tok']});trace(q,r,ao,fl[lk]._gi['tok']);}}
  }

    if(d.gate==='not'&&!nf._notIn){const ao=tp(tile,d.ports.find(p=>p.d==='o').e);nf.draws.push({f:-1,t:ao,v:d.notPow});trace(q,r,ao,d.notPow);}
    if(d.gate==='nand'&&!nf._notIn){const ao=tp(tile,d.ports.find(p=>p.d==='o').e);nf.draws.push({f:-1,t:ao,v:d.notPow});trace(q,r,ao,d.notPow);}
    if(d.gate==='nor'&&!nf._anyIn){const ao=tp(tile,d.ports.find(p=>p.d==='o').e);nf.draws.push({f:-1,t:ao,v:d.notPow});trace(q,r,ao,d.notPow);}
  }
}

// ─── Adjacency & Growth ───
function calcAdj(){
  adjInfo={};
  for(const[k,tile]of Object.entries(board)){
    if(T[tile.type].cat!=='ter')continue;
    const[q,r]=k.split(',').map(Number);
    let fc=0,maf=0,dir=0;
    for(let e=0;e<6;e++){
      const n=nbr(q,r,e),nk=hk(n.q,n.r),nf=fl[nk],nt=board[nk];
      if(nt&&(nt.type==='pond'||nt.type==='lake')){fc++;maf=Math.max(maf,1);}
      if(nt&&T[nt.type].isFan&&nt.fanIn!==undefined){const fi=nt.fanIn;if([(fi+2)%6,(fi+3)%6,(fi+4)%6].includes(opp(e))){fc++;maf=Math.max(maf,1);}}
      if(!nf)continue;
      // Direct input: flow aimed at this terrain tile (always checked, even from sources)
      for(const d of nf.draws){if(d.t===opp(e)&&d.v>0)dir=Math.max(dir,d.v);}
      // Skip adjacency bonus from canyons and non-underground sources
      if(nt&&T[nt.type].isCanyon)continue;
      if(nt&&T[nt.type].cat==='src'&&nt.type!=='underground')continue;
      if(nf.draws.some(d=>d.v>0&&d.t>=0)){fc++;for(const d of nf.draws)if(d.v>0&&d.t>=0)maf=Math.max(maf,d.v);}
    }
    adjInfo[k]={flowCount:fc,maxAdjFlow:maf,direct:dir};
  }
}

function growTerrain(){
  const ch={};
  for(const[k,info]of Object.entries(adjInfo)){
    const tile=board[k];if(!tile)continue;
    const ty=tile.type,{flowCount:fc,maxAdjFlow:maf,direct:dir}=info;
    if(ty==='alluvial'&&tile.fanIn!==undefined){
      const[q,r]=k.split(',').map(Number);const sn=nbr(q,r,tile.fanIn),sk=hk(sn.q,sn.r),st=board[sk],sf=fl[sk];
      let fed=false;if(sf)for(const d of sf.draws)if(d.t===opp(tile.fanIn)&&d.v>0)fed=true;
      if(!fed){ch[k]='desert';continue;}
      if(st&&!T[st.type].isCanyon&&!T[st.type].isRock&&T[st.type].cat!=='ter'&&T[st.type].cat!=='src'){ch[k]='delta_upgrade';continue;}
    }
    if(dir>0){if(['barren','alluvial','scrubland','grassland','forest','oldgrowth'].includes(ty)){ch[k]=dir>=3?'lake':dir>=2?'pond':'wetland';}else if(ty==='wetland'&&dir>=2)ch[k]='pond';else if(ty==='pond'&&dir>=3)ch[k]='lake';continue;}
    if(maf>=2&&['barren','alluvial','scrubland','grassland'].includes(ty)){ch[k]='wetland';continue;}
    if(fc>0){if(ty==='barren'||ty==='alluvial')ch[k]='scrubland';else if(ty==='scrubland')ch[k]='grassland';else if(ty==='grassland')ch[k]='forest';else if(ty==='forest')ch[k]='oldgrowth';}
    else{if(ty==='oldgrowth')ch[k]='forest';else if(ty==='forest')ch[k]='grassland';}
  }
  for(const[k,tile]of Object.entries(board)){
    if(tile.type!=='desert')continue;const[q,r]=k.split(',').map(Number);
    for(let e=0;e<6;e++){const nb2=nbr(q,r,e),nk=hk(nb2.q,nb2.r),nt=board[nk];
      if(nt&&(nt.type==='scrubland'||nt.type==='grassland'||nt.type==='alluvial'))if(!ch[nk])ch[nk]='desert';}
  }
  for(const[k,tile]of Object.entries(board)){if(T[tile.type].isFlooded){const hf=fl[k];if(!hf||!hf.draws.some(d=>d.v>0))ch[k]='lake';}}
  return ch;
}

function harvest(){
  let s=0,w=0,wi=0,rd=0;
  for(const tile of Object.values(board)){const t=tile.type;
    if(t==='scrubland')s+=1;else if(t==='grassland')s+=2;else if(t==='alluvial')s+=1;
    else if(t==='forest')w+=1;else if(t==='oldgrowth'){w+=2;wi+=1;}
    else if(t==='wetland'||t==='pond'||t==='lake')rd+=1;
  }
  return{seed:s,wood:w,wisdom:wi,reed:rd};
}

// ─── SVG Rendering ───
const pad=S*2.5;const allPx=hexes.map(h=>h2p(h.q,h.r));
const x0=Math.min(...allPx.map(p=>p.x))-pad,x1=Math.max(...allPx.map(p=>p.x))+pad;
const y0=Math.min(...allPx.map(p=>p.y))-pad,y1=Math.max(...allPx.map(p=>p.y))+pad;
const vW=x1-x0,vH=y1-y0;
function wCol(n){return n>=3?'#2090FF':n>=2?'#50AAFF':'#80CCFF';}
function wWid(n){return n>=3?5:n>=2?3.5:2;}
function drawArrow(cx,cy,edge,dir){const m=eMid(cx,cy,edge),n=eNorm(edge);const isOut=dir==='o'||dir==='b';const col=dir==='o'?'#90C0E0':dir==='b'?'#D0C060':'#5080A0';if(isOut){const tx=m.x+n.x*9,ty=m.y+n.y*9,bx=m.x-n.x*2,by=m.y-n.y*2,px=-n.y,py=n.x;return`<line x1="${bx}" y1="${by}" x2="${tx}" y2="${ty}" stroke="${col}" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/><polygon points="${tx},${ty} ${tx-n.x*4.5+px*2.8},${ty-n.y*4.5+py*2.8} ${tx-n.x*4.5-px*2.8},${ty-n.y*4.5-py*2.8}" fill="${col}" opacity="0.85"/>`;}return`<circle cx="${m.x-n.x*3}" cy="${m.y-n.y*3}" r="2.5" fill="none" stroke="${col}" stroke-width="1.5" opacity="0.7"/>`;}

function renderGrid(){
  let svg=`<svg viewBox="${x0} ${y0} ${vW} ${vH}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%"><defs><filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  for(const{q,r}of hexes){
    const p=h2p(q,r),k=hk(q,r),tile=board[k],d=tile?T[tile.type]:null;
    const hf=fl[k],a=adjInfo[k],isSel=bSel===k;
    let sc=d?d.str:'#222530',sw=d?1:0.5;
    if(isSel){sc='#D0A840';sw=2.5;}else if(rmMode&&d&&d.type!=='rocky'){sc='#802020';sw=1.5;}
    else if(a?.direct>0){sc='#2870A0';sw=1.5;}else if(a?.flowCount>0){sc='#307828';sw=1.5;}
    svg+=`<polygon points="${hexPts(p.x,p.y)}" fill="${d?d.fill:'#181A1E'}" stroke="${sc}" stroke-width="${sw}" opacity="${d?1:0.45}"/>`;
    if(d){const va=vtx(p.x,p.y,1),vb=vtx(p.x,p.y,2);svg+=`<line x1="${va.x}" y1="${va.y}" x2="${vb.x}" y2="${vb.y}" stroke="${d.band}" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>`;}
    if(d&&tile.mir){const va=vtx(p.x,p.y,4),vb=vtx(p.x,p.y,5);svg+=`<line x1="${va.x}" y1="${va.y}" x2="${vb.x}" y2="${vb.y}" stroke="#606880" stroke-width="1.5" stroke-linecap="round" opacity="0.5" stroke-dasharray="2 2"/>`;}
    if(d&&d.ports)for(const port of d.ports){const ae=rpf(port.e,tile.rot,tile.mir);svg+=drawArrow(p.x,p.y,ae,port.d==='i2'?'i':port.d==='o2'?'o':port.d);}
    if(d&&d.ports)for(const port of d.ports){if(port.d==='b')svg+=drawArrow(p.x,p.y,rpf(port.e,tile.rot,tile.mir),'i');}
    if(d&&d.isCanyon&&tile.canyonIn!==undefined){svg+=drawArrow(p.x,p.y,tile.canyonIn,'i');svg+=drawArrow(p.x,p.y,tile.canyonOut,'o');}
    if(d&&d.isFlooded&&tile.floodOut!==undefined)svg+=drawArrow(p.x,p.y,tile.floodOut,'o');
    if(d&&d.isFan&&tile.fanIn!==undefined){svg+=drawArrow(p.x,p.y,tile.fanIn,'i');for(const oe of[(tile.fanIn+2)%6,(tile.fanIn+3)%6,(tile.fanIn+4)%6]){const m=eMid(p.x,p.y,oe),n=eNorm(oe);svg+=`<circle cx="${m.x+n.x*3}" cy="${m.y+n.y*3}" r="2.5" fill="#508060" opacity="0.7"/>`;}}
    if(d){const fs=d.cat==='ter'?11:10;svg+=`<text x="${p.x}" y="${p.y-2}" text-anchor="middle" style="font-size:${fs}px;font-weight:700;fill:#C0D0E0;pointer-events:none;font-family:monospace">${d.l}</text><text x="${p.x}" y="${p.y+10}" text-anchor="middle" style="font-size:6px;font-weight:600;fill:#5A6A80;pointer-events:none">${d.s}</text>`;}
    else{const nm=eMid(p.x,p.y,0);svg+=`<text x="${nm.x}" y="${nm.y+3}" text-anchor="middle" style="font-size:4.5px;fill:#282C38;pointer-events:none;font-weight:700">N</text>`;}
    if(hf){for(const dd of hf.draws)if(dd.v>0&&dd.t>=0){const pt=eMid(p.x,p.y,dd.t),pf=dd.f<0?{x:p.x,y:p.y}:eMid(p.x,p.y,dd.f),mx=(pf.x+pt.x)/2+(p.y-(pf.y+pt.y)/2)*0.15,my=(pf.y+pt.y)/2+((pf.x+pt.x)/2-p.x)*0.15;svg+=`<path d="M${pf.x},${pf.y} Q${mx},${my} ${pt.x},${pt.y}" fill="none" stroke="${wCol(dd.v)}" stroke-width="${wWid(dd.v)}" stroke-linecap="round" opacity="0.8" filter="url(#gl)"/>`;}
      for(const[edge,tk]of Object.entries(hf.edges))if(tk>0){const m=eMid(p.x,p.y,parseInt(edge));svg+=`<circle cx="${m.x}" cy="${m.y}" r="${3.5+tk*1.2}" fill="${wCol(tk)}" opacity="0.2" filter="url(#gl)"/><circle cx="${m.x}" cy="${m.y}" r="${2+tk*0.6}" fill="${wCol(tk)}" opacity="0.6"/><text x="${m.x}" y="${m.y+2.5}" text-anchor="middle" style="font-size:6px;font-weight:800;fill:#fff;pointer-events:none">${tk}</text>`;}}
    if(a?.flowCount>0&&!a?.direct)svg+=`<circle cx="${p.x-S*0.5}" cy="${p.y-S*0.4}" r="3" fill="#307828" opacity="0.7"/>`;
    if(a?.direct>0)svg+=`<circle cx="${p.x-S*0.5}" cy="${p.y-S*0.4}" r="4" fill="#2870A0" opacity="0.7"/><text x="${p.x-S*0.5}" y="${p.y-S*0.4+2.2}" text-anchor="middle" style="font-size:5px;fill:#fff;font-weight:700;pointer-events:none">${a.direct}</text>`;
  }
  svg+=`</svg>`;
  document.getElementById('grid').innerHTML=svg;
}

// ─── Shop & Hand UI ───
function fillShop(deck,shop){for(let i=0;i<3;i++){if(!shop[i]&&deck.length>0)shop[i]=deck.shift();}}

function renderShop(){
  const el=document.getElementById('shopPanel');
  let h='<div style="display:flex;gap:8px">';
  // Wood shop
  h+='<div style="flex:1"><div class="label" style="color:#8B7020">Wood Shop</div><div class="shopRow">';
  for(let i=0;i<3;i++){
    const c=woodShop[i];
    const locked=lockedSlot&&lockedSlot.deck==='wood'&&lockedSlot.idx===i;
    if(c){const t=T[c.id];h+=`<div class="shopCard${locked?' locked':''}" onclick="shopAction('wood',${i})"><span class="tl">${t.l}</span><span class="ts">${t.s}</span><span class="tc">${costStr(c.cost)}</span></div>`;}
    else h+=`<div class="shopCard" style="opacity:0.3"><span class="ts">empty</span></div>`;
  }
  h+='</div></div>';
  // Wisdom shop
  h+='<div style="flex:1"><div class="label" style="color:#B0B0C0">Wisdom Shop</div><div class="shopRow">';
  for(let i=0;i<3;i++){
    const c=wisdomShop[i];
    const locked=lockedSlot&&lockedSlot.deck==='wisdom'&&lockedSlot.idx===i;
    if(c){const t=T[c.id];h+=`<div class="shopCard${locked?' locked':''}" onclick="shopAction('wisdom',${i})"><span class="tl">${t.l}</span><span class="ts">${t.s}</span><span class="tc">${costStr(c.cost)}</span></div>`;}
    else h+=`<div class="shopCard" style="opacity:0.3"><span class="ts">empty</span></div>`;
  }
  h+='</div></div></div>';
  // Actions
  h+='<div style="display:flex;gap:4px;margin-top:2px;flex-wrap:wrap">';
  h+=`<button class="sbtn" style="background:${res.seed>=2?'#2A3820':'#1A1C20'};color:${res.seed>=2?'#80C080':'#404040'}" onclick="colonize()">Colonize 2sd</button>`;
  h+=`<button class="sbtn" style="background:${res.seed>=3?'#3A3020':'#1A1C20'};color:${res.seed>=3?'#C0A060':'#404040'}" onclick="recover()">Recover 3sd</button>`;
  h+=`<button class="sbtn" style="background:${res.reed>=2?'#203028':'#1A1C20'};color:${res.reed>=2?'#60C0A0':'#404040'}" onclick="rerollSlot()">Reroll 2rd</button>`;
  h+='</div>';
  el.innerHTML=h;
}

function renderHand(){
  const el=document.getElementById('handPanel');
  let h='<div style="display:flex;align-items:center;gap:4px"><span class="label" style="color:#5A7888;margin-right:4px">Hand('+hand.length+'/5)</span><div class="handRow">';
  for(let i=0;i<hand.length;i++){
    const c=hand[i],t=T[c.id];
    h+=`<div class="handCard${handSel===i?' sel':''}" onclick="selectHand(${i})"><span class="tl">${t.l}</span><span class="ts">${t.s}</span></div>`;
  }
  if(hand.length===0) h+='<span style="font-size:8px;color:#303848">Empty — buy from shop</span>';
  h+='</div>';
  if(hand.length>5) h+=`<button class="sbtn" style="background:#4A2020;color:#FF9090;margin-left:4px" onclick="discardHand()">Discard</button>`;
  h+='</div>';
  el.innerHTML=h;
}

function renderTop(){
  const el=document.getElementById('topBar');
  let h=`<span style="color:#4A88AA;font-size:10px;font-weight:700;letter-spacing:1.2px">RIVER FLOWS</span>`;
  h+=`<span style="color:#404858;font-size:9px;margin-left:4px">T${turn}</span>`;
  h+=`<span style="flex:1"></span>`;
  h+=`<span style="font-size:8px;color:#6A8060">${res.seed}sd</span>`;
  h+=`<span style="font-size:8px;color:#806040">${res.wood}wd</span>`;
  h+=`<span style="font-size:8px;color:#A0A0C0">${res.wisdom}wi</span>`;
  h+=`<span style="font-size:8px;color:#508068">${res.reed}rd</span>`;
  h+=`<span style="flex:1"></span>`;
  const pc=phase==='shop'?'#D0A840':phase==='place'?'#80C0E0':'#80D0A0';
  const pl=phase==='shop'?'SHOP':phase==='place'?'PLACE':'';
  if(pl) h+=`<span class="phase" style="color:${pc};border:1px solid ${pc}30">${pl}</span>`;
  h+=`<button class="btn" style="background:#252830;color:#5A6878;margin-left:4px" onclick="toggleDel()">${rmMode?'DEL!':'DEL'}</button>`;
  if(phase==='shop') h+=`<button class="btn" style="background:#1A4A68;color:#80C0E0;margin-left:4px" onclick="preview()">PREVIEW</button>`;
  if(phase==='shop') h+=`<button class="btn" style="background:#1A5A30;color:#80D0A0;margin-left:4px" onclick="endShop()">PLACE ></button>`;
  if(phase==='place') h+=`<button class="btn" style="background:#1A4A68;color:#80C0E0;margin-left:4px" onclick="preview()">PREVIEW</button>`;
  if(phase==='place') h+=`<button class="btn" style="background:#1A5A30;color:#80D0A0;margin-left:4px" onclick="endTurn()">END TURN</button>`;
  el.innerHTML=h;
}

function renderCtx(){
  const el=document.getElementById('ctxBar');
  if(bSel&&board[bSel]){
    const sd=T[board[bSel].type],tile=board[bSel];
    let h=`<span style="color:#8AA0B8;font-weight:600;font-size:11px">${sd.s}${tile.mir?' [M]':''}</span>`;
    h+=`<button class="sbtn" style="background:#222830;color:#8AB0D0;font-size:14px;width:30px;height:26px;border:1px solid #303848" onclick="doRot('ccw')">↶</button>`;
    h+=`<button class="sbtn" style="background:#222830;color:#8AB0D0;font-size:14px;width:30px;height:26px;border:1px solid #303848" onclick="doRot('cw')">↷</button>`;
    h+=`<button class="sbtn" style="background:${tile.mir?'#2A3848':'#222830'};color:${tile.mir?'#80D0F0':'#6080A0'};font-size:12px;width:30px;height:26px;border:1px solid #303848" onclick="doMir()">⇔</button>`;
    if(sd.isWell) h+=`<button class="sbtn" style="background:${wells[bSel]?'#1A4A30':'#3A2020'};color:${wells[bSel]?'#70D0A0':'#D08080'}" onclick="toggleWell()">${wells[bSel]?'ON':'OFF'}</button>`;
    if(sd.gate==='mux') h+=`<button class="sbtn" style="background:#3A3020;color:#D0B060" onclick="cycleMux()">${['O1','O2','AB'][muxCfg[bSel]||0]}</button>`;
    h+=`<button class="sbtn" style="background:#252830;color:#5A6878" onclick="desel()">OK</button>`;
    el.innerHTML=h;
  } else if(logMsg.length>0&&turn>0){
    el.innerHTML=`<span style="color:#6A8A70;font-size:8px">${logMsg.slice(0,6).join(' | ')}</span>`;
  } else if(phase==='shop'){
    el.innerHTML=`<span style="font-size:9px;color:#D0A840">Buy tiles, colonize, or reroll. Then tap PLACE.</span>`;
  } else if(phase==='place'){
    el.innerHTML=pipePlacing?`<span style="font-size:9px;color:#8080C0">Tap hex for Pipe Out</span> <button class="sbtn" style="background:#252830;color:#5A6878" onclick="cancelPipe()">Cancel</button>`:
    handSel!==null?`<span style="font-size:9px;color:#80C0E0">Tap grid to place ${T[hand[handSel].id]?T[hand[handSel].id].s:hand[handSel].id}. Tap placed tile to edit.</span>`:
    `<span style="font-size:9px;color:#80C0E0">Select from hand or tap placed tile to edit. END TURN when done.</span>`;
  } else {
    el.innerHTML='';
  }
}

function renderAll(){renderGrid();renderShop();renderHand();renderTop();renderCtx();}

// ─── Game Actions ───
window.shopAction=function(deck,idx){
  if(phase!=='shop')return;
  const shop=deck==='wood'?woodShop:wisdomShop;
  const card=shop[idx];if(!card)return;

  // If already locked this slot, unlock
  if(lockedSlot&&lockedSlot.deck===deck&&lockedSlot.idx===idx){lockedSlot=null;renderAll();return;}

  // Try to buy
  if(!bought&&canAfford(card.cost)&&hand.length<5){
    payCost(card.cost);hand.push(card);shop[idx]=null;
    const dk=deck==='wood'?woodDeck:wisdomDeck;
    fillShop(dk,shop);
    bought=true;
    renderAll();return;
  }

  // Lock for next turn
  lockedSlot={deck,idx};
  renderAll();
};

window.colonize=function(){
  if(phase!=='shop')return;
  if(res.seed<2)return;
  // Enter colonize placement mode
  phase='colonize_place';
  renderAll();
  document.getElementById('ctxBar').innerHTML=`<span style="font-size:9px;color:#80C080">Tap a Rocky Shield to colonize (2 seed)</span> <button class="sbtn" style="background:#252830;color:#5A6878" onclick="cancelAction()">Cancel</button>`;
};

window.recover=function(){
  if(phase!=='shop')return;
  if(res.seed<3)return;
  phase='recover_place';
  renderAll();
  document.getElementById('ctxBar').innerHTML=`<span style="font-size:9px;color:#C0A060">Tap a Desert to recover (3 seed)</span> <button class="sbtn" style="background:#252830;color:#5A6878" onclick="cancelAction()">Cancel</button>`;
};

window.rerollSlot=function(){
  if(phase!=='shop'||res.reed<2)return;
  phase='reroll_pick';
  renderAll();
  document.getElementById('ctxBar').innerHTML=`<span style="font-size:9px;color:#60C0A0">Tap a shop card to reroll (2 reed)</span> <button class="sbtn" style="background:#252830;color:#5A6878" onclick="cancelAction()">Cancel</button>`;
};

window.cancelAction=function(){phase='shop';renderAll();};

window.selectHand=function(i){
  if(phase!=='place')return;
  handSel=handSel===i?null:i;
  renderAll();
};

window.discardHand=function(){
  if(hand.length<=5)return;
  // Discard last card back to bottom of its source deck
  const c=hand.pop();
  // Determine which deck it came from
  if(WISDOM_CARDS.some(w=>w.id===c.id)) wisdomDeck.push(c);
  else woodDeck.push(c);
  renderAll();
};

window.endShop=function(){phase='place';bought=false;handSel=null;renderAll();};

window.endTurn=function(){
  const msgs=[];
  // Seepage
  for(const[k,tile]of Object.entries(board)){if(T[tile.type].gate==='cistern'&&(cisternStore[k]||0)>0){cisternStore[k]=Math.max(0,(cisternStore[k]||0)-1);if(cisternStore[k]===0)msgs.push('CIS dry');}}
  // Geyser toggle
  for(const[k,tile]of Object.entries(board)){if(T[tile.type].isGeyser){if(geyserPhase[k]===undefined)geyserPhase[k]=true;else geyserPhase[k]=!geyserPhase[k];}}
  // Flow + Growth
  resolveFlow(true);calcAdj();
  const ch=growTerrain();
  if(Object.keys(ch).length>0){
    for(const[k,nt]of Object.entries(ch)){
      if(nt==='delta_upgrade'){msgs.push('A.Fan>Delta');board[k]={type:'delta',rot:board[k].fanIn||0,mir:false};}
      else{msgs.push(T[board[k].type].s+'>'+T[nt].s);board[k]={...board[k],type:nt};}
    }
    resolveFlow();calcAdj();
  }
  // Harvest
  const h=harvest();res.seed+=h.seed;res.wood+=h.wood;res.wisdom+=h.wisdom;res.reed+=h.reed;
  const pts=[];if(h.seed)pts.push('+'+h.seed+'sd');if(h.wood)pts.push('+'+h.wood+'wd');if(h.wisdom)pts.push('+'+h.wisdom+'wi');if(h.reed)pts.push('+'+h.reed+'rd');
  if(pts.length)msgs.push(pts.join(' '));
  turn++;logMsg=msgs.length>0?msgs:['--'];
  // Refill shop
  fillShop(woodDeck,woodShop);fillShop(wisdomDeck,wisdomShop);
  // Next turn
  phase='shop';bought=false;handSel=null;bSel=null;
  renderAll();
};

window.preview=function(){resolveFlow();calcAdj();renderGrid();};

window.toggleDel=function(){rmMode=!rmMode;bSel=null;handSel=null;renderAll();};
window.doRot=function(dir){if(!bSel||!board[bSel])return;board[bSel].rot=(board[bSel].rot+(dir==='cw'?1:5))%6;fl={};adjInfo={};renderAll();};
window.doMir=function(){if(!bSel||!board[bSel])return;board[bSel].mir=!board[bSel].mir;fl={};adjInfo={};renderAll();};
window.toggleWell=function(){if(!bSel)return;wells[bSel]=!wells[bSel];renderAll();};
window.cycleMux=function(){if(!bSel)return;muxCfg[bSel]=((muxCfg[bSel]||0)+1)%3;renderAll();};
window.desel=function(){bSel=null;renderAll();};
window.cancelPipe=function(){
  if(pipePlacing){
    // Revert pipe_in back to rocky
    board[pipePlacing]={type:'rocky',rot:0,mir:false};
    // Put pipe pair card back in hand
    hand.push({id:'pipe_pair',cost:{wood:4,wisdom:2}});
    pipePlacing=null;fl={};adjInfo={};renderAll();
  }
};

// ─── Grid Input ───
function s2h(cx,cy){const svg=document.querySelector('#grid svg');if(!svg)return null;const r=svg.getBoundingClientRect();const sx=x0+((cx-r.left)/r.width)*vW,sy=y0+((cy-r.top)/r.height)*vH;let best=null,bd=S*0.88;for(const h of hexes){const p=h2p(h.q,h.r);const d=Math.sqrt((p.x-sx)**2+(p.y-sy)**2);if(d<bd){best=h;bd=d;}}return best;}

function handleTap(cx,cy){
  const h=s2h(cx,cy);if(!h)return;
  const k=hk(h.q,h.r);

  if(rmMode){if(board[k]&&!T[board[k].type].isRock){board[k]={type:'rocky',rot:0,mir:false};}bSel=null;fl={};adjInfo={};renderAll();return;}

  // Special placement modes
  if(phase==='colonize_place'){
    if(board[k]&&board[k].type==='rocky'){res.seed-=2;board[k]={type:'barren',rot:0,mir:false};fl={};adjInfo={};}
    phase='shop';renderAll();return;
  }
  if(phase==='recover_place'){
    if(board[k]&&board[k].type==='desert'){res.seed-=3;board[k]={type:'scrubland',rot:0,mir:false};fl={};adjInfo={};}
    phase='shop';renderAll();return;
  }
  if(phase==='reroll_pick'){
    // Find which shop slot was clicked (handled via shopAction for reroll)
    phase='shop';renderAll();return;
  }

  // Pipe pair: second tap places pipe_out
  if(phase==='place'&&pipePlacing){
    if(board[k]&&board[k].type==='rocky'){
      board[k]={type:'pipe_out',rot:0,mir:false};
      pipeLink[k]=pipePlacing;
      pipePlacing=null;fl={};adjInfo={};
      renderAll();return;
    }
  }

  // Normal placement from hand
  if(phase==='place'&&handSel!==null){
    if(board[k]&&(board[k].type==='rocky'||!board[k])){
      const card=hand[handSel];
      // Pipe pair: first tap places pipe_in, wait for second
      if(card.id==='pipe_pair'){
        board[k]={type:'pipe_in',rot:0,mir:false};
        pipePlacing=k;
        hand.splice(handSel,1);
        handSel=null;fl={};adjInfo={};
        renderAll();
        document.getElementById('ctxBar').innerHTML=`<span style="font-size:9px;color:#8080C0">Tap another hex to place Pipe Out</span> <button class="sbtn" style="background:#252830;color:#5A6878" onclick="cancelPipe()">Cancel</button>`;
        return;
      }
      board[k]={type:card.id,rot:0,mir:false};
      hand.splice(handSel,1);
      handSel=null;fl={};adjInfo={};
      renderAll();return;
    }
  }

  // Select/deselect placed tiles
  if(board[k]&&!T[board[k].type].isRock){
    bSel=bSel===k?null:k;handSel=null;
  }
  renderAll();
}

// Reroll via shop card tap
const origShopAction=window.shopAction;
window.shopAction=function(deck,idx){
  if(phase==='reroll_pick'){
    if(res.reed<2)return;
    const locked=lockedSlot&&lockedSlot.deck===deck&&lockedSlot.idx===idx;
    if(locked){phase='shop';renderAll();return;} // Can't reroll locked
    const shop=deck==='wood'?woodShop:wisdomShop;
    const dk=deck==='wood'?woodDeck:wisdomDeck;
    if(shop[idx]){dk.push(shop[idx]);for(let i=dk.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[dk[i],dk[j]]=[dk[j],dk[i]];}}
    shop[idx]=dk.length>0?dk.shift():null;
    res.reed-=2;
    phase='shop';renderAll();return;
  }
  origShopAction(deck,idx);
};

let tStart={x:0,y:0,moved:false};
document.getElementById('grid').addEventListener('touchstart',e=>{if(e.touches.length===1)tStart={x:e.touches[0].clientX,y:e.touches[0].clientY,moved:false};},{passive:true});
document.getElementById('grid').addEventListener('touchmove',e=>{if(e.touches.length===1){const dx=e.touches[0].clientX-tStart.x,dy=e.touches[0].clientY-tStart.y;if(Math.abs(dx)>10||Math.abs(dy)>10)tStart.moved=true;}},{passive:true});
document.getElementById('grid').addEventListener('touchend',e=>{if(!tStart.moved&&e.changedTouches.length===1)handleTap(e.changedTouches[0].clientX,e.changedTouches[0].clientY);});
document.getElementById('grid').addEventListener('click',e=>{if(e.sourceCapabilities&&e.sourceCapabilities.firesTouchEvents)return;handleTap(e.clientX,e.clientY);});

// ─── Game Start ───
function startGame(sourceType){
  board={};
  for(const h of hexes) board[hk(h.q,h.r)]={type:'rocky',rot:0,mir:false};
  // Starting source goes to hand — player chooses placement
  res={seed:0,wood:0,wisdom:0,reed:0};
  woodDeck=buildDeck(WOOD_CARDS);wisdomDeck=buildDeck(WISDOM_CARDS);
  woodShop=[null,null,null];wisdomShop=[null,null,null];
  fillShop(woodDeck,woodShop);fillShop(wisdomDeck,wisdomShop);
  hand=[{id:sourceType,cost:{}}];handSel=0;turn=1;phase='place';bought=false;
  lockedSlot=null;fl={};adjInfo={};logMsg=['Place your source, rotate it, then END TURN to erode.'];
  geyserPhase={};cisternStore={};caveStones={};romConfig={};pipeLink={};wells={};muxCfg={};
  pipePlacing=null;
  renderAll();
}

// Source selection screen
function showStart(){
  const el=document.getElementById('grid');
  el.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;padding:20px">
    <div style="color:#4A88AA;font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase">The River Flows</div>
    <div style="color:#5A6878;font-size:10px;margin-bottom:8px">Choose your starting water source</div>
    <button class="btn" style="background:#3A5060;color:#80C0E0;padding:12px 24px;font-size:12px" onclick="startGame('glacial')">Glacial Spring (3W)</button>
    <button class="btn" style="background:#344858;color:#80B0D0;padding:12px 24px;font-size:12px" onclick="startGame('snowmelt')">Snowmelt Spring (2W)</button>
    <button class="btn" style="background:#2E4250;color:#80A0C0;padding:12px 24px;font-size:12px" onclick="startGame('underground')">Underground Spring (1W)</button>
    <div style="color:#404858;font-size:8px;margin-top:8px">Erosion creates alluvial fans that produce seeds. Glacial carves deepest.</div>
  </div>`;
  document.getElementById('shopPanel').innerHTML='';
  document.getElementById('handPanel').innerHTML='';
  document.getElementById('topBar').innerHTML=`<span style="color:#4A88AA;font-size:10px;font-weight:700;letter-spacing:1.2px">RIVER FLOWS</span>`;
  document.getElementById('ctxBar').innerHTML='';
}

showStart();
</script>
