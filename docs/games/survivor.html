<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markov Chain Chatbot</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 1rem;
}
.container {
  width: 100%;
  max-width: 600px;
  background: white;
  border-radius: 1rem;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  height: 90vh;
  max-height: 700px;
}
.header {
  padding: 1.5rem;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-radius: 1rem 1rem 0 0;
  text-align: center;
}
.header h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
.header p { font-size: 0.85rem; opacity: 0.9; }
.stats {
  padding: 0.75rem 1.5rem;
  background: #f8f9fa;
  border-bottom: 1px solid #e0e0e0;
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  font-size: 0.8rem;
}
.stat {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  color: #555;
}
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.msg {
  display: flex;
  gap: 0.75rem;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg.user { flex-direction: row-reverse; }
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}
.msg.bot .avatar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.msg.user .avatar { background: #e0e0e0; }
.bubble {
  max-width: 75%;
  padding: 0.75rem 1rem;
  border-radius: 1rem;
  word-wrap: break-word;
}
.msg.bot .bubble {
  background: #f0f0f0;
  border-bottom-left-radius: 0.25rem;
}
.msg.user .bubble {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-bottom-right-radius: 0.25rem;
}
.input-area {
  padding: 1rem;
  border-top: 1px solid #e0e0e0;
  display: flex;
  gap: 0.5rem;
}
#userInput {
  flex: 1;
  padding: 0.75rem;
  border: 2px solid #e0e0e0;
  border-radius: 2rem;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.3s;
}
#userInput:focus { border-color: #667eea; }
button {
  padding: 0.75rem 1.5rem;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 2rem;
  font-size: 1rem;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}
button:active { transform: translateY(0); }
.typing {
  display: flex;
  gap: 0.3rem;
  padding: 0.5rem;
}
.typing span {
  width: 8px;
  height: 8px;
  background: #999;
  border-radius: 50%;
  animation: bounce 1.4s infinite ease-in-out;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}
.feedback-buttons {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.5rem;
  padding-top: 0.5rem;
  border-top: 1px solid #e0e0e0;
}
.feedback-btn {
  padding: 0.25rem 0.5rem;
  background: white;
  border: 1px solid #ddd;
  border-radius: 0.5rem;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.2s;
}
.feedback-btn:hover:not(:disabled) {
  transform: scale(1.1);
  border-color: #667eea;
}
.feedback-btn:disabled {
  cursor: not-allowed;
}
.learning-notification {
  text-align: center;
  padding: 0.75rem;
  background: #4caf50;
  color: white;
  border-radius: 0.5rem;
  margin: 0.5rem 0;
  animation: fadeIn 0.3s ease;
  font-size: 0.9rem;
}
.edit-btn, .regenerate-btn {
  padding: 0.25rem 0.5rem;
  background: white;
  border: 1px solid #ddd;
  border-radius: 0.5rem;
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
  margin-top: 0.5rem;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🤖 Advanced Markov Bot</h1>
    <p>RLHF • Beam Search • Embeddings • Memory</p>
  </div>
  <div class="stats" id="stats"></div>
  <div class="chat" id="chat"></div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type a message..." />
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
// Simplified version that actually works
class MarkovBot {
  constructor() {
    this.transitions = new Map();
    this.rewardWeights = new Map();
    this.valueNetwork = new Map();
    this.feedbackHistory = [];
    this.responseHistory = [];
    this.totalWords = 0;
    this.explorationRate = 0.3;
    this.order = 2;
    
    this.loadFromStorage();
  }

  saveToStorage() {
    try {
      const data = {
        transitions: Array.from(this.transitions.entries()).map(([k, v]) => [k, Array.from(v.entries())]),
        rewardWeights: Array.from(this.rewardWeights.entries()),
        valueNetwork: Array.from(this.valueNetwork.entries()),
        totalWords: this.totalWords
      };
      localStorage.setItem('markovBotMemory', JSON.stringify(data));
    } catch (e) {
      console.warn('Save failed:', e);
    }
  }

  loadFromStorage() {
    try {
      const stored = localStorage.getItem('markovBotMemory');
      if (!stored) return;
      
      const data = JSON.parse(stored);
      this.transitions = new Map(data.transitions.map(([k, v]) => [k, new Map(v)]));
      this.rewardWeights = new Map(data.rewardWeights || []);
      this.valueNetwork = new Map(data.valueNetwork || []);
      this.totalWords = data.totalWords || 0;
      
      console.log('Loaded:', this.transitions.size, 'contexts');
    } catch (e) {
      console.warn('Load failed:', e);
    }
  }

  clearMemory() {
    localStorage.removeItem('markovBotMemory');
    this.transitions.clear();
    this.rewardWeights.clear();
    this.valueNetwork.clear();
    this.totalWords = 0;
  }

  tokenize(text) {
    return text.toLowerCase()
      .replace(/([.!?])/g, ' $1')
      .split(/\s+/)
      .filter(t => t.length > 0);
  }

  train(text, rewardMultiplier = 1.0) {
    const words = this.tokenize(text);
    if (words.length < this.order + 1) return;

    for (let i = 0; i <= words.length - this.order - 1; i++) {
      const context = words.slice(i, i + this.order).join(' ');
      const next = words[i + this.order];
      
      if (!this.transitions.has(context)) {
        this.transitions.set(context, new Map());
      }
      
      const nextMap = this.transitions.get(context);
      nextMap.set(next, (nextMap.get(next) || 0) + 1);
      this.totalWords++;
      
      const key = `${context}→${next}`;
      const current = this.rewardWeights.get(key) || 1.0;
      this.rewardWeights.set(key, current * rewardMultiplier);
      
      if (!this.valueNetwork.has(context)) {
        this.valueNetwork.set(context, 0.5);
      }
    }
    
    if (Math.random() < 0.2) this.saveToStorage();
  }

  generate(seed = null) {
    if (this.transitions.size === 0) {
      return { text: "I need training first!", id: null };
    }
    
    const responseId = Date.now() + Math.random();
    
    // Get starting context
    let context;
    if (seed) {
      const seedWords = this.tokenize(seed);
      const contexts = Array.from(this.transitions.keys());
      let best = null;
      let maxScore = 0;
      
      for (const ctx of contexts) {
        const ctxWords = ctx.split(' ');
        const overlap = ctxWords.filter(w => seedWords.includes(w)).length;
        if (overlap > maxScore) {
          maxScore = overlap;
          best = ctx;
        }
      }
      
      context = best || contexts[Math.floor(Math.random() * contexts.length)];
    } else {
      const contexts = Array.from(this.transitions.keys());
      context = contexts[Math.floor(Math.random() * contexts.length)];
    }
    
    const result = context.split(' ');
    const transitions = [];
    
    for (let i = 0; i < 30; i++) {
      const currentContext = result.slice(-this.order).join(' ');
      const nextMap = this.transitions.get(currentContext);
      
      if (!nextMap || nextMap.size === 0) break;
      
      // Weighted random selection
      const candidates = Array.from(nextMap.entries());
      const weights = candidates.map(([word, count]) => {
        const key = `${currentContext}→${word}`;
        const reward = this.rewardWeights.get(key) || 1.0;
        return (count + 1) * reward * (0.7 + Math.random() * 0.6);
      });
      
      const total = weights.reduce((a, b) => a + b, 0);
      let rand = Math.random() * total;
      
      let nextWord = candidates[0][0];
      for (let j = 0; j < candidates.length; j++) {
        rand -= weights[j];
        if (rand <= 0) {
          nextWord = candidates[j][0];
          break;
        }
      }
      
      result.push(nextWord);
      transitions.push(`${currentContext}→${nextWord}`);
      
      if (nextWord.match(/[.!?]/) && result.length >= 10) break;
    }
    
    let text = result.join(' ')
      .replace(/\s+([.!?,])/g, '$1')
      .trim();
    
    text = text.charAt(0).toUpperCase() + text.slice(1);
    if (!text.match(/[.!?]$/)) text += '.';
    
    this.responseHistory.push({
      id: responseId,
      text: text,
      transitions: transitions,
      timestamp: Date.now()
    });
    
    if (this.responseHistory.length > 50) {
      this.responseHistory.shift();
    }
    
    return { text, id: responseId };
  }

  applyFeedback(responseId, isPositive, intensity = 1.0) {
    this.feedbackHistory.push({ responseId, isPositive, intensity, timestamp: Date.now() });
    
    const response = this.responseHistory.find(r => r.id === responseId);
    if (!response) return;
    
    const multiplier = isPositive ? (1.3 * intensity) : (0.7 / intensity);
    
    response.transitions.forEach(transition => {
      const current = this.rewardWeights.get(transition) || 1.0;
      this.rewardWeights.set(transition, current * multiplier);
    });
    
    if (isPositive) {
      this.train(response.text, 1.2);
    }
    
    if (this.feedbackHistory.length > 100) {
      this.feedbackHistory.shift();
    }
    
    this.saveToStorage();
  }
}

const bot = new MarkovBot();
let messageCounter = 0;
const conversationPairs = new Map();

// Training corpus
const corpus = [
  "The quick brown fox jumps over the lazy dog near the old wooden fence.",
  "I want to go to the store and buy some food for dinner tonight.",
  "She said that he would come back later in the day to help us.",
  "We need to make sure that everything is ready before they arrive here.",
  "Can you tell me what time it is right now please thank you very much.",
  "There are many people who live in this city and work every single day.",
  "When you see him can you ask if he knows where she went yesterday.",
  "They will have to do all of the work by themselves without any help.",
  "It was a very good day and we had so much fun at the park together.",
  "How are you doing today I hope you are feeling well and happy now.",
  "This is the best thing that has ever happened to me in my whole life.",
  "Do you know how to get there from here because I am not sure at all.",
  "She has been working very hard on this project for the last few weeks.",
  "We should probably leave soon if we want to get there on time tonight.",
  "He told me that he was going to call you back as soon as he could.",
];

corpus.forEach(text => bot.train(text));

function addMessage(text, isUser, responseId = null, messageId = null) {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = `msg ${isUser ? 'user' : 'bot'}`;
  
  if (messageId) msg.dataset.messageId = messageId;
  
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = isUser ? '👤' : '🤖';
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  
  if (!isUser && responseId) {
    const feedbackDiv = document.createElement('div');
    feedbackDiv.className = 'feedback-buttons';
    feedbackDiv.innerHTML = `
      <button class="feedback-btn" onclick="giveFeedback(${responseId}, true)">👍</button>
      <button class="feedback-btn" onclick="giveFeedback(${responseId}, false)">👎</button>
      <button class="regenerate-btn" onclick="regenerate(${messageId})">🔄</button>
    `;
    bubble.appendChild(feedbackDiv);
  }
  
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function giveFeedback(responseId, isPositive) {
  const intensity = 1.0;
  bot.applyFeedback(responseId, isPositive, intensity);
  
  const chat = document.getElementById('chat');
  const notification = document.createElement('div');
  notification.className = 'learning-notification';
  notification.textContent = isPositive ? '✓ Learned!' : '✓ Adjusted!';
  chat.appendChild(notification);
  
  setTimeout(() => notification.remove(), 1500);
  updateStats();
}

function regenerate(botMessageId) {
  let userText = '';
  for (const [uId, pair] of conversationPairs.entries()) {
    if (pair.botMessageId === botMessageId) {
      userText = pair.userText;
      break;
    }
  }
  
  if (!userText) return;
  
  const botMsg = document.querySelector(`[data-message-id="${botMessageId}"]`);
  if (botMsg) botMsg.remove();
  
  const result = bot.generate(userText);
  const newBotMessageId = messageCounter++;
  addMessage(result.text, false, result.id, newBotMessageId);
  updateStats();
}

function showTyping() {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = 'msg bot';
  msg.id = 'typing';
  
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '🤖';
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  
  bubble.appendChild(typing);
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const typing = document.getElementById('typing');
  if (typing) typing.remove();
}

function send() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  
  if (!text) return;
  
  const userMessageId = messageCounter++;
  addMessage(text, true, null, userMessageId);
  bot.train(text, 1.0);
  input.value = '';
  
  showTyping();
  
  setTimeout(() => {
    removeTyping();
    const result = bot.generate(text);
    const botMessageId = messageCounter++;
    conversationPairs.set(userMessageId, { botMessageId, userText: text });
    addMessage(result.text, false, result.id, botMessageId);
    updateStats();
  }, 800 + Math.random() * 700);
}

function clearAllMemory() {
  if (confirm('Clear all memory? This cannot be undone!')) {
    bot.clearMemory();
    location.reload();
  }
}

function updateStats() {
  const statsDiv = document.getElementById('stats');
  if (!statsDiv) return;
  
  const totalFeedback = bot.feedbackHistory.length;
  const positive = bot.feedbackHistory.filter(f => f.isPositive).length;
  const satisfaction = totalFeedback > 0 ? Math.round((positive / totalFeedback) * 100) : 0;
  
  statsDiv.innerHTML = `
    <div class="stat">🔗 ${bot.transitions.size}</div>
    <div class="stat">📝 ${bot.totalWords}</div>
    <div class="stat">👍 ${positive}/${totalFeedback}</div>
    <div class="stat">✨ ${satisfaction}%</div>
    <div class="stat">💾 Saved</div>
    <div class="stat"><button onclick="clearAllMemory()" style="padding:0.25rem 0.5rem;font-size:0.75rem;">Clear</button></div>
  `;
}

document.getElementById('userInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') send();
});

addMessage("Hello! I'm a Markov bot with RLHF and persistent memory. Chat with me!", false);
setTimeout(updateStats, 100);
</script>
</body>
</html>
