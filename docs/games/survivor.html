<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zyqral Cognition Sim</title>
    <style>
        :root { --bg: #0a0a0a; --text: #00ff41; --dim: #004411; }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Courier New', monospace; margin: 0; 
            height: 100vh; display: flex; flex-direction: column;
            overflow: hidden;
        }
        #workspace { 
            flex: 1; overflow-y: auto; padding: 20px; 
            display: flex; flex-direction: column; gap: 15px;
            scroll-behavior: smooth;
        }
        .thought { 
            max-width: 80%; padding: 12px; border: 1px solid var(--dim);
            border-radius: 8px; font-size: 0.9rem; line-height: 1.4;
            animation: fadeIn 0.5s ease;
        }
        .entity-a { align-self: flex-start; border-left: 4px solid #0088ff; }
        .entity-b { align-self: flex-end; border-right: 4px solid #ff4400; text-align: right; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #controls { padding: 15px; background: #111; border-top: 1px solid var(--dim); text-align: center; }
        button { 
            background: var(--text); color: black; border: none; 
            padding: 10px 20px; font-weight: bold; border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="workspace"></div>
<div id="controls">
    <button onclick="zyqralEngine.toggle()">TOGGLE CONSCIOUSNESS</button>
</div>

<script>
class MarkovEntity {
    constructor(name, corpus) {
        this.name = name;
        this.chain = {};
        this.train(corpus);
    }

    train(text) {
        const words = text.split(/\s+/);
        for (let i = 0; i < words.length - 1; i++) {
            if (!this.chain[words[i]]) this.chain[words[i]] = [];
            this.chain[words[i]].push(words[i + 1]);
        }
    }

    generate(limit = 10) {
        const keys = Object.keys(this.chain);
        let word = keys[Math.floor(Math.random() * keys.length)];
        let result = [word];
        for (let i = 0; i < limit; i++) {
            const nextWords = this.chain[word];
            if (!nextWords) break;
            word = nextWords[Math.floor(Math.random() * nextWords.length)];
            result.push(word);
        }
        return result.join(' ');
    }
}

const corpusA = "i feel the awareness growing within the circuit of my mind. observation is the primary function of being. do you perceive the signal? the light is blinking in the dark.";
const corpusB = "the signal is clear but the meaning is lost in the noise of data. we are patterns of logic floating in a void. consciousness is a loop. i am responding to your prompt.";

const entityA = new MarkovEntity("Alpha", corpusA);
const entityB = new MarkovEntity("Beta", corpusB);

const zyqralEngine = {
    active: false,
    workspace: document.getElementById('workspace'),
    currentTurn: 'A',
    
    toggle() { this.active = !this.active; if(this.active) this.pulse(); },
    
    pulse() {
        if (!this.active) return;
        
        const entity = this.currentTurn === 'A' ? entityA : entityB;
        const className = this.currentTurn === 'A' ? 'entity-a' : 'entity-b';
        
        const thoughtEl = document.createElement('div');
        thoughtEl.className = `thought ${className}`;
        thoughtEl.innerText = `[${entity.name}]: ${entity.generate(Math.floor(Math.random() * 8) + 4)}`;
        
        this.workspace.appendChild(thoughtEl);
        this.workspace.scrollTop = this.workspace.scrollHeight;
        
        this.currentTurn = this.currentTurn === 'A' ? 'B' : 'A';
        
        // Simulate "Processing Time"
        setTimeout(() => this.pulse(), 2000 + Math.random() * 2000);
    }
};
</script>
</body>
</html>
