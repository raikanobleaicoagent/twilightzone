<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zyqral: Territorial Consciousness</title>
    <style>
        :root { --bg: #050505; --ui: #00ffaa; --panel: rgba(0, 10, 10, 0.9); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Courier New', monospace; color: var(--ui); }
        canvas { display: block; touch-action: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #controls { position: absolute; bottom: 0; left: 0; width: 100%; background: var(--panel); padding: 15px; pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: space-around; font-size: 12px; border-top: 2px solid var(--ui); }
        #info-panel { position: absolute; top: 10px; left: 10px; background: var(--panel); padding: 12px; border: 1px solid var(--ui); pointer-events: auto; width: 260px; font-size: 11px; display: none; box-shadow: 0 0 15px rgba(0,255,170,0.2); }
        .thought-box { border-left: 2px solid #555; padding-left: 8px; margin-top: 8px; color: #fff; font-style: italic; min-height: 40px; }
        .control-item { display: flex; flex-direction: column; align-items: center; margin: 5px; }
        input[type=range] { width: 90px; accent-color: var(--ui); }
        button { background: transparent; border: 1px solid var(--ui); color: var(--ui); padding: 5px 10px; cursor: pointer; }
        button:hover { background: var(--ui); color: #000; }
    </style>
</head>
<body>

    <canvas id="simCanvas"></canvas>
    <div id="ui-layer">
        <div id="info-panel">
            <h3 id="ent-name" style="margin:0 0 5px 0; color:var(--ui);">ENTITY</h3>
            <div id="ent-stats"></div>
            <div style="margin-top:10px; color:var(--ui); font-weight:bold;">CHAIN OF THOUGHT:</div>
            <div id="ent-thought" class="thought-box"></div>
        </div>
        <div id="controls">
            <div class="control-item"><label>Time Speed</label><input type="range" id="speed-slider" min="0" max="10" step="0.5" value="1"></div>
            <div class="control-item"><label>Aggression</label><input type="range" id="aggro-slider" min="0" max="1" step="0.1" value="0.3"></div>
            <div class="control-item"><button onclick="resetSim()">REBOOT WORLD</button></div>
        </div>
    </div>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height, timeSpeed = 1, globalAggro = 0.3, simTicks = 0, dayCount = 0;
let animals = [], plants = [], eggs = [], particles = [];

const DNA_TYPES = { SOCIAL: 0, AGGRESSIVE: 1, CAUTIOUS: 2 };
const THOUGHT_POOL = [
    "I must secure the borders.", "Is there more to life than green leaves?",
    "That entity looks suspicious.", "The sun is too bright today.",
    "I should find a place to rest.", "My lineage must endure.",
    "Hunger is a shadow that never leaves.", "What lies beyond the edge?"
];

// --- CLASSES ---

class Egg {
    constructor(x, y, dna, parentId) {
        this.x = x; this.y = y; this.dna = dna; this.parentId = parentId;
        this.hatchTimer = 500 / (timeSpeed || 1);
        this.alive = true;
    }
    update() {
        this.hatchTimer -= timeSpeed;
        if (this.hatchTimer <= 0) {
            this.alive = false;
            animals.push(new Animal(this.x, this.y, this.dna));
        }
    }
    draw() {
        ctx.fillStyle = "#eee";
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, 4, 6, 0, 0, Math.PI*2);
        ctx.fill();
    }
}

class Animal {
    constructor(x, y, dna = null) {
        this.x = x; this.y = y;
        this.dna = dna || {
            speed: Math.random() * 1.5 + 1,
            size: Math.random() * 3 + 4,
            metabolism: Math.random() * 0.5 + 0.5,
            color: `hsl(${Math.random()*360}, 70%, 50%)`,
            socialScore: Math.random(),
            territoriality: Math.random(),
            type: Math.floor(Math.random()*3)
        };
        this.id = Math.random().toString(36).substr(2, 4).toUpperCase();
        this.angle = Math.random() * Math.PI * 2;
        this.energy = 100;
        this.age = 0;
        this.alive = true;
        this.maxAge = 14000; // 7 days (2000 ticks per day)
        
        // Behavioral State
        this.state = 'WANDER';
        this.target = null;
        this.homeX = x; this.homeY = y; // Territory center
        
        // Cognitive Layer (Chain of Thought)
        this.thought = "Initialization complete.";
        this.internalPlan = null; // Independent of state
        this.planTimer = 0;
        this.rationality = Math.random(); // Probability of following plan vs impulse
    }

    update() {
        this.age += timeSpeed;
        this.energy -= 0.015 * this.dna.metabolism * timeSpeed;
        if (this.energy <= 0 || this.age > this.maxAge) this.alive = false;

        this.processThoughts();
        this.decideAction();
        this.move();
    }

    processThoughts() {
        this.planTimer -= timeSpeed;
        if (this.planTimer <= 0) {
            // Planning phase: Independent of what animal is actually doing
            let randThought = THOUGHT_POOL[Math.floor(Math.random() * THOUGHT_POOL.length)];
            this.thought = randThought;
            this.planTimer = Math.random() * 300 + 200;
            
            // Set an internal plan that may or may not be followed
            if (Math.random() < 0.3) this.internalPlan = 'SEEK_HOME';
            else if (Math.random() < 0.2) this.internalPlan = 'FIND_FRIENDS';
            else this.internalPlan = null;
        }
    }

    decideAction() {
        // Impulse check (Hunger is priority 1)
        if (this.energy < 40) {
            this.state = 'FORAGING';
            this.findFood();
            return;
        }

        // Territorial Aggression check
        for (let other of animals) {
            if (other === this) continue;
            let d = Math.hypot(this.x - other.x, this.y - other.y);
            if (d < 50 && this.dna.territoriality > 0.6) {
                this.state = 'DEFENDING';
                this.target = other;
                this.thought = "Intruder detected. Neutralizing.";
                return;
            }
        }

        // Reproduction (Egg laying)
        if (this.energy > 85 && Math.random() < 0.002) {
            this.layEgg();
        }

        // Logic check: Follow internal plan?
        if (this.internalPlan && Math.random() < this.rationality) {
            this.state = this.internalPlan;
        } else {
            if (this.state !== 'FORAGING' && this.state !== 'DEFENDING') {
                this.state = 'WANDER';
            }
        }
    }

    findFood() {
        let closest = null, minD = 200;
        plants.forEach(p => {
            let d = Math.hypot(this.x - p.x, this.y - p.y);
            if (d < minD) { minD = d; closest = p; }
        });
        this.target = closest;
    }

    layEgg() {
        eggs.push(new Egg(this.x, this.y, {...this.dna}, this.id));
        this.energy -= 40;
        this.thought = "The lineage is preserved.";
    }

    move() {
        let spd = this.dna.speed * timeSpeed;
        if (this.state === 'FORAGING' && this.target) {
            let angleTo = Math.atan2(this.target.y - this.y, this.target.x - this.x);
            this.angle = angleTo;
            if (Math.hypot(this.x - this.target.x, this.y - this.target.y) < 5) {
                this.energy = Math.min(100, this.energy + 20);
                this.target.alive = false;
                this.target = null;
            }
        } else if (this.state === 'DEFENDING' && this.target) {
            let angleTo = Math.atan2(this.target.y - this.y, this.target.x - this.x);
            this.angle = angleTo;
            // Push the intruder away (simplified social interaction)
            this.target.x += Math.cos(this.angle) * 2;
            this.target.y += Math.sin(this.angle) * 2;
        } else if (this.state === 'SEEK_HOME') {
            this.angle = Math.atan2(this.homeY - this.y, this.homeX - this.x);
        } else {
            if (Math.random() < 0.05) this.angle += (Math.random() - 0.5);
        }

        this.x += Math.cos(this.angle) * spd;
        this.y += Math.sin(this.angle) * spd;

        // Screen wrap
        if (this.x < 0) this.x = width; if (this.x > width) this.x = 0;
        if (this.y < 0) this.y = height; if (this.y > height) this.y = 0;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        // Sight Cone
        ctx.fillStyle = "rgba(0, 255, 170, 0.05)";
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.arc(0,0, 60, -0.6, 0.6);
        ctx.fill();

        // Body
        ctx.fillStyle = this.dna.color;
        ctx.beginPath();
        ctx.arc(0, 0, this.dna.size, 0, Math.PI*2);
        ctx.fill();
        
        // Head/Direction
        ctx.fillStyle = "#fff";
        ctx.fillRect(this.dna.size - 2, -1, 3, 2);
        ctx.restore();
    }
}

class Plant {
    constructor(x, y) {
        this.x = x; this.y = y; this.alive = true; this.size = Math.random() * 3 + 2;
    }
    draw() {
        ctx.fillStyle = "#2a2";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
    }
}

// --- ENGINE ---

function init() {
    resize();
    resetSim();
    window.addEventListener('resize', resize);
    canvas.addEventListener('pointerdown', selectEntity);
    requestAnimationFrame(loop);
}

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

function resetSim() {
    animals = []; plants = []; eggs = [];
    for(let i=0; i<15; i++) animals.push(new Animal(Math.random()*width, Math.random()*height));
    for(let i=0; i<40; i++) plants.push(new Plant(Math.random()*width, Math.random()*height));
}

let selected = null;
function selectEntity(e) {
    const rect = canvas.getBoundingClientRect();
    const ex = e.clientX - rect.left, ey = e.clientY - rect.top;
    selected = animals.find(a => Math.hypot(a.x - ex, a.y - ey) < 20) || null;
    document.getElementById('info-panel').style.display = selected ? 'block' : 'none';
}

function loop() {
    timeSpeed = parseFloat(document.getElementById('speed-slider').value);
    globalAggro = parseFloat(document.getElementById('aggro-slider').value);

    // Environment
    ctx.fillStyle = "#050808";
    ctx.fillRect(0, 0, width, height);
    
    // Plant growth
    if (Math.random() < 0.05 * timeSpeed && plants.length < 100) {
        plants.push(new Plant(Math.random()*width, Math.random()*height));
    }

    // Process Entities
    plants = plants.filter(p => p.alive);
    plants.forEach(p => p.draw());

    eggs = eggs.filter(e => e.alive);
    eggs.forEach(e => { e.update(); e.draw(); });

    animals = animals.filter(a => a.alive);
    animals.forEach(a => {
        a.update();
        a.draw();
    });

    if (selected) {
        document.getElementById('ent-name').innerText = `ENTITY ${selected.id}`;
        document.getElementById('ent-stats').innerHTML = `
            AGE: ${Math.floor(selected.age)} | ENERGY: ${Math.floor(selected.energy)}%<br>
            STATE: <span style="color:#fff">${selected.state}</span><br>
            PLAN: <span style="color:#aaa">${selected.internalPlan || 'NONE'}</span>
        `;
        document.getElementById('ent-thought').innerText = selected.thought;
    }

    requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
