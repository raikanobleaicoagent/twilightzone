<script>
class TrueMarkovChain {
  constructor(order = 2) {
    this.order = order;
    this.transitions = new Map(); // word -> {nextWord: count}
    this.rewardWeights = new Map();
    this.feedbackHistory = [];
    this.responseHistory = [];
    this.totalWords = 0;
  }

  train(text, rewardMultiplier = 1.0) {
    const words = this.tokenize(text);
    if (words.length < this.order + 1) return;

    for (let i = 0; i <= words.length - this.order - 1; i++) {
      const context = words.slice(i, i + this.order).join(' ');
      const next = words[i + this.order];
      
      if (!this.transitions.has(context)) {
        this.transitions.set(context, new Map());
      }
      
      const nextMap = this.transitions.get(context);
      nextMap.set(next, (nextMap.get(next) || 0) + 1);
      this.totalWords++;
      
      // Initialize reward weight
      const key = `${context}→${next}`;
      const current = this.rewardWeights.get(key) || 1.0;
      this.rewardWeights.set(key, current * rewardMultiplier);
    }
  }

  tokenize(text) {
    return text.toLowerCase()
      .replace(/([.!?])/g, ' $1')
      .split(/\s+/)
      .filter(t => t.length > 0);
  }

  getStartContext(seed) {
    if (!seed) {
      const contexts = Array.from(this.transitions.keys());
      return contexts[Math.floor(Math.random() * contexts.length)];
    }
    
    const seedWords = this.tokenize(seed);
    const contexts = Array.from(this.transitions.keys());
    
    // Find contexts that contain seed words
    let bestContext = null;
    let maxOverlap = 0;
    
    for (const ctx of contexts) {
      const ctxWords = ctx.split(' ');
      const overlap = ctxWords.filter(w => seedWords.includes(w)).length;
      
      if (overlap > maxOverlap || (overlap === maxOverlap && Math.random() > 0.5)) {
        maxOverlap = overlap;
        bestContext = ctx;
      }
    }
    
    return bestContext || contexts[Math.floor(Math.random() * contexts.length)];
  }

  generateNextWord(context) {
    const nextMap = this.transitions.get(context);
    if (!nextMap || nextMap.size === 0) return null;
    
    const candidates = Array.from(nextMap.entries());
    const weights = candidates.map(([word, count]) => {
      const key = `${context}→${word}`;
      const reward = this.rewardWeights.get(key) || 1.0;
      const freq = count / this.totalWords;
      const rarity = 1 / (freq * 1000 + 1);
      const exploration = 0.7 + Math.random() * 0.6;
      
      return (count + 1) * reward * rarity * exploration;
    });
    
    const total = weights.reduce((a, b) => a + b, 0);
    let rand = Math.random() * total;
    
    for (let i = 0; i < candidates.length; i++) {
      rand -= weights[i];
      if (rand <= 0) return candidates[i][0];
    }
    
    return candidates[0][0];
  }

  generate(seed = null, minWords = 10, maxWords = 40) {
    if (this.transitions.size === 0) {
      return { text: "I need training data first!", id: null };
    }
    
    const responseId = Date.now() + Math.random();
    const transitions = [];
    
    // Start with seed-based context
    let context = this.getStartContext(seed);
    const result = context.split(' ');
    
    let attempts = 0;
    let sentenceEnded = false;
    
    while (result.length < maxWords && attempts < maxWords * 2) {
      attempts++;
      
      // Get current context window
      const currentContext = result.slice(-this.order).join(' ');
      
      // Generate next word
      const nextWord = this.generateNextWord(currentContext);
      
      if (!nextWord) {
        // Fallback: get a random context
        const randomContext = Array.from(this.transitions.keys())[
          Math.floor(Math.random() * this.transitions.size)
        ];
        const fallbackWord = this.generateNextWord(randomContext);
        if (fallbackWord) {
          result.push(fallbackWord);
          transitions.push(`${randomContext}→${fallbackWord}`);
        } else {
          break;
        }
        continue;
      }
      
      result.push(nextWord);
      transitions.push(`${currentContext}→${nextWord}`);
      
      // Check for sentence ending
      if (nextWord.match(/[.!?]/)) {
        sentenceEnded = true;
        if (result.length >= minWords && Math.random() > 0.3) {
          break;
        }
      }
    }
    
    let text = result.join(' ')
      .replace(/\s+([.!?,])/g, '$1')
      .replace(/\s+/g, ' ')
      .trim();
    
    text = text.charAt(0).toUpperCase() + text.slice(1);
    
    // Ensure it ends with punctuation
    if (!text.match(/[.!?]$/)) {
      text += '.';
    }
    
    this.responseHistory.push({
      id: responseId,
      text: text,
      transitions: transitions,
      timestamp: Date.now()
    });
    
    if (this.responseHistory.length > 50) {
      this.responseHistory.shift();
    }
    
    return { text, id: responseId };
  }

  applyFeedback(responseId, isPositive) {
    const feedback = { responseId, isPositive, timestamp: Date.now() };
    this.feedbackHistory.push(feedback);
    
    const response = this.responseHistory.find(r => r.id === responseId);
    if (!response) return;
    
    const multiplier = isPositive ? 1.5 : 0.6;
    
    response.transitions.forEach(transition => {
      const current = this.rewardWeights.get(transition) || 1.0;
      this.rewardWeights.set(transition, current * multiplier);
    });
    
    if (isPositive) {
      this.train(response.text, 1.3);
    }
    
    if (this.feedbackHistory.length > 100) {
      this.feedbackHistory.shift();
    }
  }
}

  "She found her voice and used it to speak up for what she believed in strongly.",
  "It is not about having everything it is about appreciating what you already have now.",
  "He gave generously to others expecting nothing in return and that made him rich indeed.",
  "We should live each day with intention purpose and gratitude for all our blessings always.",
];

corpus.forEach(text => bot.train(text));

function addMessage(text, isUser, responseId = null, messageId = null) {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = `msg ${isUser ? 'user' : 'bot'}`;
  
  if (messageId) {
    msg.dataset.messageId = messageId;
  }
  
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = isUser ? '👤' : '🤖';
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  
  const textSpan = document.createElement('span');
  textSpan.textContent = text;
  textSpan.className = 'message-text';
  bubble.appendChild(textSpan);
  
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  
  // Add edit button to user messages
  if (isUser && messageId) {
    const editBtn = document.createElement('button');
    editBtn.className = 'edit-btn';
    editBtn.textContent = '✏️ Edit';
    editBtn.onclick = () => editMessage(messageId);
    bubble.appendChild(editBtn);
  }
  
  // Add feedback and regenerate to bot messages
  if (!isUser && responseId) {
    const actionsDiv = document.createElement('div');
    actionsDiv.style.marginTop = '0.5rem';
    actionsDiv.style.display = 'flex';
    actionsDiv.style.gap = '0.5rem';
    actionsDiv.style.flexWrap = 'wrap';
    
    const feedbackDiv = document.createElement('div');
    feedbackDiv.className = 'feedback-buttons';
    feedbackDiv.style.flex = '1';
    feedbackDiv.style.margin = '0';
    feedbackDiv.style.padding = '0';
    feedbackDiv.style.border = 'none';
    feedbackDiv.innerHTML = `
      <button class="feedback-btn thumbs-up" onclick="giveFeedback(${responseId}, true)" title="Good response">👍</button>
      <button class="feedback-btn thumbs-down" onclick="giveFeedback(${responseId}, false)" title="Bad response">👎</button>
    `;
    
    const regenBtn = document.createElement('button');
    regenBtn.className = 'regenerate-btn';
    regenBtn.innerHTML = '🔄 Regenerate';
    regenBtn.onclick = () => regenerateResponse(messageId);
    
    actionsDiv.appendChild(feedbackDiv);
    actionsDiv.appendChild(regenBtn);
    bubble.appendChild(actionsDiv);
  }
  
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  
  return messageId;
}

function editMessage(messageId) {
  const msg = document.querySelector(`[data-message-id="${messageId}"]`);
  if (!msg) return;
  
  const bubble = msg.querySelector('.bubble');
  const textSpan = bubble.querySelector('.message-text');
  const currentText = textSpan.textContent;
  
  // Create edit interface
  const editInput = document.createElement('textarea');
  editInput.className = 'edit-input';
  editInput.value = currentText;
  editInput.rows = 3;
  
  const editActions = document.createElement('div');
  editActions.className = 'edit-actions';
  
  const saveBtn = document.createElement('button');
  saveBtn.textContent = '✓ Save & Regenerate';
  saveBtn.onclick = () => saveEdit(messageId, editInput.value);
  
  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = '✕ Cancel';
  cancelBtn.style.background = '#6c757d';
  cancelBtn.onclick = () => cancelEdit(messageId);
  
  editActions.appendChild(saveBtn);
  editActions.appendChild(cancelBtn);
  
  // Hide original text and edit button
  textSpan.style.display = 'none';
  bubble.querySelector('.edit-btn').style.display = 'none';
  
  // Add edit interface
  bubble.insertBefore(editInput, textSpan.nextSibling);
  bubble.insertBefore(editActions, editInput.nextSibling);
  
  editInput.focus();
  editInput.select();
}

function cancelEdit(messageId) {
  const msg = document.querySelector(`[data-message-id="${messageId}"]`);
  if (!msg) return;
  
  const bubble = msg.querySelector('.bubble');
  const textSpan = bubble.querySelector('.message-text');
  const editInput = bubble.querySelector('.edit-input');
  const editActions = bubble.querySelector('.edit-actions');
  
  textSpan.style.display = '';
  bubble.querySelector('.edit-btn').style.display = '';
  editInput.remove();
  editActions.remove();
}

function saveEdit(messageId, newText) {
  if (!newText.trim()) return;
  
  const msg = document.querySelector(`[data-message-id="${messageId}"]`);
  if (!msg) return;
  
  const bubble = msg.querySelector('.bubble');
  const textSpan = bubble.querySelector('.message-text');
  const editInput = bubble.querySelector('.edit-input');
  const editActions = bubble.querySelector('.edit-actions');
  
  // Update text
  textSpan.textContent = newText;
  textSpan.style.display = '';
  bubble.querySelector('.edit-btn').style.display = '';
  editInput.remove();
  editActions.remove();
  
  // Train on new text
  bot.train(newText, 1.0);
  
  // Remove old bot response and regenerate
  const pair = conversationPairs.get(messageId);
  if (pair) {
    const botMsg = document.querySelector(`[data-message-id="${pair.botMessageId}"]`);
    if (botMsg) botMsg.remove();
  }
  
  // Generate new response
  showTyping();
  setTimeout(() => {
    removeTyping();
    const result = bot.generate(newText, 10, 40);
    const botMessageId = messageCounter++;
    conversationPairs.set(messageId, { botMessageId, userText: newText });
    addMessage(result.text, false, result.id, botMessageId);
    updateStats();
  }, 800 + Math.random() * 700);
}

function regenerateResponse(botMessageId) {
  if (abComparisonActive) return; // Prevent during A/B test
  
  // Find the user message that prompted this response
  let userMessageId = null;
  let userText = '';
  
  for (const [uId, pair] of conversationPairs.entries()) {
    if (pair.botMessageId === botMessageId) {
      userMessageId = uId;
      userText = pair.userText;
      break;
    }
  }
  
  if (!userText) return;
  
  // Ask if user wants A/B comparison
  const wantsAB = confirm("Generate A/B comparison? (OK = Yes, Cancel = Just regenerate)");
  
  if (wantsAB) {
    startABComparison(userMessageId, userText, botMessageId);
  } else {
    // Simple regeneration
    const botMsg = document.querySelector(`[data-message-id="${botMessageId}"]`);
    if (botMsg) botMsg.remove();
    
    showTyping();
    setTimeout(() => {
      removeTyping();
      const result = bot.generate(userText, 10, 40);
      const newBotMessageId = messageCounter++;
      conversationPairs.set(userMessageId, { botMessageId: newBotMessageId, userText });
      addMessage(result.text, false, result.id, newBotMessageId);
      updateStats();
    }, 800 + Math.random() * 700);
  }
}

function startABComparison(userMessageId, userText, oldBotMessageId) {
  abComparisonActive = true;
  
  // Remove old bot message
  const botMsg = document.querySelector(`[data-message-id="${oldBotMessageId}"]`);
  if (botMsg) botMsg.remove();
  
  // Generate two different responses
  showTyping();
  
  setTimeout(() => {
    removeTyping();
    
    const resultA = bot.generate(userText, 10, 40);
    const resultB = bot.generate(userText, 10, 40);
    
    // Store results globally for access
    window.abResults = { 
      A: resultA, 
      B: resultB,
      userMessageId: userMessageId,
      userText: userText
    };
    
    // Create A/B comparison UI
    const chat = document.getElementById('chat');
    const abContainer = document.createElement('div');
    abContainer.className = 'ab-comparison';
    abContainer.id = 'ab-comparison';
    
    const titleDiv = document.createElement('div');
    titleDiv.className = 'ab-title';
    titleDiv.textContent = '🔬 A/B Comparison - Choose the Better Response';
    
    const optionsDiv = document.createElement('div');
    optionsDiv.className = 'ab-options';
    
    // Option A
    const optionA = document.createElement('div');
    optionA.className = 'ab-option';
    optionA.setAttribute('data-option', 'A');
    optionA.onclick = () => selectABOption('A');
    optionA.innerHTML = `
      <div class="ab-label">Option A (Coherence: ${(resultA.coherence || 1.0).toFixed(2)})</div>
      <div class="ab-text">${resultA.text}</div>
    `;
    
    // Option B
    const optionB = document.createElement('div');
    optionB.className = 'ab-option';
    optionB.setAttribute('data-option', 'B');
    optionB.onclick = () => selectABOption('B');
    optionB.innerHTML = `
      <div class="ab-label">Option B (Coherence: ${(resultB.coherence || 1.0).toFixed(2)})</div>
      <div class="ab-text">${resultB.text}</div>
    `;
    
    optionsDiv.appendChild(optionA);
    optionsDiv.appendChild(optionB);
    
    // Actions
    const actionsDiv = document.createElement('div');
    actionsDiv.className = 'ab-actions';
    
    const btnA = document.createElement('button');
    btnA.textContent = 'Choose A';
    btnA.onclick = () => confirmABChoice('A');
    
    const btnB = document.createElement('button');
    btnB.textContent = 'Choose B';
    btnB.onclick = () => confirmABChoice('B');
    
    const btnBoth = document.createElement('button');
    btnBoth.textContent = 'Both Good';
    btnBoth.style.background = '#28a745';
    btnBoth.onclick = () => confirmABChoice('both');
    
    const btnCancel = document.createElement('button');
    btnCancel.textContent = 'Cancel';
    btnCancel.style.background = '#6c757d';
    btnCancel.onclick = cancelABComparison;
    
    actionsDiv.appendChild(btnA);
    actionsDiv.appendChild(btnB);
    actionsDiv.appendChild(btnBoth);
    actionsDiv.appendChild(btnCancel);
    
    abContainer.appendChild(titleDiv);
    abContainer.appendChild(optionsDiv);
    abContainer.appendChild(actionsDiv);
    
    chat.appendChild(abContainer);
    chat.scrollTop = chat.scrollHeight;
  }, 800 + Math.random() * 700);
}

function selectABOption(option) {
  const options = document.querySelectorAll('.ab-option');
  options.forEach(opt => opt.classList.remove('selected'));
  
  const selected = document.querySelector(`[data-option="${option}"]`);
  if (selected) selected.classList.add('selected');
}

function confirmABChoice(choice) {
  const abContainer = document.getElementById('ab-comparison');
  if (!abContainer || !window.abResults) return;
  
  const resultA = window.abResults.A;
  const resultB = window.abResults.B;
  const userMessageId = window.abResults.userMessageId;
  const userText = window.abResults.userText;
  
  let chosenResult = null;
  
  if (choice === 'A') {
    // A is better, give positive feedback to A, negative to B
    bot.applyFeedback(resultA.id, true, 1.5);
    bot.applyFeedback(resultB.id, false, 1.0);
    chosenResult = resultA;
  } else if (choice === 'B') {
    // B is better, give positive feedback to B, negative to A
    bot.applyFeedback(resultB.id, true, 1.5);
    bot.applyFeedback(resultA.id, false, 1.0);
    chosenResult = resultB;
  } else if (choice === 'both') {
    // Both good, positive feedback to both
    bot.applyFeedback(resultA.id, true, 1.0);
    bot.applyFeedback(resultB.id, true, 1.0);
    chosenResult = resultA; // Use A by default
  }
  
  // Remove A/B comparison
  abContainer.remove();
  
  // Add chosen message
  const newBotMessageId = messageCounter++;
  conversationPairs.set(userMessageId, { botMessageId: newBotMessageId, userText });
  addMessage(chosenResult.text, false, chosenResult.id, newBotMessageId);
  
  // Show learning notification
  const chat = document.getElementById('chat');
  const notification = document.createElement('div');
  notification.className = 'learning-notification';
  notification.textContent = choice === 'both' 
    ? '✓ Learning from both responses!' 
    : `✓ Learning: ${choice} was better!`;
  chat.appendChild(notification);
  
  setTimeout(() => notification.remove(), 2000);
  
  abComparisonActive = false;
  updateStats();
  
  // Clean up
  delete window.abResults;
}

function cancelABComparison() {
  const abContainer = document.getElementById('ab-comparison');
  if (abContainer) abContainer.remove();
  
  abComparisonActive = false;
  delete window.abResults;
}

function giveFeedback(responseId, isPositive) {
  // Show intensity selector for more granular feedback
  const intensity = prompt(isPositive 
    ? "How good? (1=ok, 2=good, 3=excellent)" 
    : "How bad? (1=slightly off, 2=bad, 3=very bad)", "2");
  
  const intensityValue = parseFloat(intensity) || 2;
  const normalizedIntensity = Math.max(1, Math.min(3, intensityValue)) / 2; // 0.5 to 1.5
  
  bot.applyFeedback(responseId, isPositive, normalizedIntensity);
  
  const buttons = document.querySelectorAll(`button[onclick*="${responseId}"]`);
  buttons.forEach(btn => {
    btn.disabled = true;
    btn.style.opacity = '0.5';
  });
  
  const chat = document.getElementById('chat');
  const notification = document.createElement('div');
  notification.className = 'learning-notification';
  notification.textContent = isPositive 
    ? `✓ Reinforcing with strength ${intensityValue}/3!` 
    : `✓ Reducing with strength ${intensityValue}/3!`;
  chat.appendChild(notification);
  
  setTimeout(() => notification.remove(), 2000);
  updateStats();
}

function showTyping() {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = 'msg bot';
  msg.id = 'typing';
  
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '🤖';
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  
  bubble.appendChild(typing);
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const typing = document.getElementById('typing');
  if (typing) typing.remove();
}

function send() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  
  if (!text) return;
  
  const userMessageId = messageCounter++;
  addMessage(text, true, null, userMessageId);
  bot.train(text, 1.0);
  input.value = '';
  
  showTyping();
  
  setTimeout(() => {
    removeTyping();
    const result = bot.generate(text, 10, 40);
    const botMessageId = messageCounter++;
    
    // Store episode in long-term memory
    bot.storeEpisode(text, result.text);
    
    conversationPairs.set(userMessageId, { botMessageId, userText: text });
    addMessage(result.text, false, result.id, botMessageId);
    updateStats();
  }, 800 + Math.random() * 700);
}

function clearAllMemory() {
  if (confirm('Clear all long-term memory? This cannot be undone!')) {
    bot.clearMemory();
    location.reload();
  }
}

function updateStats() {
  const statsDiv = document.getElementById('stats');
  if (!statsDiv) return;
  
  const totalFeedback = bot.feedbackHistory.length;
  const positive = bot.feedbackHistory.filter(f => f.isPositive).length;
  const satisfaction = totalFeedback > 0 ? Math.round((positive / totalFeedback) * 100) : 0;
  
  // Calculate average coherence of recent responses
  const recentResponses = bot.responseHistory.slice(-5);
  const avgCoherence = recentResponses.length > 0
    ? recentResponses.reduce((sum, r) => sum + (r.coherenceScore || 1), 0) / recentResponses.length
    : 1.0;
  
  // Calculate exploration rate percentage
  const explorationPct = Math.round((bot.explorationRate || 0.3) * 100);
  
  // Safe access to Maps with defaults
  const transitionsSize = bot.transitions ? bot.transitions.size : 0;
  const rewardWeightsSize = bot.rewardWeights ? bot.rewardWeights.size : 0;
  const valueNetworkSize = bot.valueNetwork ? bot.valueNetwork.size : 0;
  
  statsDiv.innerHTML = `
    <div class="stat">🔗 Contexts: ${transitionsSize}</div>
    <div class="stat">📝 Words: ${bot.totalWords || 0}</div>
    <div class="stat">👍 ${positive}/${totalFeedback}</div>
    <div class="stat">✨ ${satisfaction}%</div>
    <div class="stat">🎯 Rewards: ${rewardWeightsSize}</div>
    <div class="stat">🧠 Values: ${valueNetworkSize}</div>
    <div class="stat">📊 Coherence: ${avgCoherence.toFixed(2)}</div>
    <div class="stat">🔍 Explore: ${explorationPct}%</div>
  `;
}

document.getElementById('userInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') send();
});

addMessage("Hello! I'm an advanced Markov bot with: PPO-RLHF, beam search generation, 50-dimensional word embeddings, long-term persistent memory (localStorage), episodic recall, and coherence optimization. I remember across sessions! 💾🧠", false);

setTimeout(updateStats, 100);
</script>
