  border-radius: 2rem;

  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;

  gap: 0.3rem;
  padding: 0.5rem;

.typing span {

<script>
class MarkovChain {
  constructor(order = 2) {
    this.order = order;
    this.chain = new Map();
    this.startTokens = [];
    this.contextMemory = [];
    this.maxMemory = 5;
    this.rewardWeights = new Map(); // RLHF: track rewards for state transitions
    this.feedbackHistory = []; // Store feedback for learning
    this.responseHistory = []; // Track generated responses
  }

  train(text, rewardMultiplier = 1.0) {
    const tokens = this.tokenize(text);
    if (tokens.length < this.order + 1) return;

    for (let i = 0; i < tokens.length - this.order; i++) {
      const state = tokens.slice(i, i + this.order).join(' ');
      const next = tokens[i + this.order];
      
      if (i === 0) this.startTokens.push(state);
      
      if (!this.chain.has(state)) {
        this.chain.set(state, []);
      }
      this.chain.get(state).push(next);
      
      // RLHF: Initialize or update reward weight for this transition
      const transitionKey = `${state}→${next}`;
      const currentWeight = this.rewardWeights.get(transitionKey) || 1.0;
      this.rewardWeights.set(transitionKey, currentWeight * rewardMultiplier);
    }
  }

  // RLHF: Apply feedback to adjust future responses
  applyFeedback(responseId, isPositive) {
    const feedback = {
      responseId,
      isPositive,
      timestamp: Date.now()
    };
    this.feedbackHistory.push(feedback);
    
    const response = this.responseHistory.find(r => r.id === responseId);
    if (!response) return;
    
    // Reward or penalize the transitions used in this response
    const rewardMultiplier = isPositive ? 1.5 : 0.5;
    
    response.transitions.forEach(transition => {
      const currentWeight = this.rewardWeights.get(transition) || 1.0;
      this.rewardWeights.set(transition, currentWeight * rewardMultiplier);
    });
    
    // If positive, reinforce the response pattern by retraining
    if (isPositive) {
      this.train(response.text, 1.3);
    } else {
      // Negative feedback: slightly reduce weight
      this.train(response.text, 0.7);
    }
    
    // Limit history size
    if (this.feedbackHistory.length > 100) {
      this.feedbackHistory.shift();
    }
  }

  tokenize(text) {
    return text.toLowerCase()
      .replace(/[^\w\s.!?]/g, '')
      .split(/\s+/)
      .filter(t => t.length > 0);
  }

  getRelevantState(context) {
    const contextTokens = this.tokenize(context);
    const states = Array.from(this.chain.keys());
    
    let bestMatch = null;
    let maxScore = 0;
    
    for (const state of states) {
      const stateTokens = state.split(' ');
      const score = stateTokens.filter(t => contextTokens.includes(t)).length;
      if (score > maxScore) {
        maxScore = score;
        bestMatch = state;
      }
    }
    
    return maxScore > 0 ? bestMatch : null;
  }

  generate(seed = null, maxLength = 50) {
    if (this.chain.size === 0) return { text: "I need more training data to respond!", id: null };
    
    const responseId = Date.now() + Math.random();
    const transitions = [];
    const inputTokens = seed ? this.tokenize(seed) : [];
    const semanticWords = this.getSemanticContext(seed || '');
    
    let state = null;
    let bestScore = 0;
    const states = Array.from(this.chain.keys());
    
    // Enhanced state selection with semantic awareness
    for (const s of states) {
      const stateTokens = s.split(' ');
      const directOverlap = stateTokens.filter(t => inputTokens.includes(t)).length;
      const semanticOverlap = stateTokens.filter(t => semanticWords.includes(t)).length;
      const isNotDirectRepeat = stateTokens.some(t => !inputTokens.includes(t));
      
      const score = (semanticOverlap * 3) + directOverlap + (isNotDirectRepeat ? 2 : -10);
      
      if (score > bestScore && this.chain.get(s).length > 0) {
        bestScore = score;
        state = s;
      }
    }
    
    if (!state || bestScore < 1) {
      const randomStates = states.filter(s => this.chain.get(s).length > 1);
      state = randomStates[Math.floor(Math.random() * randomStates.length)] || states[0];
    }
    
    const result = state.split(' ');
    const usedStates = new Set([state]);
    let attempts = 0;
    let stuckCount = 0;
    
    while (result.length < maxLength && attempts < maxLength * 3) {
      attempts++;
      const currentState = result.slice(-this.order).join(' ');
      const nextWords = this.chain.get(currentState);
      
      if (!nextWords || nextWords.length === 0) {
        const relatedStates = states.filter(s => {
          const tokens = s.split(' ');
          return tokens.some(t => semanticWords.includes(t));
        });
        
        if (relatedStates.length > 0) {
          const newState = relatedStates[Math.floor(Math.random() * relatedStates.length)];
          const newWords = this.chain.get(newState);
          if (newWords && newWords.length > 0) {
            const nextWord = newWords[Math.floor(Math.random() * newWords.length)];
            result.push(nextWord);
            transitions.push(`${newState}→${nextWord}`);
            stuckCount = 0;
            continue;
          }
        }
        break;
      }
      
      if (usedStates.has(currentState)) {
        stuckCount++;
        if (stuckCount > 3) {
          const randomNext = states[Math.floor(Math.random() * states.length)];
          const words = this.chain.get(randomNext);
          if (words) {
            const nextWord = words[Math.floor(Math.random() * words.length)];
            result.push(nextWord);
            transitions.push(`${randomNext}→${nextWord}`);
            stuckCount = 0;
            usedStates.clear();
            continue;
          }
        }
      }
      
      usedStates.add(currentState);
      
      // RLHF: Intelligent word selection with reward weighting
      const weights = nextWords.map((w, i) => {
        const freq = nextWords.filter(x => x === w).length;
        const baseWeight = 1 / freq;
        const semanticBoost = semanticWords.includes(w) ? 2 : 1;
        
        // RLHF: Apply learned reward weights
        const transitionKey = `${currentState}→${w}`;
        const rewardWeight = this.rewardWeights.get(transitionKey) || 1.0;
        
        return baseWeight * semanticBoost * rewardWeight;
      });
      
      const totalWeight = weights.reduce((a, b) => a + b, 0);
      let random = Math.random() * totalWeight;
      let next = nextWords[0];
      
      for (let i = 0; i < nextWords.length; i++) {
        random -= weights[i];
        if (random <= 0) {
          next = nextWords[i];
          break;
        }
      }
      
      transitions.push(`${currentState}→${next}`);
      result.push(next);
      
      if (next.match(/[.!?]$/) && result.length >= 8 && Math.random() > 0.3) break;
    }
    
    let finalText = result.join(' ');
    const inputLower = (seed || '').toLowerCase();
    if (finalText.toLowerCase().startsWith(inputLower.substring(0, 20))) {
      const randomState = states[Math.floor(Math.random() * states.length)];
      return this.generate(randomState.split(' ')[0], maxLength);
    }
    
    finalText = this.capitalize(finalText);
    
    // Store response for potential feedback
    this.responseHistory.push({
      id: responseId,
      text: finalText,
      transitions: transitions,
      timestamp: Date.now()
    });
    
    // Limit history
    if (this.responseHistory.length > 50) {
      this.responseHistory.shift();
    }
    
    return { text: finalText, id: responseId };
  }

  capitalize(text) {
    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  addContext(text) {
    this.contextMemory.push(text);
    if (this.contextMemory.length > this.maxMemory) {
      this.contextMemory.shift();
    }
  }

  getContext() {
    return this.contextMemory.join(' ');
  }
}

// Semantic relationship network for enhanced intelligence
const semanticNet = {
  intelligence: ['smart', 'clever', 'wisdom', 'knowledge', 'learning', 'thinking', 'reasoning', 'cognition'],
  emotion: ['feeling', 'joy', 'sadness', 'empathy', 'compassion', 'love', 'happiness'],
  science: ['experiment', 'hypothesis', 'theory', 'evidence', 'research', 'discovery', 'analysis'],
  technology: ['computer', 'algorithm', 'artificial', 'digital', 'innovation', 'programming'],
  philosophy: ['truth', 'reality', 'meaning', 'existence', 'consciousness', 'wisdom', 'ethics'],
  nature: ['environment', 'ecology', 'organic', 'natural', 'biology', 'evolution'],
  art: ['creative', 'beauty', 'aesthetic', 'expression', 'imagination', 'design'],
  mathematics: ['number', 'pattern', 'logic', 'calculation', 'precision', 'geometry'],
  language: ['word', 'meaning', 'communication', 'expression', 'grammar', 'metaphor']
};

// Enhanced training with semantic associations
corpus.forEach(text => bot.train(text));

// Add semantic understanding
bot.getSemanticContext = function(text) {
  const tokens = this.tokenize(text);
  const related = new Set();
  
  for (const token of tokens) {
    for (const [category, words] of Object.entries(semanticNet)) {
      if (words.includes(token)) {
        words.forEach(w => related.add(w));
        related.add(category);
      }
    }
  }
  
  return Array.from(related);
};

function addMessage(text, isUser, responseId = null) {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = `msg ${isUser ? 'user' : 'bot'}`;
  
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = isUser ? '👤' : '🤖';
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  
  // RLHF: Add feedback buttons to bot messages
  if (!isUser && responseId) {
    const feedbackDiv = document.createElement('div');
    feedbackDiv.className = 'feedback-buttons';
    feedbackDiv.innerHTML = `
      <button class="feedback-btn thumbs-up" onclick="giveFeedback(${responseId}, true)" title="Good response">👍</button>
      <button class="feedback-btn thumbs-down" onclick="giveFeedback(${responseId}, false)" title="Bad response">👎</button>
    `;
    bubble.appendChild(feedbackDiv);
  }
  
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function giveFeedback(responseId, isPositive) {
  bot.applyFeedback(responseId, isPositive);
  
  // Visual feedback
  const buttons = document.querySelectorAll(`button[onclick*="${responseId}"]`);
  buttons.forEach(btn => {
    btn.disabled = true;
    btn.style.opacity = '0.5';
  });
  
  // Show learning notification
  const chat = document.getElementById('chat');
  const notification = document.createElement('div');
  notification.className = 'learning-notification';
  notification.textContent = isPositive ? '✓ Learning from positive feedback!' : '✓ Learning from negative feedback!';
  chat.appendChild(notification);
  
  setTimeout(() => notification.remove(), 2000);
  
  // Update stats display
  updateStats();
}

function showTyping() {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = 'msg bot';
  msg.id = 'typing';
  
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '🤖';
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  
  bubble.appendChild(typing);
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const typing = document.getElementById('typing');
  if (typing) typing.remove();
}

function send() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  
  if (!text) return;
  
  addMessage(text, true);
  bot.train(text);
  bot.addContext(text);
  input.value = '';
  
  showTyping();
  
  setTimeout(() => {
    removeTyping();
    const context = bot.getContext();
    const response = bot.generate(context, 30);
    addMessage(response, false);
  }, 800 + Math.random() * 700);
}

function send() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  
  if (!text) return;
  
  addMessage(text, true);
  bot.train(text);
  bot.addContext(text);
  input.value = '';
  
  showTyping();
  
  setTimeout(() => {
    removeTyping();
    const context = bot.getContext();
    const result = bot.generate(context, 30);
    addMessage(result.text, false, result.id);
  }, 800 + Math.random() * 700);
}

function updateStats() {
  const statsDiv = document.getElementById('stats');
  if (!statsDiv) return;
  
  const totalFeedback = bot.feedbackHistory.length;
  const positive = bot.feedbackHistory.filter(f => f.isPositive).length;
  const negative = totalFeedback - positive;
  const satisfaction = totalFeedback > 0 ? Math.round((positive / totalFeedback) * 100) : 0;
  
  statsDiv.innerHTML = `
    <div class="stat">📊 Total Feedback: ${totalFeedback}</div>
    <div class="stat">👍 Positive: ${positive}</div>
    <div class="stat">👎 Negative: ${negative}</div>
    <div class="stat">✨ Satisfaction: ${satisfaction}%</div>
    <div class="stat">🧠 Learned Patterns: ${bot.rewardWeights.size}</div>
  `;
}

document.getElementById('userInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') send();
});

addMessage("Hello! I'm a Markov chain chatbot with RLHF (Reinforcement Learning from Human Feedback). I learn from our conversation and your feedback. Use 👍/👎 buttons to teach me what responses you like!", false);

// Initialize stats display
setTimeout(updateStats, 100);
</script>
