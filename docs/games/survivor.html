<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zyqral Neural Engine</title>
    <style>
        body { margin: 0; background: #050505; color: #00ffcc; font-family: monospace; overflow: hidden; }
        canvas { display: block; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; background: rgba(0, 20, 20, 0.8); padding: 10px; border: 1px solid #00ffcc; border-radius: 5px; font-size: 12px; max-height: 40vh; overflow-y: auto; pointer-events: auto; }
        .slider-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 3px; text-transform: uppercase; }
        input[type=range] { width: 100%; accent-color: #00ffcc; }
        .stats { position: absolute; bottom: 10px; left: 10px; font-size: 10px; color: rgba(0, 255, 204, 0.5); pointer-events: none; }
    </style>
</head>
<body>

<div id="ui">
    <div class="slider-group">
        <label>Prefrontal Cortex (Neuron Count)</label>
        <input type="range" id="pfc-count" min="10" max="100" value="40">
    </div>
    <div class="slider-group">
        <label>Neurotransmitter: Dopamine (Speed)</label>
        <input type="range" id="dopamine" min="1" max="10" value="5">
    </div>
    <div class="slider-group">
        <label>Neurotransmitter: GABA (Inhibition)</label>
        <input type="range" id="gaba" min="0" max="10" value="2">
    </div>
    <div class="slider-group">
        <label>Neurotransmitter: Serotonin (Stability)</label>
        <input type="range" id="serotonin" min="1" max="10" value="5">
    </div>
</div>

<div class="stats" id="stats">Active Synapses: 0 | Energy Consumption: Low</div>

<canvas id="brainCanvas"></canvas>

<script>
    const canvas = document.getElementById('brainCanvas');
    const ctx = canvas.getContext('2d');
    const stats = document.getElementById('stats');
    
    let neurons = [];
    let neurotransmitters = { dopamine: 5, gaba: 2, serotonin: 5 };
    let regions = {
        PFC: { x: 0.5, y: 0.2, color: '#00ffff', count: 40 },
        Amygdala: { x: 0.5, y: 0.6, color: '#ff0055', count: 20 },
        VisualCortex: { x: 0.5, y: 0.8, color: '#aa00ff', count: 30 }
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initNeurons();
    }

    class Neuron {
        constructor(regionKey) {
            const region = regions[regionKey];
            this.region = regionKey;
            this.x = canvas.width * (region.x + (Math.random() - 0.5) * 0.4);
            this.y = canvas.height * (region.y + (Math.random() - 0.5) * 0.2);
            this.potential = 0;
            this.threshold = 1.0;
            this.color = region.color;
            this.connections = [];
        }

        connect(others) {
            this.connections = others
                .filter(n => n !== this && Math.hypot(this.x - n.x, this.y - n.y) < 150)
                .slice(0, 5);
        }

        fire() {
            if (this.potential > this.threshold) {
                this.potential = 0;
                this.connections.forEach(target => {
                    const signal = (neurotransmitters.dopamine / 5) - (neurotransmitters.gaba / 10);
                    target.receive(signal, this.x, this.y);
                });
                return true;
            }
            // Serotonin stabilizes leak
            this.potential *= (0.9 + (neurotransmitters.serotonin / 100));
            return false;
        }

        receive(val, fromX, fromY) {
            this.potential += val;
            // Visual Dendrite Pulse
            pulses.push({
                x: fromX, y: fromY, tx: this.x, ty: this.y, progress: 0, 
                color: this.color, speed: 0.02 * (neurotransmitters.dopamine / 5)
            });
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, 2 + this.potential * 2, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            if (this.potential > 0.5) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
            } else {
                ctx.shadowBlur = 0;
            }
        }
    }

    let pulses = [];

    function initNeurons() {
        neurons = [];
        Object.keys(regions).forEach(key => {
            for (let i = 0; i < regions[key].count; i++) {
                neurons.push(new Neuron(key));
            }
        });
        neurons.forEach(n => n.connect(neurons));
    }

    function animate() {
        ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Random stimulus
        if (Math.random() > 0.9) neurons[Math.floor(Math.random() * neurons.length)].potential += 1;

        neurons.forEach(n => {
            n.fire();
            n.draw();
        });

        pulses = pulses.filter(p => {
            p.progress += p.speed;
            const curX = p.x + (p.tx - p.x) * p.progress;
            const curY = p.y + (p.ty - p.y) * p.progress;
            ctx.beginPath();
            ctx.moveTo(p.x + (p.tx - p.x) * (p.progress - 0.1), p.y + (p.ty - p.y) * (p.progress - 0.1));
            ctx.lineTo(curX, curY);
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 1;
            ctx.stroke();
            return p.progress < 1;
        });

        stats.innerText = `Active Synapses: ${pulses.length} | Neuro-Stability: ${neurotransmitters.serotonin > 5 ? 'High' : 'Volatile'}`;
        requestAnimationFrame(animate);
    }

    // UI Listeners
    document.getElementById('pfc-count').addEventListener('input', (e) => {
        regions.PFC.count = parseInt(e.target.value);
        initNeurons();
    });
    document.getElementById('dopamine').addEventListener('input', (e) => {
        neurotransmitters.dopamine = parseInt(e.target.value);
    });
    document.getElementById('gaba').addEventListener('input', (e) => {
        neurotransmitters.gaba = parseInt(e.target.value);
    });
    document.getElementById('serotonin').addEventListener('input', (e) => {
        neurotransmitters.serotonin = parseInt(e.target.value);
    });

    window.addEventListener('resize', resize);
    resize();
    animate();

</script>
</body>
</html>
