<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markov Chain Chatbot</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 1rem;
}
.container {
  width: 100%;
  max-width: 600px;
  background: white;
  border-radius: 1rem;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  height: 90vh;
  max-height: 700px;
}
.header {
  padding: 1.5rem;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-radius: 1rem 1rem 0 0;
  text-align: center;
}
.header h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
.header p { font-size: 0.85rem; opacity: 0.9; }
.stats {
  padding: 0.75rem 1.5rem;
  background: #f8f9fa;
  border-bottom: 1px solid #e0e0e0;
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  font-size: 0.8rem;
}
.stat {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  color: #555;
}
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.msg {
  display: flex;
  gap: 0.75rem;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg.user { flex-direction: row-reverse; }
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}
.msg.bot .avatar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.msg.user .avatar { background: #e0e0e0; }
.bubble {
  max-width: 75%;
  padding: 0.75rem 1rem;
  border-radius: 1rem;
  word-wrap: break-word;
}
.msg.bot .bubble {
  background: #f0f0f0;
  border-bottom-left-radius: 0.25rem;
}
.msg.user .bubble {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-bottom-right-radius: 0.25rem;
}
.input-area {
  padding: 1rem;
  border-top: 1px solid #e0e0e0;
  display: flex;
  gap: 0.5rem;
}
#userInput {
  flex: 1;
  padding: 0.75rem;
  border: 2px solid #e0e0e0;
  border-radius: 2rem;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.3s;
}
#userInput:focus { border-color: #667eea; }
button {
  padding: 0.75rem 1.5rem;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 2rem;
  font-size: 1rem;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}
button:active { transform: translateY(0); }
.typing {
  display: flex;
  gap: 0.3rem;
  padding: 0.5rem;
}
.typing span {
  width: 8px;
  height: 8px;
  background: #999;
  border-radius: 50%;
  animation: bounce 1.4s infinite ease-in-out;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}
.feedback-buttons {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.5rem;
  padding-top: 0.5rem;
  border-top: 1px solid #e0e0e0;
}
.feedback-btn {
  padding: 0.25rem 0.5rem;
  background: white;
  border: 1px solid #ddd;
  border-radius: 0.5rem;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.2s;
}
.feedback-btn:hover:not(:disabled) {
  transform: scale(1.1);
  border-color: #667eea;
}
.feedback-btn:disabled {
  cursor: not-allowed;
}
.learning-notification {
  text-align: center;
  padding: 0.75rem;
  background: #4caf50;
  color: white;
  border-radius: 0.5rem;
  margin: 0.5rem 0;
  animation: fadeIn 0.3s ease;
  font-size: 0.9rem;
}
.edit-btn, .regenerate-btn {
  padding: 0.25rem 0.5rem;
  background: white;
  border: 1px solid #ddd;
  border-radius: 0.5rem;
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
  margin-top: 0.5rem;
}
.edit-btn:hover, .regenerate-btn:hover {
  border-color: #667eea;
  background: #f0f0f0;
}
.msg.user .bubble {
  position: relative;
}
.edit-input {
  width: 100%;
  padding: 0.5rem;
  border: 2px solid #667eea;
  border-radius: 0.5rem;
  font-size: 1rem;
  font-family: inherit;
  margin-top: 0.5rem;
}
.edit-actions {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.5rem;
}
.edit-actions button {
  padding: 0.5rem 1rem;
  font-size: 0.85rem;
  border-radius: 0.5rem;
}
.regenerate-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🤖 True Next-Word Markov Bot</h1>
    <p>Pure word-by-word probabilistic generation</p>
  </div>
  <div class="stats" id="stats"></div>
  <div class="chat" id="chat"></div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type a message..." />
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
class TrueMarkovChain {
  constructor(order = 2) {
    this.order = order;
    this.transitions = new Map(); // word -> {nextWord: count}
    this.rewardWeights = new Map();
    this.feedbackHistory = [];
    this.responseHistory = [];
    this.totalWords = 0;
  }

  train(text, rewardMultiplier = 1.0) {
    const words = this.tokenize(text);
    if (words.length < this.order + 1) return;

    for (let i = 0; i <= words.length - this.order - 1; i++) {
      const context = words.slice(i, i + this.order).join(' ');
      const next = words[i + this.order];
      
      if (!this.transitions.has(context)) {
        this.transitions.set(context, new Map());
      }
      
      const nextMap = this.transitions.get(context);
      nextMap.set(next, (nextMap.get(next) || 0) + 1);
      this.totalWords++;
      
      // Initialize reward weight
      const key = `${context}→${next}`;
      const current = this.rewardWeights.get(key) || 1.0;
      this.rewardWeights.set(key, current * rewardMultiplier);
    }
  }

  tokenize(text) {
    return text.toLowerCase()
      .replace(/([.!?])/g, ' $1')
      .split(/\s+/)
      .filter(t => t.length > 0);
  }

  getStartContext(seed) {
    if (!seed) {
      const contexts = Array.from(this.transitions.keys());
      return contexts[Math.floor(Math.random() * contexts.length)];
    }
    
    const seedWords = this.tokenize(seed);
    const contexts = Array.from(this.transitions.keys());
    
    // Find contexts that contain seed words
    let bestContext = null;
    let maxOverlap = 0;
    
    for (const ctx of contexts) {
      const ctxWords = ctx.split(' ');
      const overlap = ctxWords.filter(w => seedWords.includes(w)).length;
      
      if (overlap > maxOverlap || (overlap === maxOverlap && Math.random() > 0.5)) {
        maxOverlap = overlap;
        bestContext = ctx;
      }
    }
    
    return bestContext || contexts[Math.floor(Math.random() * contexts.length)];
  }

  generateNextWord(context) {
    const nextMap = this.transitions.get(context);
    if (!nextMap || nextMap.size === 0) return null;
    
    const candidates = Array.from(nextMap.entries());
    const weights = candidates.map(([word, count]) => {
      const key = `${context}→${word}`;
      const reward = this.rewardWeights.get(key) || 1.0;
      const freq = count / this.totalWords;
      const rarity = 1 / (freq * 1000 + 1);
      const exploration = 0.7 + Math.random() * 0.6;
      
      return (count + 1) * reward * rarity * exploration;
    });
    
    const total = weights.reduce((a, b) => a + b, 0);
    let rand = Math.random() * total;
    
    for (let i = 0; i < candidates.length; i++) {
      rand -= weights[i];
      if (rand <= 0) return candidates[i][0];
    }
    
    return candidates[0][0];
  }

  generate(seed = null, minWords = 10, maxWords = 40) {
    if (this.transitions.size === 0) {
      return { text: "I need training data first!", id: null };
    }
    
    const responseId = Date.now() + Math.random();
    const transitions = [];
    
    // Start with seed-based context
    let context = this.getStartContext(seed);
    const result = context.split(' ');
    
    let attempts = 0;
    let sentenceEnded = false;
    
    while (result.length < maxWords && attempts < maxWords * 2) {
      attempts++;
      
      // Get current context window
      const currentContext = result.slice(-this.order).join(' ');
      
      // Generate next word
      const nextWord = this.generateNextWord(currentContext);
      
      if (!nextWord) {
        // Fallback: get a random context
        const randomContext = Array.from(this.transitions.keys())[
          Math.floor(Math.random() * this.transitions.size)
        ];
        const fallbackWord = this.generateNextWord(randomContext);
        if (fallbackWord) {
          result.push(fallbackWord);
          transitions.push(`${randomContext}→${fallbackWord}`);
        } else {
          break;
        }
        continue;
      }
      
      result.push(nextWord);
      transitions.push(`${currentContext}→${nextWord}`);
      
      // Check for sentence ending
      if (nextWord.match(/[.!?]/)) {
        sentenceEnded = true;
        if (result.length >= minWords && Math.random() > 0.3) {
          break;
        }
      }
    }
    
    let text = result.join(' ')
      .replace(/\s+([.!?,])/g, '$1')
      .replace(/\s+/g, ' ')
      .trim();
    
    text = text.charAt(0).toUpperCase() + text.slice(1);
    
    // Ensure it ends with punctuation
    if (!text.match(/[.!?]$/)) {
      text += '.';
    }
    
    this.responseHistory.push({
      id: responseId,
      text: text,
      transitions: transitions,
      timestamp: Date.now()
    });
    
    if (this.responseHistory.length > 50) {
      this.responseHistory.shift();
    }
    
    return { text, id: responseId };
  }

  applyFeedback(responseId, isPositive) {
    const feedback = { responseId, isPositive, timestamp: Date.now() };
    this.feedbackHistory.push(feedback);
    
    const response = this.responseHistory.find(r => r.id === responseId);
    if (!response) return;
    
    const multiplier = isPositive ? 1.5 : 0.6;
    
    response.transitions.forEach(transition => {
      const current = this.rewardWeights.get(transition) || 1.0;
      this.rewardWeights.set(transition, current * multiplier);
    });
    
    if (isPositive) {
      this.train(response.text, 1.3);
    }
    
    if (this.feedbackHistory.length > 100) {
      this.feedbackHistory.shift();
    }
  }
}

const bot = new TrueMarkovChain(2);
let messageCounter = 0;
const conversationPairs = new Map(); // Track user message -> bot response pairs

const corpus = [
  "Intelligence means the ability to learn understand and apply knowledge effectively.",
  "Wisdom comes from experience reflection and deep understanding of life.",
  "Consciousness refers to awareness of thoughts feelings and surroundings.",
  "Empathy allows us to understand and share the feelings of others.",
  "Creativity drives innovation through imagination and original thinking.",
  "Logic helps us reason systematically and draw valid conclusions.",
  "Learning is a continuous process that expands our knowledge and skills.",
  "Communication enables us to share ideas and connect with others meaningfully.",
  "Curiosity motivates us to explore discover and ask questions.",
  "Philosophy examines fundamental questions about existence reality and meaning.",
  "Science uses systematic methods to understand the natural world.",
  "Technology advances rapidly and transforms how we live and work.",
  "Art expresses emotions and ideas through creative visual forms.",
  "Music connects people across cultures through rhythm melody and harmony.",
  "Language evolves constantly as new words and expressions emerge.",
  "Memory stores our experiences and shapes our identity over time.",
  "Emotion influences our decisions behaviors and relationships profoundly.",
  "Perception filters how we interpret sensory information from our environment.",
  "Imagination allows us to envision possibilities beyond current reality.",
  "Reasoning enables us to analyze problems and find solutions logically.",
  "Mathematics describes patterns relationships and abstract structures precisely.",
  "Beauty inspires appreciation through harmony elegance and meaningful form.",
  "Truth corresponds to facts and reality without distortion or bias.",
  "Knowledge accumulates through observation study and critical thinking.",
  "Understanding develops when we grasp concepts and see connections clearly.",
  "Thinking involves mental processes like analyzing comparing and evaluating.",
  "Ideas emerge from combining existing knowledge in novel ways.",
  "Concepts represent abstract categories that organize our understanding.",
  "Patterns reveal underlying structure in seemingly random information.",
  "Relationships connect different elements and create meaningful associations.",
  "Context provides background information that helps interpret meaning accurately.",
  "Insight arises suddenly when we perceive things in a new light.",
  "Analysis breaks down complex subjects into understandable components.",
  "Synthesis combines separate elements into coherent unified wholes.",
  "Abstraction focuses on essential features while ignoring specific details.",
  "Inference draws conclusions from evidence and logical reasoning.",
  "Intuition provides immediate understanding without conscious deliberation.",
  "Experience teaches valuable lessons through direct participation and observation.",
  "Practice develops skills through repeated application and refinement.",
  "Attention focuses mental resources on specific information or tasks.",
  "Awareness encompasses conscious recognition of internal and external states.",
  "Reflection examines past experiences to extract meaning and lessons.",
  "Growth happens through challenges learning and continuous development.",
  "Change represents transformation from one state to another over time.",
  "Adaptation helps organisms adjust to new environments and circumstances.",
  "Evolution produces gradual changes through natural selection and variation.",
  "Progress moves toward improvement and advancement in various domains.",
  "Development unfolds through stages of increasing complexity and capability.",
  "Transformation fundamentally alters form appearance or character.",
  "Innovation introduces new methods ideas or products that solve problems.",
];

corpus.forEach(text => bot.train(text));

function addMessage(text, isUser, responseId = null, messageId = null) {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = `msg ${isUser ? 'user' : 'bot'}`;
  
  if (messageId) {
    msg.dataset.messageId = messageId;
  }
  
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = isUser ? '👤' : '🤖';
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  
  const textSpan = document.createElement('span');
  textSpan.textContent = text;
  textSpan.className = 'message-text';
  bubble.appendChild(textSpan);
  
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  
  // Add edit button to user messages
  if (isUser && messageId) {
    const editBtn = document.createElement('button');
    editBtn.className = 'edit-btn';
    editBtn.textContent = '✏️ Edit';
    editBtn.onclick = () => editMessage(messageId);
    bubble.appendChild(editBtn);
  }
  
  // Add feedback and regenerate to bot messages
  if (!isUser && responseId) {
    const actionsDiv = document.createElement('div');
    actionsDiv.style.marginTop = '0.5rem';
    actionsDiv.style.display = 'flex';
    actionsDiv.style.gap = '0.5rem';
    actionsDiv.style.flexWrap = 'wrap';
    
    const feedbackDiv = document.createElement('div');
    feedbackDiv.className = 'feedback-buttons';
    feedbackDiv.style.flex = '1';
    feedbackDiv.style.margin = '0';
    feedbackDiv.style.padding = '0';
    feedbackDiv.style.border = 'none';
    feedbackDiv.innerHTML = `
      <button class="feedback-btn thumbs-up" onclick="giveFeedback(${responseId}, true)" title="Good response">👍</button>
      <button class="feedback-btn thumbs-down" onclick="giveFeedback(${responseId}, false)" title="Bad response">👎</button>
    `;
    
    const regenBtn = document.createElement('button');
    regenBtn.className = 'regenerate-btn';
    regenBtn.innerHTML = '🔄 Regenerate';
    regenBtn.onclick = () => regenerateResponse(messageId);
    
    actionsDiv.appendChild(feedbackDiv);
    actionsDiv.appendChild(regenBtn);
    bubble.appendChild(actionsDiv);
  }
  
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  
  return messageId;
}

function editMessage(messageId) {
  const msg = document.querySelector(`[data-message-id="${messageId}"]`);
  if (!msg) return;
  
  const bubble = msg.querySelector('.bubble');
  const textSpan = bubble.querySelector('.message-text');
  const currentText = textSpan.textContent;
  
  // Create edit interface
  const editInput = document.createElement('textarea');
  editInput.className = 'edit-input';
  editInput.value = currentText;
  editInput.rows = 3;
  
  const editActions = document.createElement('div');
  editActions.className = 'edit-actions';
  
  const saveBtn = document.createElement('button');
  saveBtn.textContent = '✓ Save & Regenerate';
  saveBtn.onclick = () => saveEdit(messageId, editInput.value);
  
  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = '✕ Cancel';
  cancelBtn.style.background = '#6c757d';
  cancelBtn.onclick = () => cancelEdit(messageId);
  
  editActions.appendChild(saveBtn);
  editActions.appendChild(cancelBtn);
  
  // Hide original text and edit button
  textSpan.style.display = 'none';
  bubble.querySelector('.edit-btn').style.display = 'none';
  
  // Add edit interface
  bubble.insertBefore(editInput, textSpan.nextSibling);
  bubble.insertBefore(editActions, editInput.nextSibling);
  
  editInput.focus();
  editInput.select();
}

function cancelEdit(messageId) {
  const msg = document.querySelector(`[data-message-id="${messageId}"]`);
  if (!msg) return;
  
  const bubble = msg.querySelector('.bubble');
  const textSpan = bubble.querySelector('.message-text');
  const editInput = bubble.querySelector('.edit-input');
  const editActions = bubble.querySelector('.edit-actions');
  
  textSpan.style.display = '';
  bubble.querySelector('.edit-btn').style.display = '';
  editInput.remove();
  editActions.remove();
}

function saveEdit(messageId, newText) {
  if (!newText.trim()) return;
  
  const msg = document.querySelector(`[data-message-id="${messageId}"]`);
  if (!msg) return;
  
  const bubble = msg.querySelector('.bubble');
  const textSpan = bubble.querySelector('.message-text');
  const editInput = bubble.querySelector('.edit-input');
  const editActions = bubble.querySelector('.edit-actions');
  
  // Update text
  textSpan.textContent = newText;
  textSpan.style.display = '';
  bubble.querySelector('.edit-btn').style.display = '';
  editInput.remove();
  editActions.remove();
  
  // Train on new text
  bot.train(newText, 1.0);
  
  // Remove old bot response and regenerate
  const pair = conversationPairs.get(messageId);
  if (pair) {
    const botMsg = document.querySelector(`[data-message-id="${pair.botMessageId}"]`);
    if (botMsg) botMsg.remove();
  }
  
  // Generate new response
  showTyping();
  setTimeout(() => {
    removeTyping();
    const result = bot.generate(newText, 10, 40);
    const botMessageId = messageCounter++;
    conversationPairs.set(messageId, { botMessageId, userText: newText });
    addMessage(result.text, false, result.id, botMessageId);
    updateStats();
  }, 800 + Math.random() * 700);
}

function regenerateResponse(botMessageId) {
  // Find the user message that prompted this response
  let userMessageId = null;
  let userText = '';
  
  for (const [uId, pair] of conversationPairs.entries()) {
    if (pair.botMessageId === botMessageId) {
      userMessageId = uId;
      userText = pair.userText;
      break;
    }
  }
  
  if (!userText) return;
  
  // Remove old bot message
  const botMsg = document.querySelector(`[data-message-id="${botMessageId}"]`);
  if (botMsg) botMsg.remove();
  
  // Generate new response
  showTyping();
  setTimeout(() => {
    removeTyping();
    const result = bot.generate(userText, 10, 40);
    const newBotMessageId = messageCounter++;
    conversationPairs.set(userMessageId, { botMessageId: newBotMessageId, userText });
    addMessage(result.text, false, result.id, newBotMessageId);
    updateStats();
  }, 800 + Math.random() * 700);
}

function giveFeedback(responseId, isPositive) {
  bot.applyFeedback(responseId, isPositive);
  
  const buttons = document.querySelectorAll(`button[onclick*="${responseId}"]`);
  buttons.forEach(btn => {
    btn.disabled = true;
    btn.style.opacity = '0.5';
  });
  
  const chat = document.getElementById('chat');
  const notification = document.createElement('div');
  notification.className = 'learning-notification';
  notification.textContent = isPositive ? '✓ Reinforcing this pattern!' : '✓ Reducing this pattern!';
  chat.appendChild(notification);
  
  setTimeout(() => notification.remove(), 2000);
  updateStats();
}

function showTyping() {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = 'msg bot';
  msg.id = 'typing';
  
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '🤖';
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  
  bubble.appendChild(typing);
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const typing = document.getElementById('typing');
  if (typing) typing.remove();
}

function send() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  
  if (!text) return;
  
  const userMessageId = messageCounter++;
  addMessage(text, true, null, userMessageId);
  bot.train(text, 1.0);
  input.value = '';
  
  showTyping();
  
  setTimeout(() => {
    removeTyping();
    const result = bot.generate(text, 10, 40);
    const botMessageId = messageCounter++;
    conversationPairs.set(userMessageId, { botMessageId, userText: text });
    addMessage(result.text, false, result.id, botMessageId);
    updateStats();
  }, 800 + Math.random() * 700);
}

function updateStats() {
  const statsDiv = document.getElementById('stats');
  if (!statsDiv) return;
  
  const totalFeedback = bot.feedbackHistory.length;
  const positive = bot.feedbackHistory.filter(f => f.isPositive).length;
  const satisfaction = totalFeedback > 0 ? Math.round((positive / totalFeedback) * 100) : 0;
  
  statsDiv.innerHTML = `
    <div class="stat">🔗 Contexts: ${bot.transitions.size}</div>
    <div class="stat">📝 Words: ${bot.totalWords}</div>
    <div class="stat">👍 ${positive}/${totalFeedback}</div>
    <div class="stat">✨ ${satisfaction}%</div>
    <div class="stat">🎯 Patterns: ${bot.rewardWeights.size}</div>
  `;
}

document.getElementById('userInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') send();
});

addMessage("Hello! I'm a true next-word Markov chain bot. I generate responses one word at a time based on learned probabilities. Chat with me and use feedback to train me!", false);

setTimeout(updateStats, 100);
</script>
</body>
</html>
