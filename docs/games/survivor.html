<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intelligent Markov Chain Chatbot</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 1rem;
}
.container {
  width: 100%;
  max-width: 800px;
  background: white;
  border-radius: 1rem;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  height: 95vh;
  max-height: 900px;
}
.header {
  padding: 1.5rem;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-radius: 1rem 1rem 0 0;
  text-align: center;
}
.header h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
.header p { font-size: 0.85rem; opacity: 0.9; }
.stats {
  padding: 0.75rem 1.5rem;
  background: #f8f9fa;
  border-bottom: 1px solid #e0e0e0;
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  font-size: 0.8rem;
}
.stat {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  color: #555;
}
.thinking-panel {
  background: #f8f9fa;
  border-bottom: 1px solid #e0e0e0;
  padding: 0.75rem 1rem;
  font-size: 0.85rem;
  color: #666;
  max-height: 200px;
  overflow-y: auto;
  border-left: 4px solid #667eea;
}
.thinking-step {
  padding: 0.25rem 0;
  margin: 0.25rem 0;
  opacity: 0;
  animation: fadeInStep 0.3s forwards;
}
.thinking-step:nth-child(1) { animation-delay: 0.1s; }
.thinking-step:nth-child(2) { animation-delay: 0.3s; }
.thinking-step:nth-child(3) { animation-delay: 0.5s; }
.thinking-step:nth-child(4) { animation-delay: 0.7s; }
.thinking-step:nth-child(5) { animation-delay: 0.9s; }
@keyframes fadeInStep {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.msg {
  display: flex;
  gap: 0.75rem;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg.user { flex-direction: row-reverse; }
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}
.msg.bot .avatar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.msg.user .avatar { background: #e0e0e0; }
.bubble {
  max-width: 75%;
  padding: 0.75rem 1rem;
  border-radius: 1rem;
  word-wrap: break-word;
}
.msg.bot .bubble {
  background: #f0f0f0;
  border-bottom-left-radius: 0.25rem;
}
.msg.user .bubble {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-bottom-right-radius: 0.25rem;
}
.input-area {
  padding: 1rem;
  border-top: 1px solid #e0e0e0;
  display: flex;
  gap: 0.5rem;
}
#userInput {
  flex: 1;
  padding: 0.75rem;
  border: 2px solid #e0e0e0;
  border-radius: 2rem;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.3s;
}
#userInput:focus { border-color: #667eea; }
button {
  padding: 0.75rem 1.5rem;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 2rem;
  font-size: 1rem;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}
button:active { transform: translateY(0); }
.typing {
  display: flex;
  gap: 0.3rem;
  padding: 0.5rem;
}
.typing span {
  width: 8px;
  height: 8px;
  background: #999;
  border-radius: 50%;
  animation: bounce 1.4s infinite ease-in-out;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}
.feedback-buttons {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.5rem;
  padding-top: 0.5rem;
  border-top: 1px solid #e0e0e0;
}
.feedback-btn {
  padding: 0.25rem 0.5rem;
  background: white;
  border: 1px solid #ddd;
  border-radius: 0.5rem;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.2s;
}
.feedback-btn:hover:not(:disabled) {
  transform: scale(1.1);
  border-color: #667eea;
}
.feedback-btn:disabled {
  cursor: not-allowed;
}
.learning-notification {
  text-align: center;
  padding: 0.75rem;
  background: #4caf50;
  color: white;
  border-radius: 0.5rem;
  margin: 0.5rem 0;
  animation: fadeIn 0.3s ease;
  font-size: 0.9rem;
}
.edit-btn, .regenerate-btn {
  padding: 0.25rem 0.5rem;
  background: white;
  border: 1px solid #ddd;
  border-radius: 0.5rem;
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
  margin-top: 0.5rem;
}
.edit-btn:hover, .regenerate-btn:hover {
  border-color: #667eea;
  background: #f0f0f0;
}
.msg.user .bubble {
  position: relative;
}
.edit-input {
  width: 100%;
  padding: 0.5rem;
  border: 2px solid #667eea;
  border-radius: 0.5rem;
  font-size: 1rem;
  font-family: inherit;
  margin-top: 0.5rem;
}
.edit-actions {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.5rem;
}
.edit-actions button {
  padding: 0.5rem 1rem;
  font-size: 0.85rem;
  border-radius: 0.5rem;
}
.regenerate-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
}
.reasoning-tag {
  display: inline-block;
  background: rgba(102, 126, 234, 0.1);
  color: #667eea;
  padding: 0.2rem 0.5rem;
  border-radius: 0.25rem;
  font-size: 0.8rem;
  margin: 0.2rem;
  font-family: monospace;
}
.confidence-meter {
  height: 4px;
  background: #e0e0e0;
  border-radius: 2px;
  margin-top: 0.5rem;
  overflow: hidden;
}
.confidence-fill {
  height: 100%;
  background: linear-gradient(90deg, #4caf50, #8bc34a);
  width: 0%;
  transition: width 1s ease;
}
.insight-badge {
  background: linear-gradient(135deg, #ff9800, #ff5722);
  color: white;
  padding: 0.25rem 0.5rem;
  border-radius: 1rem;
  font-size: 0.75rem;
  margin-left: 0.5rem;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🧠 Intelligent Markov Chain Bot</h1>
    <p>With multi-step reasoning and cognitive simulation</p>
  </div>
  <div class="stats" id="stats"></div>
  <div class="thinking-panel" id="thinkingPanel"></div>
  <div class="chat" id="chat"></div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ask me anything..." />
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
class IntelligentMarkovChain {
  constructor(order = 2) {
    this.order = order;
    this.transitions = new Map();
    this.rewardWeights = new Map();
    this.feedbackHistory = [];
    this.responseHistory = [];
    this.totalWords = 0;
    this.conversationMemory = [];
    this.cognitivePatterns = new Map();
    this.knowledgeBase = new Map();
    this.reasoningSteps = [];
    this.maxMemorySize = 20;
  }

  // Enhanced tokenization with stemming
  tokenize(text) {
    return text.toLowerCase()
      .replace(/([.!?])/g, ' $1')
      .replace(/[^\w\s.!?]/g, '')
      .split(/\s+/)
      .filter(t => t.length > 0)
      .map(word => this.stemWord(word));
  }

  stemWord(word) {
    // Simple stemming for common suffixes
    const suffixes = ['ing', 'ed', 's', 'es', 'ly', 'ment', 'ness', 'tion'];
    for (const suffix of suffixes) {
      if (word.endsWith(suffix) && word.length > suffix.length + 2) {
        return word.slice(0, -suffix.length);
      }
    }
    return word;
  }

  train(text, rewardMultiplier = 1.0) {
    const words = this.tokenize(text);
    if (words.length < this.order + 1) return;

    // Extract and store knowledge patterns
    this.extractKnowledgePatterns(words);

    for (let i = 0; i <= words.length - this.order - 1; i++) {
      const context = words.slice(i, i + this.order).join(' ');
      const next = words[i + this.order];
      
      if (!this.transitions.has(context)) {
        this.transitions.set(context, new Map());
      }
      
      const nextMap = this.transitions.get(context);
      nextMap.set(next, (nextMap.get(next) || 0) + 1);
      this.totalWords++;
      
      const key = `${context}→${next}`;
      const current = this.rewardWeights.get(key) || 1.0;
      this.rewardWeights.set(key, current * rewardMultiplier);
    }
  }

  extractKnowledgePatterns(words) {
    // Look for subject-verb-object patterns
    for (let i = 0; i < words.length - 2; i++) {
      const triple = words.slice(i, i + 3);
      const pattern = triple.join(' ');
      const count = this.knowledgeBase.get(pattern) || 0;
      this.knowledgeBase.set(pattern, count + 1);
    }
  }

  // Cognitive reasoning layer
  think(input) {
    this.reasoningSteps = [];
    const thoughts = [];
    
    // Step 1: Understand the input
    thoughts.push(this.analyzeInput(input));
    
    // Step 2: Retrieve relevant knowledge
    const relevantKnowledge = this.retrieveKnowledge(input);
    if (relevantKnowledge.length > 0) {
      thoughts.push(`Found ${relevantKnowledge.length} relevant knowledge patterns`);
    }
    
    // Step 3: Consider conversation context
    if (this.conversationMemory.length > 0) {
      thoughts.push(`Considering ${this.conversationMemory.length} previous exchanges`);
    }
    
    // Step 4: Plan response structure
    thoughts.push(this.planResponse(input));
    
    // Step 5: Evaluate potential responses
    thoughts.push(this.evaluateResponseOptions(input));
    
    this.reasoningSteps = thoughts;
    return thoughts;
  }

  analyzeInput(input) {
    const words = this.tokenize(input);
    const wordCount = words.length;
    const uniqueWords = new Set(words).size;
    
    // Detect question type
    const isQuestion = input.includes('?');
    const isWhatQuestion = /what|how|why|when|where/i.test(input);
    const isOpinionQuestion = /think|believe|opinion|feel/i.test(input);
    
    let analysis = `Analyzing: ${wordCount} words, ${uniqueWords} unique`;
    if (isQuestion) {
      analysis += ` | Question detected`;
      if (isWhatQuestion) analysis += ` (factual)`;
      if (isOpinionQuestion) analysis += ` (opinion-based)`;
    }
    
    // Detect topic
    const topics = this.detectTopics(words);
    if (topics.length > 0) {
      analysis += ` | Topics: ${topics.join(', ')}`;
    }
    
    return analysis;
  }

  detectTopics(words) {
    const topicKeywords = {
      'philosophy': ['think', 'mind', 'conscious', 'truth', 'meaning', 'exist'],
      'science': ['science', 'experiment', 'theory', 'data', 'research', 'study'],
      'technology': ['tech', 'computer', 'code', 'digital', 'system', 'algorithm'],
      'learning': ['learn', 'teach', 'study', 'knowledge', 'educat', 'understand'],
      'emotion': ['feel', 'emotion', 'love', 'happy', 'sad', 'anger'],
      'language': ['word', 'speak', 'language', 'communicat', 'mean', 'express']
    };
    
    const detected = [];
    for (const [topic, keywords] of Object.entries(topicKeywords)) {
      if (keywords.some(keyword => 
        words.some(word => word.includes(keyword))
      )) {
        detected.push(topic);
      }
    }
    
    return detected.length > 0 ? detected : ['general'];
  }

  retrieveKnowledge(input) {
    const words = this.tokenize(input);
    const knowledge = [];
    
    // Look for matching patterns in knowledge base
    for (const [pattern, count] of this.knowledgeBase.entries()) {
      const patternWords = pattern.split(' ');
      const matches = patternWords.filter(pw => 
        words.some(w => this.similarity(pw, w) > 0.7)
      ).length;
      
      if (matches >= 2 && count > 1) {
        knowledge.push({
          pattern,
          confidence: Math.min(matches / patternWords.length, 1),
          frequency: count
        });
      }
    }
    
    return knowledge.sort((a, b) => b.confidence - a.confidence).slice(0, 5);
  }

  planResponse(input) {
    const words = this.tokenize(input);
    const isQuestion = input.includes('?');
    
    if (isQuestion) {
      if (words.some(w => ['who', 'what', 'when', 'where'].includes(w))) {
        return "Planning: Factual response with specific details";
      } else if (words.some(w => ['why', 'how'].includes(w))) {
        return "Planning: Explanatory response with reasoning steps";
      } else if (words.some(w => ['would', 'could', 'should'].includes(w))) {
        return "Planning: Conditional/hypothetical response";
      }
      return "Planning: Direct answer followed by elaboration";
    }
    
    if (words.length < 4) {
      return "Planning: Expansive response to elaborate on brief input";
    }
    
    return "Planning: Thematic continuation with novel connections";
  }

  evaluateResponseOptions(input) {
    const options = [];
    
    // Generate candidate starts
    for (let i = 0; i < 3; i++) {
      const start = this.getStartContext(input);
      const firstWord = this.generateNextWord(start);
      if (firstWord) {
        options.push({
          start,
          firstWord,
          coherence: this.assessCoherence(start, firstWord),
          novelty: this.assessNovelty(start, firstWord)
        });
      }
    }
    
    if (options.length > 0) {
      const best = options.sort((a, b) => 
        (b.coherence * 0.7 + b.novelty * 0.3) - (a.coherence * 0.7 + a.novelty * 0.3)
      )[0];
      
      return `Evaluation: Selected path with ${Math.round(best.coherence * 100)}% coherence, ${Math.round(best.novelty * 100)}% novelty`;
    }
    
    return "Evaluation: Using fallback generation strategy";
  }

  assessCoherence(context, nextWord) {
    const nextMap = this.transitions.get(context);
    if (!nextMap) return 0.5;
    
    const count = nextMap.get(nextWord) || 0;
    const total = Array.from(nextMap.values()).reduce((a, b) => a + b, 0);
    
    // Base coherence on frequency
    const frequencyScore = count / Math.max(total, 1);
    
    // Boost for sentence structure
    const structureBonus = /^[.!?]/.test(nextWord) ? 0.2 : 0;
    
    return Math.min(frequencyScore + structureBonus + 0.3, 1);
  }

  assessNovelty(context, nextWord) {
    const key = `${context}→${nextWord}`;
    const weight = this.rewardWeights.get(key) || 1.0;
    
    // Novelty is inverse of weight (heavily reinforced paths are less novel)
    return Math.max(0, 1 - (weight - 1) * 0.5);
  }

  similarity(a, b) {
    if (a === b) return 1;
    const longer = a.length > b.length ? a : b;
    const shorter = a.length > b.length ? b : a;
    
    if (longer.startsWith(shorter)) return 0.9;
    if (shorter.length === 0) return 0;
    
    // Simple Levenshtein-based similarity
    const distance = this.levenshtein(a, b);
    return 1 - distance / Math.max(a.length, b.length);
  }

  levenshtein(a, b) {
    const matrix = [];
    for (let i = 0; i <= b.length; i++) matrix[i] = [i];
    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
    
    for (let i = 1; i <= b.length; i++) {
      for (let j = 1; j <= a.length; j++) {
        matrix[i][j] = b.charAt(i-1) === a.charAt(j-1) 
          ? matrix[i-1][j-1]
          : Math.min(
              matrix[i-1][j-1] + 1,
              matrix[i][j-1] + 1,
              matrix[i-1][j] + 1
            );
      }
    }
    
    return matrix[b.length][a.length];
  }

  getStartContext(seed) {
    if (!seed) {
      const contexts = Array.from(this.transitions.keys());
      return contexts[Math.floor(Math.random() * contexts.length)];
    }
    
    const seedWords = this.tokenize(seed);
    if (seedWords.length === 0) {
      const contexts = Array.from(this.transitions.keys());
      return contexts[Math.floor(Math.random() * contexts.length)];
    }
    
    // Try to find matching contexts
    const contexts = Array.from(this.transitions.keys());
    let bestContext = null;
    let bestScore = -1;
    
    for (const ctx of contexts) {
      const ctxWords = ctx.split(' ');
      let score = 0;
      
      // Exact matches
      seedWords.forEach(sw => {
        if (ctxWords.includes(sw)) score += 2;
      });
      
      // Similarity matches
      ctxWords.forEach(cw => {
        seedWords.forEach(sw => {
          if (this.similarity(cw, sw) > 0.8) score += 1;
        });
      });
      
      if (score > bestScore) {
        bestScore = score;
        bestContext = ctx;
      }
    }
    
    return bestContext || contexts[Math.floor(Math.random() * contexts.length)];
  }

  generateNextWord(context) {
    const nextMap = this.transitions.get(context);
    if (!nextMap || nextMap.size === 0) return null;
    
    const candidates = Array.from(nextMap.entries());
    const weights = candidates.map(([word, count]) => {
      const key = `${context}→${word}`;
      const reward = this.rewardWeights.get(key) || 1.0;
      const freq = count / this.totalWords;
      const rarity = 1 / (freq * 1000 + 1);
      const exploration = 0.5 + Math.random() * 0.5;
      
      // Apply cognitive weighting based on recent reasoning
      const cognitiveWeight = this.reasoningSteps.length > 0 ? 1.2 : 1.0;
      
      return (count + 1) * reward * rarity * exploration * cognitiveWeight;
    });
    
    const total = weights.reduce((a, b) => a + b, 0);
    if (total === 0) return candidates[0][0];
    
    let rand = Math.random() * total;
    for (let i = 0; i < candidates.length; i++) {
      rand -= weights[i];
      if (rand <= 0) return candidates[i][0];
    }
    
    return candidates[0][0];
  }

  generateWithReasoning(seed = null, minWords = 10, maxWords = 50) {
    if (this.transitions.size === 0) {
      return { 
        text: "I need more training data to generate meaningful responses!", 
        id: null,
        confidence: 0.3 
      };
    }
    
    // Perform cognitive reasoning
    this.think(seed || "");
    
    const responseId = Date.now() + Math.random();
    const transitions = [];
    
    // Get initial context based on reasoning
    let context = this.getStartContext(seed);
    const result = context.split(' ');
    
    let attempts = 0;
    let sentenceEnded = false;
    let totalConfidence = 0;
    let wordCount = 0;
    
    while (result.length < maxWords && attempts < maxWords * 3) {
      attempts++;
      
      const currentContext = result.slice(-this.order).join(' ');
      const nextWord = this.generateNextWord(currentContext);
      
      if (!nextWord) {
        // Creative leap - find related context
        const relatedContexts = Array.from(this.transitions.keys())
          .filter(ctx => {
            const ctxWords = ctx.split(' ');
            const lastWords = currentContext.split(' ');
            return ctxWords.some(cw => 
              lastWords.some(lw => this.similarity(cw, lw) > 0.7)
            );
          });
        
        if (relatedContexts.length > 0) {
          const randomRelated = relatedContexts[
            Math.floor(Math.random() * relatedContexts.length)
          ];
          const fallbackWord = this.generateNextWord(randomRelated);
          if (fallbackWord) {
            result.push(fallbackWord);
            transitions.push(`${randomRelated}→${fallbackWord}`);
            totalConfidence += 0.6;
          }
        }
        continue;
      }
      
      result.push(nextWord);
      transitions.push(`${currentContext}→${nextWord}`);
      wordCount++;
      
      // Calculate word-level confidence
      const nextMap = this.transitions.get(currentContext);
      const count = nextMap ? (nextMap.get(nextWord) || 0) : 0;
      const total = nextMap ? Array.from(nextMap.values()).reduce((a, b) => a + b, 0) : 1;
      const wordConfidence = count / total;
      totalConfidence += wordConfidence;
      
      // Check for sentence ending
      if (nextWord.match(/[.!?]/)) {
        sentenceEnded = true;
        if (result.length >= minWords && (result.length >= maxWords * 0.7 || Math.random() > 0.4)) {
          break;
        }
      }
    }
    
    // Post-process the generated text
    let text = result.join(' ')
      .replace(/\s+([.!?,])/g, '$1')
      .replace(/\s+/g, ' ')
      .trim();
    
    // Capitalize and ensure proper punctuation
    text = text.charAt(0).toUpperCase() + text.slice(1);
    if (!text.match(/[.!?]$/)) {
      text += Math.random() > 0.5 ? '.' : '!';
    }
    
    // Calculate overall confidence
    const avgConfidence = wordCount > 0 ? totalConfidence / wordCount : 0.5;
    const finalConfidence = avgConfidence * 0.7 + 
      (this.reasoningSteps.length > 2 ? 0.2 : 0.1) + 
      (sentenceEnded ? 0.1 : 0);
    
    // Store in memory
    this.responseHistory.push({
      id: responseId,
      text: text,
      transitions: transitions,
      reasoning: this.reasoningSteps,
      confidence: finalConfidence,
      timestamp: Date.now()
    });
    
    // Update conversation memory
    this.conversationMemory.push({
      input: seed,
      response: text,
      timestamp: Date.now()
    });
    
    if (this.responseHistory.length > 50) {
      this.responseHistory.shift();
    }
    
    if (this.conversationMemory.length > this.maxMemorySize) {
      this.conversationMemory.shift();
    }
    
    return { 
      text, 
      id: responseId,
      confidence: finalConfidence,
      reasoning: this.reasoningSteps 
    };
  }

  applyFeedback(responseId, isPositive) {
    const feedback = { responseId, isPositive, timestamp: Date.now() };
    this.feedbackHistory.push(feedback);
    
    const response = this.responseHistory.find(r => r.id === responseId);
    if (!response) return;
    
    const multiplier = isPositive ? 1.5 : 0.6;
    
    response.transitions.forEach(transition => {
      const current = this.rewardWeights.get(transition) || 1.0;
      this.rewardWeights.set(transition, current * multiplier);
    });
    
    // Also reinforce the reasoning pattern if positive
    if (isPositive && response.reasoning) {
      response.reasoning.forEach(step => {
        const stepKey = `reasoning:${step.substring(0, 50)}`;
        const current = this.cognitivePatterns.get(stepKey) || 0;
        this.cognitivePatterns.set(stepKey, current + 1);
      });
      
      // Retrain with enhanced reward
      this.train(response.text, 1.3);
    }
    
    if (this.feedbackHistory.length > 100) {
      this.feedbackHistory.shift();
    }
  }

  getInsights() {
    const totalResponses = this.responseHistory.length;
    if (totalResponses === 0) return [];
    
    const avgConfidence = this.responseHistory.reduce((sum, r) => 
      sum + (r.confidence || 0.5), 0) / totalResponses;
    
    const commonPatterns = new Map();
    this.responseHistory.forEach(r => {
      r.transitions.forEach(t => {
        commonPatterns.set(t, (commonPatterns.get(t) || 0) + 1);
      });
    });
    
    const topPatterns = Array.from(commonPatterns.entries())
      .sort((a, b) => b[1] - a[1])
      .slice(0, 3)
      .map(([pattern, count]) => `${pattern} (${count}x)`);
    
    return [
      `Average confidence: ${(avgConfidence * 100).toFixed(1)}%`,
      `Top patterns: ${topPatterns.join(', ')}`,
      `Knowledge base: ${this.knowledgeBase.size} patterns`
    ];
  }
}

const bot = new IntelligentMarkovChain(3); // Higher order for more context
let messageCounter = 0;
const conversationPairs = new Map();

// Initialize with some reasoning
bot.think("initialization");

function showThinking(reasoningSteps) {
  const panel = document.getElementById('thinkingPanel');
  panel.innerHTML = '<strong>🤔 Thinking Process:</strong>';
  
  reasoningSteps.forEach((step, index) => {
    const stepDiv = document.createElement('div');
    stepDiv.className = 'thinking-step';
    stepDiv.innerHTML = `→ ${step}`;
    panel.appendChild(stepDiv);
  });
  
  panel.style.display = 'block';
  panel.scrollTop = panel.scrollHeight;
}

function hideThinking() {
  const panel = document.getElementById('thinkingPanel');
  panel.style.display = 'none';
  panel.innerHTML = '';
}

function addMessage(text, isUser, responseId = null, messageId = null, confidence = null, reasoning = null) {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = `msg ${isUser ? 'user' : 'bot'}`;
  
  if (messageId) {
    msg.dataset.messageId = messageId;
  }
  
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = isUser ? '👤' : '🤖';
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  
  const textSpan = document.createElement('span');
  textSpan.textContent = text;
  textSpan.className = 'message-text';
  bubble.appendChild(textSpan);
  
  // Add confidence meter for bot messages
  if (!isUser && confidence !== null) {
    const confidenceDiv = document.createElement('div');
    confidenceDiv.className = 'confidence-meter';
    const fill = document.createElement('div');
    fill.className = 'confidence-fill';
    setTimeout(() => {
      fill.style.width = `${confidence * 100}%`;
    }, 100);
    confidenceDiv.appendChild(fill);
    bubble.appendChild(confidenceDiv);
    
    // Add confidence percentage
    const confidenceText = document.createElement('div');
    confidenceText.style.fontSize = '0.8rem';
    confidenceText.style.color = '#666';
    confidenceText.style.marginTop = '0.25rem';
    confidenceText.textContent = `Confidence: ${(confidence * 100).toFixed(1)}%`;
    bubble.appendChild(confidenceText);
    
    // Show reasoning insights button
    if (reasoning && reasoning.length > 0) {
      const insightBtn = document.createElement('button');
      insightBtn.className = 'edit-btn';
      insightBtn.textContent = '🧠 Show Reasoning';
      insightBtn.onclick = () => showReasoningDetails(reasoning);
      bubble.appendChild(insightBtn);
    }
  }
  
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  
  // Add edit button to user messages
  if (isUser && messageId) {
    const editBtn = document.createElement('button');
    editBtn.className = 'edit-btn';
    editBtn.textContent = '✏️ Edit';
    editBtn.onclick = () => editMessage(messageId);
    bubble.appendChild(editBtn);
  }
  
  // Add feedback and regenerate to bot messages
  if (!isUser && responseId) {
    const actionsDiv = document.createElement('div');
    actionsDiv.style.marginTop = '0.5rem';
    actionsDiv.style.display = 'flex';
    actionsDiv.style.gap = '0.5rem';
    actionsDiv.style.flexWrap = 'wrap';
    
    const feedbackDiv = document.createElement('div');
    feedbackDiv.className = 'feedback-buttons';
    feedbackDiv.style.flex = '1';
    feedbackDiv.style.margin = '0';
    feedbackDiv.style.padding = '0';
    feedbackDiv.style.border = 'none';
    feedbackDiv.innerHTML = `
      <button class="feedback-btn thumbs-up" onclick="giveFeedback(${responseId}, true)" title="Good response">👍</button>
      <button class="feedback-btn thumbs-down" onclick="giveFeedback(${responseId}, false)" title="Bad response">👎</button>
    `;
    
    const regenBtn = document.createElement('button');
    regenBtn.className = 'regenerate-btn';
    regenBtn.innerHTML = '🔄 Regenerate';
    regenBtn.onclick = () => regenerateResponse(messageId);
    
    actionsDiv.appendChild(feedbackDiv);
    actionsDiv.appendChild(regenBtn);
    bubble.appendChild(actionsDiv);
  }
  
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  
  return messageId;
}

function showReasoningDetails(reasoning) {
  const details = document.createElement('div');
  details.style.padding = '1rem';
  details.style.background = '#f8f9fa';
  details.style.borderRadius = '0.5rem';
  details.style.marginTop = '0.5rem';
  details.style.border = '1px solid #e0e0e0';
  
  details.innerHTML = '<strong>Reasoning Steps:</strong><br>';
  reasoning.forEach((step, i) => {
    details.innerHTML += `${i + 1}. ${step}<br>`;
  });
  
  // Find the message and add details
  const messages = document.querySelectorAll('.msg.bot');
  const lastMsg = messages[messages.length - 1];
  if (lastMsg) {
    const bubble = lastMsg.querySelector('.bubble');
    bubble.appendChild(details);
    
    // Add close button
    const closeBtn = document.createElement('button');
    closeBtn.textContent = 'Close';
    closeBtn.style.marginTop = '0.5rem';
    closeBtn.onclick = () => details.remove();
    details.appendChild(closeBtn);
  }
}

function editMessage(messageId) {
  const msg = document.querySelector(`[data-message-id="${messageId}"]`);
  if (!msg) return;
  
  const bubble = msg.querySelector('.bubble');
  const textSpan = bubble.querySelector('.message-text');
  const currentText = textSpan.textContent;
  
  const editInput = document.createElement('textarea');
  editInput.className = 'edit-input';
  editInput.value = currentText;
  editInput.rows = 3;
  
  const editActions = document.createElement('div');
  editActions.className = 'edit-actions';
  
  const saveBtn = document.createElement('button');
  saveBtn.textContent = '✓ Save & Regenerate';
  saveBtn.onclick = () => saveEdit(messageId, editInput.value);
  
  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = '✕ Cancel';
  cancelBtn.style.background = '#6c757d';
  cancelBtn.onclick = () => cancelEdit(messageId);
  
  editActions.appendChild(saveBtn);
  editActions.appendChild(cancelBtn);
  
  textSpan.style.display = 'none';
  bubble.querySelector('.edit-btn').style.display = 'none';
  
  bubble.insertBefore(editInput, textSpan.nextSibling);
  bubble.insertBefore(editActions, editInput.nextSibling);
  
  editInput.focus();
  editInput.select();
}

function cancelEdit(messageId) {
  const msg = document.querySelector(`[data-message-id="${messageId}"]`);
  if (!msg) return;
  
  const bubble = msg.querySelector('.bubble');
  const textSpan = bubble.querySelector('.message-text');
  const editInput = bubble.querySelector('.edit-input');
  const editActions = bubble.querySelector('.edit-actions');
  
  textSpan.style.display = '';
  bubble.querySelector('.edit-btn').style.display = '';
  editInput.remove();
  editActions.remove();
}

function saveEdit(messageId, newText) {
  if (!newText.trim()) return;
  
  const msg = document.querySelector(`[data-message-id="${messageId}"]`);
  if (!msg) return;
  
  const bubble = msg.querySelector('.bubble');
  const textSpan = bubble.querySelector('.message-text');
  const editInput = bubble.querySelector('.edit-input');
  const editActions = bubble.querySelector('.edit-actions');
  
  textSpan.textContent = newText;
  textSpan.style.display = '';
  bubble.querySelector('.edit-btn').style.display = '';
  editInput.remove();
  editActions.remove();
  
  bot.train(newText, 1.0);
  
  const pair = conversationPairs.get(messageId);
  if (pair) {
    const botMsg = document.querySelector(`[data-message-id="${pair.botMessageId}"]`);
    if (botMsg) botMsg.remove();
  }
  
  showThinking(["Re-thinking based on edited input..."]);
  
  setTimeout(() => {
    hideThinking();
    const result = bot.generateWithReasoning(newText, 12, 50);
    const botMessageId = messageCounter++;
    conversationPairs.set(messageId, { botMessageId, userText: newText });
    addMessage(result.text, false, result.id, botMessageId, result.confidence, result.reasoning);
    updateStats();
  }, 1000 + Math.random() * 800);
}

function regenerateResponse(botMessageId) {
  let userMessageId = null;
  let userText = '';
  
  for (const [uId, pair] of conversationPairs.entries()) {
    if (pair.botMessageId === botMessageId) {
      userMessageId = uId;
      userText = pair.userText;
      break;
    }
  }
  
  if (!userText) return;
  
  const botMsg = document.querySelector(`[data-message-id="${botMessageId}"]`);
  if (botMsg) botMsg.remove();
  
  showThinking(["Re-evaluating and generating alternative response..."]);
  
  setTimeout(() => {
    hideThinking();
    const result = bot.generateWithReasoning(userText, 12, 50);
    const newBotMessageId = messageCounter++;
    conversationPairs.set(userMessageId, { botMessageId: newBotMessageId, userText });
    addMessage(result.text, false, result.id, newBotMessageId, result.confidence, result.reasoning);
    updateStats();
  }, 1000 + Math.random() * 800);
}

function giveFeedback(responseId, isPositive) {
  bot.applyFeedback(responseId, isPositive);
  
  const buttons = document.querySelectorAll(`button[onclick*="${responseId}"]`);
  buttons.forEach(btn => {
    btn.disabled = true;
    btn.style.opacity = '0.5';
  });
  
  const chat = document.getElementById('chat');
  const notification = document.createElement('div');
  notification.className = 'learning-notification';
  notification.textContent = isPositive 
    ? '✓ Reinforcing successful reasoning patterns!' 
    : '✓ Adjusting cognitive patterns based on feedback!';
  chat.appendChild(notification);
  
  setTimeout(() => notification.remove(), 3000);
  updateStats();
}

function showTyping() {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = 'msg bot';
  msg.id = 'typing';
  
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '🤖';
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  
  bubble.appendChild(typing);
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const typing = document.getElementById('typing');
  if (typing) typing.remove();
}

function send() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  
  if (!text) return;
  
  const userMessageId = messageCounter++;
  addMessage(text, true, null, userMessageId);
  bot.train(text, 1.0);
  input.value = '';
  
  showThinking(["Processing your message...", "Activating cognitive reasoning..."]);
  showTyping();
  
  setTimeout(() => {
    showThinking(bot.think(text));
  }, 500);
  
  setTimeout(() => {
    removeTyping();
    hideThinking();
    const result = bot.generateWithReasoning(text, 12, 50);
    const botMessageId = messageCounter++;
    conversationPairs.set(userMessageId, { botMessageId, userText: text });
    addMessage(result.text, false, result.id, botMessageId, result.confidence, result.reasoning);
    updateStats();
  }, 1500 + Math.random() * 1000);
}

function updateStats() {
  const statsDiv = document.getElementById('stats');
  if (!statsDiv) return;
  
  const totalFeedback = bot.feedbackHistory.length;
  const positive = bot.feedbackHistory.filter(f => f.isPositive).length;
  const satisfaction = totalFeedback > 0 ? Math.round((positive / totalFeedback) * 100) : 0;
  
  const insights = bot.getInsights();
  
  statsDiv.innerHTML = `
    <div class="stat">🧠 Contexts: ${bot.transitions.size}</div>
    <div class="stat">📚 Knowledge: ${bot.knowledgeBase.size}</div>
    <div class="stat">💭 Memory: ${bot.conversationMemory.length}</div>
    <div class="stat">👍 ${positive}/${totalFeedback}</div>
    <div class="stat">✨ ${satisfaction}%</div>
    ${insights.length > 0 ? `<div class="stat insight-badge">${insights[0]}</div>` : ''}
  `;
}

document.getElementById('userInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') send();
});

setTimeout(() => {
  addMessage("Hello! I'm an intelligent Markov chain bot with cognitive reasoning capabilities. I think through multiple steps before responding. Try asking me complex questions!", false, null, null, 0.85, [
    "Initializing cognitive systems...",
    "Loading reasoning patterns...",
    "Ready for meaningful conversation!"
  ]);
}, 500);

setTimeout(updateStats, 100);
</script>
