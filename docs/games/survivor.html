<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival Instinct Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        #simulation {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #canvas-container {
            flex: 1;
            position: relative;
        }
        #world {
            width: 100%;
            height: 100%;
            background-color: #222;
        }
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            z-index: 10;
        }
        #controls button, #controls input, #controls select {
            margin: 5px;
            padding: 5px;
            border: none;
            border-radius: 5px;
            background: #444;
            color: #fff;
        }
        #day-night {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 14px;
            z-index: 10;
        }
        #stats {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="simulation">
        <div id="canvas-container">
            <canvas id="world"></canvas>
            <div id="day-night">Day: 1, Time: Day</div>
            <div id="stats">Animals: 0, Plants: 0</div>
        </div>
        <div id="controls">
            <button id="start">Start</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
            <label>Initial Animals: <input type="number" id="init-animals" value="10" min="1" max="100"></label>
            <label>Initial Plants: <input type="number" id="init-plants" value="50" min="10" max="500"></label>
            <label>World Size: <select id="world-size">
                <option value="500">Small (500x500)</option>
                <option value="800" selected>Medium (800x800)</option>
                <option value="1200">Large (1200x1200)</option>
            </select></label>
            <label>Simulation Speed: <input type="range" id="sim-speed" min="1" max="10" value="5"></label>
        </div>
    </div>
    <script>
        const WORLD_SIZE = parseInt(document.getElementById('world-size').value);
        const canvas = document.getElementById('world');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - document.getElementById('controls').offsetHeight;
        let worldWidth = WORLD_SIZE;
        let worldHeight = WORLD_SIZE;
        let SCALE = Math.min(canvas.width / worldWidth, canvas.height / worldHeight);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - document.getElementById('controls').offsetHeight;
            SCALE = Math.min(canvas.width / worldWidth, canvas.height / worldHeight);
        });

        let animals = [];
        let plants = [];
        let day = 1;
        let timeOfDay = 'Day';
        let cycleTime = 0;
        const CYCLE_DURATION = 600;
        let isRunning = false;
        let simSpeed = 5;

        class DNA {
            constructor() {
                this.growthRate = Math.random() * 0.05 + 0.01;
                this.speed = Math.random() * 2 + 1;
                this.metabolism = Math.random() * 0.5 + 0.5;
                this.seedCount = Math.floor(Math.random() * 3) + 1;
                this.sightRange = Math.random() * 50 + 50;
                this.reproductionThreshold = Math.random() * 100 + 200;
                this.communicationRange = Math.random() * 20 + 20;
            }
        }

        class SimpleNN {
            constructor(inputs, outputs) {
                this.weights = Array.from({length: outputs}, () => Array(inputs).fill(Math.random() * 2 - 1));
                this.biases = Array(outputs).fill(Math.random() * 2 - 1);
            }
            predict(inputs) {
                return this.weights.map((row, i) => {
                    let sum = row.reduce((acc, w, j) => acc + w * inputs[j], 0) + this.biases[i];
                    return 1 / (1 + Math.exp(-sum));
                });
            }
            train(inputs, targets, learningRate = 0.1) {
                const outputs = this.predict(inputs);
                const errors = targets.map((t, i) => t - outputs[i]);
                errors.forEach((err, i) => {
                    this.biases[i] += learningRate * err;
                    inputs.forEach((inp, j) => {
                        this.weights[i][j] += learningRate * err * inp;
                    });
                });
            }
        }

        class Plant {
            constructor(x, y, dna = new DNA()) {
                this.x = x;
                this.y = y;
                this.dna = dna;
                this.size = 1;
                this.maxSize = 10;
                this.energy = 50;
                this.age = 0;
                this.lifespan = Math.random() * 3000 + 2000;
                this.seeds = [];
            }
            grow() {
                if (timeOfDay === 'Day') {
                    this.energy += this.dna.growthRate * 2;
                } else {
                    this.energy += this.dna.growthRate;
                }
                if (this.energy > 10 && this.size < this.maxSize) {
                    this.size += 0.1;
                    this.energy -= 5;
                }
                this.age++;
                if (this.age > this.lifespan) {
                    this.die();
                }
                if (Math.random() < 0.01 && this.size > 5) {
                    this.produceSeeds();
                }
            }
            produceSeeds() {
                for (let i = 0; i < this.dna.seedCount; i++) {
                    const seedX = this.x + Math.random() * 20 - 10;
                    const seedY = this.y + Math.random() * 20 - 10;
                    if (seedX > 0 && seedX < worldWidth && seedY > 0 && seedY < worldHeight) {
                        plants.push(new Plant(seedX, seedY, mutateDNA(this.dna)));
                    }
                }
            }
            die() {
                plants = plants.filter(p => p !== this);
            }
            draw() {
                ctx.fillStyle = 'green';
                ctx.beginPath();
                ctx.arc(this.x * SCALE, this.y * SCALE, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Animal {
            constructor(x, y, dna = new DNA()) {
                this.x = x;
                this.y = y;
                this.dna = dna;
                this.size = 5;
                this.energy = 100;
                this.age = 0;
                this.lifespan = 7 * 1200;
                this.speed = this.dna.speed;
                this.direction = Math.random() * Math.PI * 2;
                this.sightConeAngle = Math.PI / 3;
                this.sightRange = this.dna.sightRange;
                this.memory = new Map();
                this.nnMemory = new SimpleNN(3, 1);
                this.nnComm = new SimpleNN(4, 2);
                this.eatingTime = 0;
                this.targetPlant = null;
                this.id = Math.random().toString(36).substr(2, 9);
                this.knownPlants = [];
            }
            update() {
                this.age++;
                if (this.age > this.lifespan) {
                    this.die();
                    return;
                }
                this.energy -= this.dna.metabolism;
                if (this.energy < 0) {
                    this.die();
                    return;
                }
                if (this.eatingTime > 0) {
                    this.eat();
                    return;
                }
                this.perceive();
                this.communicate();
                this.move();
                if (this.energy > this.dna.reproductionThreshold) {
                    this.reproduce();
                }
            }
            perceive() {
                let closestPlant = null;
                let minDist = Infinity;
                plants.forEach(p => {
                    const dx = p.x - this.x;
                    const dy = p.y - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < this.sightRange) {
                        const angle = Math.atan2(dy, dx);
                        const dirDiff = Math.abs((angle - this.direction + Math.PI*2) % (Math.PI*2) - Math.PI);
                        if (dirDiff < this.sightConeAngle / 2) {
                            if (dist < minDist) {
                                minDist = dist;
                                closestPlant = p;
                            }
                            if (!this.knownPlants.some(kp => kp === p)) {
                                this.knownPlants.push(p);
                            }
                        }
                    }
                });
                if (closestPlant) {
                    this.targetPlant = closestPlant;
                    const dx = closestPlant.x - this.x;
                    const dy = closestPlant.y - this.y;
                    this.direction = Math.atan2(dy, dx);
                } else {
                    this.direction += Math.random() * 0.2 - 0.1;
                }
                animals.forEach(a => {
                    if (a !== this) {
                        const dx = a.x - this.x;
                        const dy = a.y - this.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < this.sightRange) {
                            const inputs = [dist / this.sightRange, (a.size - this.size) / 10, this.memory.get(a.id) || 0];
                            const trust = this.nnMemory.predict(inputs)[0];
                            this.memory.set(a.id, trust);
                            if (Math.random() < 0.01) {
                                const target = Math.random() > 0.5 ? 1 : 0;
                                this.nnMemory.train(inputs, [target]);
                            }
                        }
                    }
                });
                this.knownPlants = this.knownPlants.filter(p => plants.includes(p));
            }
            communicate() {
                animals.forEach(a => {
                    if (a !== this) {
                        const dx = a.x - this.x;
                        const dy = a.y - this.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < this.dna.communicationRange) {
                            const trust = this.memory.get(a.id) || 0;
                            if (trust > 0.5 && Math.random() < 0.05) {
                                this.sendSignal(a);
                            }
                            if (trust > 0.5 && Math.random() < 0.05) {
                                this.receiveSignal(a);
                            }
                        }
                    }
                });
            }
            sendSignal(receiver) {
                if (this.knownPlants.length > 0) {
                    const plantToShare = this.knownPlants[Math.floor(Math.random() * this.knownPlants.length)];
                    const signal = [plantToShare.x / worldWidth, plantToShare.y / worldHeight, plantToShare.size / 10, this.energy / 100];
                    const response = receiver.processSignal(signal, this);
                    const targetTrust = response[0] > 0.5 ? 1 : 0;
                    this.nnComm.train(signal, [targetTrust, Math.random()]);
                }
            }
            receiveSignal(sender) {
                return this.nnComm.predict([sender.x / worldWidth, sender.y / worldHeight, sender.size / 10, sender.energy / 100]);
            }
            processSignal(signal, sender) {
                const outputs = this.nnComm.predict(signal);
                const accept = outputs[0] > 0.5;
                if (accept) {
                    const sharedPlant = {x: signal[0] * worldWidth, y: signal[1] * worldHeight, size: signal[2] * 10};
                    const existing = plants.find(p => Math.abs(p.x - sharedPlant.x) < 1 && Math.abs(p.y - sharedPlant.y) < 1);
                    if (existing && !this.knownPlants.includes(existing)) {
                        this.knownPlants.push(existing);
                        if (!this.targetPlant || Math.random() < 0.3) {
                            this.targetPlant = existing;
                        }
                    }
                }
                const targetAccept = accept ? 1 : 0;
                this.nnComm.train(signal, [targetAccept, outputs[1]]);
                return outputs;
            }
            move() {
                if (this.targetPlant) {
                    const dx = this.targetPlant.x - this.x;
                    const dy = this.targetPlant.y - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < this.size + this.targetPlant.size) {
                        this.startEating();
                        return;
                    }
                    const moveDist = Math.min(this.speed, dist);
                    this.x += Math.cos(this.direction) * moveDist;
                    this.y += Math.sin(this.direction) * moveDist;
                } else {
                    this.x += Math.cos(this.direction) * this.speed;
                    this.y += Math.sin(this.direction) * this.speed;
                }
                this.x = (this.x + worldWidth) % worldWidth;
                this.y = (this.y + worldHeight) % worldHeight;
            }
            startEating() {
                this.eatingTime = 30;
            }
            eat() {
                this.eatingTime--;
                if (this.eatingTime <= 0) {
                    if (this.targetPlant) {
                        this.energy += this.targetPlant.size * 10;
                        this.targetPlant.die();
                        this.targetPlant = null;
                    }
                }
            }
            reproduce() {
                const childDNA = mutateDNA(this.dna);
                const child = new Animal(this.x + Math.random()*10-5, this.y + Math.random()*10-5, childDNA);
                animals.push(child);
                this.energy /= 2;
            }
            die() {
                animals = animals.filter(a => a !== this);
            }
            draw() {
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(this.x * SCALE, this.y * SCALE, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(this.x * SCALE, this.y * SCALE);
                const leftAngle = this.direction - this.sightConeAngle / 2;
                const rightAngle = this.direction + this.sightConeAngle / 2;
                ctx.lineTo(
                    (this.x + Math.cos(leftAngle) * this.sightRange) * SCALE,
                    (this.y + Math.sin(leftAngle) * this.sightRange) * SCALE
                );
                ctx.arc(this.x * SCALE, this.y * SCALE, this.sightRange * SCALE, leftAngle, rightAngle);
                ctx.lineTo(this.x * SCALE, this.y * SCALE);
                ctx.fillStyle = 'rgba(255,255,0,0.2)';
                ctx.fill();
                ctx.strokeStyle = 'blue';
                ctx.beginPath();
                ctx.arc(this.x * SCALE, this.y * SCALE, this.dna.communicationRange * SCALE, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function mutateDNA(dna) {
            const newDNA = new DNA();
            Object.keys(dna).forEach(key => {
                if (typeof dna[key] === 'number') {
                    newDNA[key] = dna[key] * (Math.random() * 0.2 + 0.9);
                } else {
                    newDNA[key] = dna[key];
                }
            });
            return newDNA;
        }

        function init() {
            animals = [];
            plants = [];
            day = 1;
            timeOfDay = 'Day';
            cycleTime = 0;
            worldWidth = parseInt(document.getElementById('world-size').value);
            worldHeight = worldWidth;
            SCALE = Math.min(canvas.width / worldWidth, canvas.height / worldHeight);
            const initAnimals = parseInt(document.getElementById('init-animals').value);
            const initPlants = parseInt(document.getElementById('init-plants').value);
            for (let i = 0; i < initAnimals; i++) {
                animals.push(new Animal(Math.random() * worldWidth, Math.random() * worldHeight));
            }
            for (let i = 0; i < initPlants; i++) {
                plants.push(new Plant(Math.random() * worldWidth, Math.random() * worldHeight));
            }
        }

        function update() {
            if (!isRunning) return;
            cycleTime++;
            if (cycleTime >= CYCLE_DURATION) {
                cycleTime = 0;
                if (timeOfDay === 'Day') {
                    timeOfDay = 'Night';
                } else {
                    timeOfDay = 'Day';
                    day++;
                }
            }
            plants.forEach(p => p.grow());
            animals.forEach(a => a.update());
            draw();
            setTimeout(update, 1000 / (30 * simSpeed));
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = timeOfDay === 'Day' ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            plants.forEach(p => p.draw());
            animals.forEach(a => a.draw());
            document.getElementById('day-night').textContent = `Day: ${day}, Time: ${timeOfDay}`;
            document.getElementById('stats').textContent = `Animals: ${animals.length}, Plants: ${plants.length}`;
        }

        document.getElementById('start').addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                update();
            }
        });
        document.getElementById('pause').addEventListener('click', () => {
            isRunning = false;
        });
        document.getElementById('reset').addEventListener('click', () => {
            isRunning = false;
            init();
            draw();
        });
        document.getElementById('world-size').addEventListener('change', () => {
            worldWidth = parseInt(document.getElementById('world-size').value);
            worldHeight = worldWidth;
            SCALE = Math.min(canvas.width / worldWidth, canvas.height / worldHeight);
        });
        document.getElementById('sim-speed').addEventListener('input', () => {
            simSpeed = parseInt(document.getElementById('sim-speed').value);
        });

        init();
        draw();

        function handleTouch(event) {
        }
        canvas.addEventListener('touchstart', handleTouch);
    </script>
</body>
</html>
