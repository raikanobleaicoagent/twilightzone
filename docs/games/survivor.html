<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Instinct Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; width: 100%; height: auto; }
        #controls { position: absolute; top: 10px; left: 10px; background: rgba(255, 255, 255, 0.7); padding: 10px; border-radius: 5px; font-size: 14px; }
        #controls label { display: block; margin-bottom: 5px; }
        #controls input[type="range"] { width: 150px; }
        #controls button { margin-top: 10px; }
    </style>
</head>
<body>
    <canvas id="sim"></canvas>
    <div id="controls">
        <label>Initial Animals: <input type="range" id="numAnimals" min="1" max="50" value="10"><span id="numAnimalsVal">10</span></label>
        <label>Initial Plants: <input type="range" id="numPlants" min="10" max="200" value="50"><span id="numPlantsVal">50</span></label>
        <label>World Size: <input type="range" id="worldSize" min="500" max="2000" value="800" step="100"><span id="worldSizeVal">800</span></label>
        <label>Sim Speed Multiplier: <input type="range" id="simSpeed" min="0.1" max="5" value="1" step="0.1"><span id="simSpeedVal">1</span></label>
        <button id="start">Start/Reset</button>
    </div>
    <script>
        const canvas = document.getElementById('sim');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start');
        const numAnimalsInput = document.getElementById('numAnimals');
        const numPlantsInput = document.getElementById('numPlants');
        const worldSizeInput = document.getElementById('worldSize');
        const simSpeedInput = document.getElementById('simSpeed');
        const numAnimalsVal = document.getElementById('numAnimalsVal');
        const numPlantsVal = document.getElementById('numPlantsVal');
        const worldSizeVal = document.getElementById('worldSizeVal');
        const simSpeedVal = document.getElementById('simSpeedVal');

        numAnimalsInput.addEventListener('input', () => numAnimalsVal.textContent = numAnimalsInput.value);
        numPlantsInput.addEventListener('input', () => numPlantsVal.textContent = numPlantsInput.value);
        worldSizeInput.addEventListener('input', () => worldSizeVal.textContent = worldSizeInput.value);
        simSpeedInput.addEventListener('input', () => simSpeedVal.textContent = simSpeedInput.value);

        let running = false;
        let lastTime = 0;
        let totalSimTime = 0;
        let animals = [];
        let plants = [];
        let animalId = 0;
        let worldSize = 800;
        const baseSpeed = 3600; // sim seconds per real second at 1x
        const dnaRanges = {
            speed: [50, 150], // pixels per sim hour
            metabolism: [0.5, 1],
            sightAngle: [45, 135],
            sightDist: [100, 300],
            reproThreshold: [80, 120],
            lifespan: [5, 7]
        };
        const plantDnaRanges = {
            growthRate: [0.00005, 0.00015], // size per sim second
            numSeeds: [1, 4],
            lifespan: [5, 7]
        };

        function sigmoid(x) {
            return 1 / (1 + Math.exp(-x));
        }

        function dsigmoid(y) {
            return y * (1 - y);
        }

        class NN {
            constructor(ni, nh, no) {
                this.ni = ni;
                this.nh = nh;
                this.no = no;
                this.wih = Array.from({length: nh}, () => Array(ni).fill(0).map(() => Math.random() * 2 - 1));
                this.who = Array.from({length: no}, () => Array(nh).fill(0).map(() => Math.random() * 2 - 1));
            }

            predict(input) {
                const hidden = this.wih.map(row => sigmoid(row.reduce((sum, w, i) => sum + w * input[i], 0)));
                const output = this.who.map(row => sigmoid(row.reduce((sum, w, i) => sum + w * hidden[i], 0)));
                return output;
            }

            train(input, target, lr = 0.1) {
                const hidden = this.wih.map(row => sigmoid(row.reduce((sum, w, i) => sum + w * input[i], 0)));
                const output = this.who.map(row => sigmoid(row.reduce((sum, w, i) => sum + w * hidden[i], 0)));
                const outErr = target.map((t, j) => t - output[j]);
                const outDelta = outErr.map((e, j) => e * dsigmoid(output[j]));
                const hidErr = Array(this.nh).fill(0).map((_, i) => outDelta.reduce((sum, d, j) => sum + this.who[j][i] * d, 0));
                const hidDelta = hidErr.map((e, i) => e * dsigmoid(hidden[i]));
                // Update who
                for (let j = 0; j < this.no; j++) {
                    for (let i = 0; i < this.nh; i++) {
                        this.who[j][i] += lr * outDelta[j] * hidden[i];
                    }
                }
                // Update wih
                for (let i = 0; i < this.nh; i++) {
                    for (let k = 0; k < this.ni; k++) {
                        this.wih[i][k] += lr * hidDelta[i] * input[k];
                    }
                }
            }
        }

        function randomDNA(type) {
            if (type === 'plant') {
                return {
                    growthRate: plantDnaRanges.growthRate[0] + Math.random() * (plantDnaRanges.growthRate[1] - plantDnaRanges.growthRate[0]),
                    numSeeds: Math.floor(plantDnaRanges.numSeeds[0] + Math.random() * (plantDnaRanges.numSeeds[1] - plantDnaRanges.numSeeds[0] + 1)),
                    lifespan: (plantDnaRanges.lifespan[0] + Math.random() * (plantDnaRanges.lifespan[1] - plantDnaRanges.lifespan[0])) * 86400
                };
            } else {
                return {
                    speed: dnaRanges.speed[0] + Math.random() * (dnaRanges.speed[1] - dnaRanges.speed[0]),
                    metabolism: dnaRanges.metabolism[0] + Math.random() * (dnaRanges.metabolism[1] - dnaRanges.metabolism[0]),
                    sightAngle: dnaRanges.sightAngle[0] + Math.random() * (dnaRanges.sightAngle[1] - dnaRanges.sightAngle[0]),
                    sightDist: dnaRanges.sightDist[0] + Math.random() * (dnaRanges.sightDist[1] - dnaRanges.sightDist[0]),
                    reproThreshold: dnaRanges.reproThreshold[0] + Math.random() * (dnaRanges.reproThreshold[1] - dnaRanges.reproThreshold[0]),
                    lifespan: (dnaRanges.lifespan[0] + Math.random() * (dnaRanges.lifespan[1] - dnaRanges.lifespan[0])) * 86400
                };
            }
        }

        function mutateDNA(dna, type) {
            const ranges = type === 'plant' ? plantDnaRanges : dnaRanges;
            const newDna = { ...dna };
            for (let key in newDna) {
                if (key === 'numSeeds') {
                    newDna[key] = Math.max(1, newDna[key] + (Math.random() < 0.5 ? -1 : 1));
                } else {
                    newDna[key] *= (Math.random() * 0.2 + 0.9);
                    const [min, max] = ranges[key];
                    newDna[key] = Math.max(min, Math.min(max, newDna[key]));
                    if (key === 'lifespan') newDna[key] *= 86400;
                }
            }
            return newDna;
        }

        function dnaToInput(dna) {
            return Object.keys(dnaRanges).map(key => (dna[key] - dnaRanges[key][0]) / (dnaRanges[key][1] - dnaRanges[key][0]));
        }

        class Plant {
            constructor(x, y, dna = randomDNA('plant'), isSeed = true) {
                this.x = x;
                this.y = y;
                this.dna = dna;
                this.age = 0;
                this.size = isSeed ? 0 : 5 + Math.random() * 5;
                this.eater = null;
            }

            update(dt, isDay) {
                this.age += dt;
                if (this.age > this.dna.lifespan) return true;
                if (isDay) {
                    this.size += this.dna.growthRate * dt;
                }
                this.size = Math.min(this.size, 10);
                if (this.size >= 10 && Math.random() < 0.01 * dt / 86400) {
                    for (let i = 0; i < this.dna.numSeeds; i++) {
                        const angle = Math.random() * 2 * Math.PI;
                        const dist = Math.random() * 20 + 10;
                        let nx = this.x + Math.cos(angle) * dist;
                        let ny = this.y + Math.sin(angle) * dist;
                        if (nx > 0 && nx < worldSize && ny > 0 && ny < worldSize) {
                            plants.push(new Plant(nx, ny, mutateDNA(this.dna, 'plant')));
                        }
                    }
                }
                return false;
            }

            draw() {
                ctx.fillStyle = 'green';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
                ctx.fill();
            }
        }

        class Animal {
            constructor(x, y, dna = randomDNA('animal')) {
                this.x = x;
                this.y = y;
                this.dna = dna;
                this.age = 0;
                this.energy = 50;
                this.maxEnergy = 200;
                this.dir = Math.random() * 2 * Math.PI;
                this.id = animalId++;
                this.memoryNN = new NN(6, 4, 1);
                this.eating = null;
                this.eatTime = 0;
                this.eatDuration = 10; // sim seconds
                this.target = null;
            }

            update(dt) {
                this.age += dt;
                if (this.age > this.dna.lifespan || this.energy <= 0) return true;
                this.energy -= this.dna.metabolism * dt / 3600;
                this.energy = Math.max(0, this.energy);

                if (this.eating) {
                    this.eatTime += dt;
                    if (this.eatTime > this.eatDuration) {
                        this.energy += this.eating.size * 10;
                        this.energy = Math.min(this.maxEnergy, this.energy);
                        const index = plants.indexOf(this.eating);
                        if (index > -1) plants.splice(index, 1);
                        this.eating = null;
                        this.target = null;
                    }
                    return false;
                }

                // Sense
                const seenPlants = plants.filter(p => {
                    const dx = p.x - this.x;
                    const dy = p.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > this.dna.sightDist || dist < 1) return false;
                    const angle = Math.atan2(dy, dx);
                    const relAngle = (angle - this.dir + Math.PI * 2) % (Math.PI * 2) - Math.PI;
                    return Math.abs(relAngle) < (this.dna.sightAngle * Math.PI / 360) / 2;
                });

                const viablePlants = seenPlants.filter(p => {
                    const nearbyAnimal = animals.find(a => a !== this && Math.hypot(a.x - p.x, a.y - p.y) < 10 && (a.eating === p || a.target === p));
                    if (nearbyAnimal) {
                        const score = this.memoryNN.predict(dnaToInput(nearbyAnimal.dna))[0];
                        return score >= 0.5;
                    }
                    return true;
                });

                if (viablePlants.length > 0) {
                    viablePlants.sort((a, b) => Math.hypot(a.x - this.x, a.y - this.y) - Math.hypot(b.x - this.x, b.y - this.y));
                    this.target = viablePlants[0];
                } else {
                    this.target = null;
                }

                // Move
                let vx = Math.cos(this.dir);
                let vy = Math.sin(this.dir);
                if (this.target) {
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    this.dir = Math.atan2(dy, dx);
                    vx = Math.cos(this.dir);
                    vy = Math.sin(this.dir);
                    const dist = Math.hypot(dx, dy);
                    if (dist < this.target.size + 5) {
                        if (!this.target.eater) {
                            this.eating = this.target;
                            this.target.eater = this;
                            this.eatTime = 0;
                        } else {
                            // Negative interaction
                            const thief = animals.find(a => a.eating === this.target);
                            if (thief) {
                                this.memoryNN.train(dnaToInput(thief.dna), [0]);
                            }
                            this.target = null;
                        }
                    }
                } else {
                    // Random walk
                    this.dir += (Math.random() - 0.5) * 0.5;
                }
                const speedPerHour = this.dna.speed;
                this.x += vx * (speedPerHour / 3600) * dt;
                this.y += vy * (speedPerHour / 3600) * dt;

                // Bounds
                if (this.x < 0) { this.x = 0; this.dir = Math.PI - this.dir; }
                if (this.x > worldSize) { this.x = worldSize; this.dir = Math.PI - this.dir; }
                if (this.y < 0) { this.y = 0; this.dir = -this.dir; }
                if (this.y > worldSize) { this.y = worldSize; this.dir = -this.dir; }

                // Reproduce
                if (this.energy > this.dna.reproThreshold) {
                    this.energy -= 50;
                    const angle = Math.random() * 2 * Math.PI;
                    const dist = 10;
                    let nx = this.x + Math.cos(angle) * dist;
                    let ny = this.y + Math.sin(angle) * dist;
                    nx = Math.max(0, Math.min(worldSize, nx));
                    ny = Math.max(0, Math.min(worldSize, ny));
                    animals.push(new Animal(nx, ny, mutateDNA(this.dna)));
                }

                return false;
            }

            draw() {
                // Dot
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, 2 * Math.PI);
                ctx.fill();

                // Sight cone
                const coneAngle = this.dna.sightAngle * Math.PI / 180 / 2;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.arc(this.x, this.y, this.dna.sightDist, this.dir - coneAngle, this.dir + coneAngle);
                ctx.closePath();
                ctx.fillStyle = 'rgba(0, 0, 255, 0.1)';
                ctx.fill();
            }
        }

        function init() {
            worldSize = parseInt(worldSizeInput.value);
            canvas.width = worldSize;
            canvas.height = worldSize;
            animals = [];
            plants = [];
            animalId = 0;
            totalSimTime = 0;
            const numPlants = parseInt(numPlantsInput.value);
            const numAnimals = parseInt(numAnimalsInput.value);
            for (let i = 0; i < numPlants; i++) {
                plants.push(new Plant(Math.random() * worldSize, Math.random() * worldSize));
            }
            for (let i = 0; i < numAnimals; i++) {
                animals.push(new Animal(Math.random() * worldSize, Math.random() * worldSize));
            }
            running = true;
        }

        function loop(time) {
            if (!running) {
                requestAnimationFrame(loop);
                return;
            }
            const dt_real = (time - lastTime) / 1000;
            lastTime = time;
            const simMultiplier = parseFloat(simSpeedInput.value);
            const dt = dt_real * baseSpeed * simMultiplier;
            totalSimTime += dt;

            const dayPos = totalSimTime % 86400;
            const isDay = dayPos < 43200;

            // Update plants
            plants = plants.filter(p => !p.update(dt, isDay));

            // Update animals
            animals = animals.filter(a => !a.update(dt));

            // Draw
            ctx.fillStyle = isDay ? 'lightblue' : 'darkblue';
            ctx.fillRect(0, 0, worldSize, worldSize);
            plants.forEach(p => p.draw());
            animals.forEach(a => a.draw());

            requestAnimationFrame(loop);
        }

        startBtn.addEventListener('click', () => {
            init();
        });

        lastTime = performance.now();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
