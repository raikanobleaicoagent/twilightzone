  <div id="top">
    <div style="display:flex;align-items:center"><span class="title">River Flows</span><span class="turn" id="turnN">T0</span></div>

<script>
const S=28,SQ3=Math.sqrt(3),RAD=3;
const DIRS=[[0,-1],[1,-1],[1,0],[0,1],[-1,1],[-1,0]];
const EN=['N','NE','SE','S','SW','NW'];
const h2p=(q,r)=>({x:S*1.5*q,y:S*SQ3*(r+q/2)});
const hk=(q,r)=>`${q},${r}`;
const opp=e=>(e+3)%6;
const nbr=(q,r,e)=>({q:q+DIRS[e][0],r:r+DIRS[e][1]});
const mirE=e=>(6-e)%6;
const rpf=(pe,rot,mir)=>mir?(mirE(pe)+rot)%6:(pe+rot)%6;

function vtx(cx,cy,i){const a=(Math.PI/3)*i;return{x:cx+S*Math.cos(a),y:cy-S*Math.sin(a)};}
function hexPts(cx,cy){let s='';for(let i=0;i<6;i++){const v=vtx(cx,cy,i);s+=(i?',':'')+v.x.toFixed(1)+','+v.y.toFixed(1);}return s;}
const EV=[[1,2],[0,1],[5,0],[4,5],[3,4],[2,3]];
function eMid(cx,cy,e){const[a,b]=EV[e];const va=vtx(cx,cy,a),vb=vtx(cx,cy,b);return{x:(va.x+vb.x)/2,y:(va.y+vb.y)/2};}
function eNorm(e){const[a,b]=EV[e];const va=vtx(0,0,a),vb=vtx(0,0,b);const mx=(va.x+vb.x)/2,my=(va.y+vb.y)/2;const l=Math.sqrt(mx*mx+my*my);return{x:mx/l,y:my/l};}

let hexes=[];
for(let q=-RAD;q<=RAD;q++)for(let r=-RAD;r<=RAD;r++)if(Math.abs(q+r)<=RAD)hexes.push({q,r});

// ─── Tiles ───
const T={
glacial:{name:'Glacial Spring',s:'Glacial',l:'3W',cat:'src',w:3,ports:[{e:2,d:'o'}],fill:'#3A5060',str:'#4C6272',band:'#3A7CA5'},
snowmelt:{name:'Snowmelt Spring',s:'Snowmelt',l:'2W',cat:'src',w:2,ports:[{e:2,d:'o'}],fill:'#344858',str:'#465A6A',band:'#3A7CA5'},
underground:{name:'Underground Spring',s:'U.Ground',l:'1W',cat:'src',w:1,ports:[{e:2,d:'o'}],fill:'#2E4250',str:'#405462',band:'#3A7CA5'},
well:{name:'Well',s:'Well',l:'1W?',cat:'src',w:1,ports:[{e:2,d:'o'}],isWell:1,fill:'#2A3E4C',str:'#3C505E',band:'#3A7CA5'},
river:{name:'River 120',s:'River',l:'120',cat:'wire',ports:[{e:5,d:'i'},{e:2,d:'o'}],fill:'#344050',str:'#465262',band:'#8B7020'},
creek:{name:'Creek 60',s:'Creek',l:'60',cat:'wire',ports:[{e:5,d:'i'},{e:1,d:'o'}],fill:'#344050',str:'#465262',band:'#8B7020'},
bend:{name:'Bend 180',s:'Bend',l:'180',cat:'wire',ports:[{e:5,d:'i'},{e:4,d:'o'}],fill:'#344050',str:'#465262',band:'#8B7020'},
canal:{name:'Canal 120',s:'Canal',l:'C120',cat:'wire',ports:[{e:5,d:'b'},{e:2,d:'b'}],bidir:1,fill:'#3A4858',str:'#4C5A6A',band:'#8B7020'},
tributary:{name:'Tributary',s:'Split',l:'Y',cat:'wire',ports:[{e:0,d:'i'},{e:2,d:'o'},{e:4,d:'o'}],gate:'split',fill:'#384858',str:'#4A5A6A',band:'#8B7020'},
bridge:{name:'Stone Bridge',s:'Bridge',l:'X',cat:'wire',ports:[{e:5,d:'i'},{e:2,d:'o'},{e:0,d:'i2'},{e:3,d:'o2'}],gate:'cross',fill:'#4A4A48',str:'#5C5C58',band:'#8B7020'},
crevasse:{name:'Crevasse',s:'Crevasse',l:'>1',cat:'mod',clamp:1,ports:[{e:5,d:'i'},{e:2,d:'o'}],fill:'#443E38',str:'#564E48',band:'#7A6050'},
waterfall:{name:'Waterfall',s:'W.Fall',l:'>3',cat:'mod',amp:3,ports:[{e:0,d:'i'},{e:3,d:'o'}],fill:'#2E4E5A',str:'#40606C',band:'#7A6050'},
narrows:{name:'Rocky Narrows',s:'Narrows',l:'-1',cat:'mod',red:1,ports:[{e:5,d:'i'},{e:2,d:'o'}],fill:'#3E3C38',str:'#504E48',band:'#7A6050'},
rapids:{name:'White Rapids',s:'Rapids',l:'-2',cat:'mod',red:2,ports:[{e:5,d:'i'},{e:2,d:'o'}],fill:'#464440',str:'#585650',band:'#7A6050'},
dry_riverbed:{name:'Dry Riverbed',s:'AND',l:'AND',cat:'gate',gate:'and_min',ports:[{e:5,d:'i'},{e:4,d:'i'},{e:2,d:'o'}],fill:'#4A4238',str:'#5C544A',band:'#B84030'},
confluence:{name:'Confluence',s:'OR+',l:'OR+',cat:'gate',gate:'or_add',ports:[{e:5,d:'i'},{e:4,d:'i'},{e:2,d:'o'}],fill:'#344858',str:'#465A6A',band:'#B84030'},
dammed:{name:'Dammed Spring',s:'NOT',l:'NOT',cat:'gate',gate:'not',notPow:2,ports:[{e:5,d:'i'},{e:2,d:'o'}],fill:'#443C34',str:'#564E46',band:'#B84030'},
karst:{name:'Karst Cave',s:'NAND',l:'NAND',cat:'gate',gate:'nand',notPow:2,ports:[{e:5,d:'i'},{e:4,d:'i'},{e:2,d:'o'}],fill:'#3A3830',str:'#4C4A42',band:'#B84030'},
artesian:{name:'Artesian Well',s:'NOR',l:'NOR',cat:'gate',gate:'nor',notPow:2,ports:[{e:5,d:'i'},{e:4,d:'i'},{e:2,d:'o'}],fill:'#2E3840',str:'#404A52',band:'#B84030'},
seesaw:{name:'Seesaw Falls',s:'XOR',l:'XOR',cat:'gate',gate:'xor',ports:[{e:5,d:'i'},{e:4,d:'i'},{e:2,d:'o'}],fill:'#3A4040',str:'#4C5252',band:'#B84030'},
delta:{name:'River Delta',s:'Delta',l:'DLT',cat:'gate',gate:'delta',ports:[{e:0,d:'i'},{e:1,d:'o'},{e:2,d:'o'},{e:3,d:'o'},{e:4,d:'o'},{e:5,d:'o'}],fill:'#3A4A44',str:'#4C5C56',band:'#B84030'},
sinkhole:{name:'Sinkhole',s:'Sink',l:'SNK',cat:'util',ports:[{e:0,d:'i'}],fill:'#282828',str:'#3A3A3A',band:'#606068'},
beaver:{name:'Beaver Dam',s:'MUX',l:'MUX',cat:'util',gate:'mux',ports:[{e:0,d:'i'},{e:2,d:'o'},{e:4,d:'o'}],fill:'#4A4030',str:'#5C5242',band:'#606068'},
barren:{name:'Barren',s:'Barren',l:'..',cat:'ter',ports:[],fill:'#2E2E2C',str:'#404040',band:'#5A7A4A'},
scrubland:{name:'Scrubland',s:'Scrub',l:',,',cat:'ter',ports:[],fill:'#3A4230',str:'#4C5442',band:'#5A7A4A'},
grassland:{name:'Grassland',s:'Grass',l:'///',cat:'ter',ports:[],fill:'#304A22',str:'#425C34',band:'#5A7A4A'},
forest:{name:'Forest',s:'Forest',l:'TTT',cat:'ter',ports:[],fill:'#243E1C',str:'#36502E',band:'#5A7A4A'},
oldgrowth:{name:'Old Growth',s:'Ancient',l:'OOO',cat:'ter',ports:[],fill:'#1C3218',str:'#2E442A',band:'#5A7A4A'},
wetland:{name:'Wetland',s:'Wetland',l:'~~~',cat:'ter',ports:[],fill:'#2A3A30',str:'#3C4C42',band:'#5A7A4A'},
pond:{name:'Pond',s:'Pond',l:'o',cat:'ter',ports:[],fill:'#283848',str:'#3A4A5A',band:'#5A7A4A'},
lake:{name:'Lake',s:'Lake',l:'O',cat:'ter',ports:[],fill:'#1E3050',str:'#304262',band:'#5A7A4A'},
};

const CATS=[
{id:'src',label:'Source',c:'#3A7CA5',t:['glacial','snowmelt','underground','well']},
{id:'wire',label:'Wire',c:'#8B7020',t:['river','creek','bend','canal','tributary','bridge']},
{id:'mod',label:'Mod',c:'#7A6050',t:['crevasse','narrows','rapids','waterfall']},
{id:'gate',label:'Gate',c:'#B84030',t:['dry_riverbed','confluence','dammed','karst','artesian','seesaw','delta']},
{id:'util',label:'Util',c:'#606068',t:['sinkhole','beaver']},
{id:'ter',label:'Land',c:'#5A7A4A',t:['barren','scrubland','grassland','forest','oldgrowth','wetland','pond','lake']},
];

// ─── State ───
let board={},fl={},adjInfo={};
let sel=null,bSel=null,rmMode=false;
let wells={},muxCfg={};
let activeCat='src',turn=0;
let res={seed:0,wood:0,wisdom:0,reed:0};
let logMsg=[];

// ─── Flow Resolution ───
function resolveFlow(){
  fl={};const vis=new Set();
  function gf(k){if(!fl[k])fl[k]={edges:{},draws:[],_gi:{},_notIn:false,_anyIn:false};return fl[k];}
  function tp(tile,pe){return rpf(pe,tile.rot,tile.mir);}

  function trace(q,r,outE,tok){
    if(tok<=0)return;
    const k=hk(q,r),vk=k+':'+outE;
    if(vis.has(vk))return;vis.add(vk);
    const f=gf(k);f.edges[outE]=Math.max(f.edges[outE]||0,tok);
    const n=nbr(q,r,outE),nk=hk(n.q,n.r),nt=board[nk];
    if(!nt)return;
    const nd=T[nt.type],ie=opp(outE),nf=gf(nk);
    nf.edges[ie]=Math.max(nf.edges[ie]||0,tok);
    if(nd.cat==='ter')return;

    if(nd.cat==='util'&&!nd.gate){const ai=tp(nt,nd.ports.find(p=>p.d==='i').e);if(ai===ie)nf.draws.push({f:ie,t:-1,v:tok});return;}
    if(nd.gate==='not'){if(tp(nt,nd.ports.find(p=>p.d==='i').e)===ie)nf._notIn=true;return;}
    if(nd.gate==='nand'){const ins=nd.ports.filter(p=>p.d==='i').map(p=>tp(nt,p.e));if(!ins.includes(ie))return;nf._gi[ie]=tok;nf._anyIn=true;if(ins.every(i2=>nf._gi[i2]>0))nf._notIn=true;return;}
    if(nd.gate==='nor'){const ins=nd.ports.filter(p=>p.d==='i').map(p=>tp(nt,p.e));if(!ins.includes(ie))return;nf._anyIn=true;return;}
    if(nd.gate==='xor'){
      const ins=nd.ports.filter(p=>p.d==='i').map(p=>tp(nt,p.e));
      const ao=tp(nt,nd.ports.find(p=>p.d==='o').e);
      if(!ins.includes(ie))return;nf._gi[ie]=tok;
      const pr=ins.filter(i2=>nf._gi[i2]>0);
      nf.draws=nf.draws.filter(d=>d.t!==ao);
      if(pr.length===1){const val=nf._gi[pr[0]];nf.draws.push({f:pr[0],t:ao,v:val});vis.delete(nk+':'+ao);trace(n.q,n.r,ao,val);}
      return;
    }
    if(nd.gate==='and_min'){
      const ins=nd.ports.filter(p=>p.d==='i').map(p=>tp(nt,p.e));
      const ao=tp(nt,nd.ports.find(p=>p.d==='o').e);
      if(!ins.includes(ie))return;nf._gi[ie]=tok;
      if(ins.every(i2=>nf._gi[i2]>0)){const mv=Math.min(...ins.map(i2=>nf._gi[i2]));nf.draws=nf.draws.filter(d=>d.t!==ao);ins.forEach(i2=>nf.draws.push({f:i2,t:ao,v:mv}));trace(n.q,n.r,ao,mv);}
      return;
    }
    if(nd.gate==='or_add'){
      const ins=nd.ports.filter(p=>p.d==='i').map(p=>tp(nt,p.e));
      const ao=tp(nt,nd.ports.find(p=>p.d==='o').e);
      if(!ins.includes(ie))return;nf._gi[ie]=tok;
      const sum=Math.min(3,Object.values(nf._gi).reduce((a,b)=>a+b,0));
      nf.draws=nf.draws.filter(d=>d.t!==ao);
      Object.keys(nf._gi).forEach(i2=>nf.draws.push({f:parseInt(i2),t:ao,v:sum}));
      vis.delete(nk+':'+ao);trace(n.q,n.r,ao,sum);return;
    }
    if(nd.gate==='delta'){
      const ai=tp(nt,nd.ports.find(p=>p.d==='i').e);
      if(ai!==ie||tok<1)return;
      nd.ports.filter(p=>p.d==='o').forEach(op=>{const ao=tp(nt,op.e);nf.draws.push({f:ie,t:ao,v:1});nf.edges[ao]=Math.max(nf.edges[ao]||0,1);trace(n.q,n.r,ao,1);});
      return;
    }
    if(nd.gate==='split'){
      const ai=tp(nt,nd.ports.find(p=>p.d==='i').e);if(ai!==ie)return;
      const outs=nd.ports.filter(p=>p.d==='o').map(p=>tp(nt,p.e));
      const hi=Math.ceil(tok/2),lo=Math.floor(tok/2);
      if(outs[0]!==undefined&&hi>0){nf.draws.push({f:ie,t:outs[0],v:hi});nf.edges[outs[0]]=Math.max(nf.edges[outs[0]]||0,hi);trace(n.q,n.r,outs[0],hi);}
      if(outs[1]!==undefined&&lo>0){nf.draws.push({f:ie,t:outs[1],v:lo});nf.edges[outs[1]]=Math.max(nf.edges[outs[1]]||0,lo);trace(n.q,n.r,outs[1],lo);}
      return;
    }
    if(nd.gate==='cross'){
      const pAi=tp(nt,5),pAo=tp(nt,2),pBi=tp(nt,0),pBo=tp(nt,3);
      if(ie===pAi){nf.draws.push({f:ie,t:pAo,v:tok});trace(n.q,n.r,pAo,tok);}
      else if(ie===pBi){nf.draws.push({f:ie,t:pBo,v:tok});trace(n.q,n.r,pBo,tok);}
      return;
    }
    if(nd.gate==='mux'){
      const ai=tp(nt,nd.ports.find(p=>p.d==='i').e);if(ai!==ie)return;
      const outs=nd.ports.filter(p=>p.d==='o').map(p=>tp(nt,p.e));
      const cfg=muxCfg[nk]||0;
      if(cfg===0||cfg===2){if(outs[0]!==undefined){const v=cfg===2?Math.ceil(tok/2):tok;nf.draws.push({f:ie,t:outs[0],v});trace(n.q,n.r,outs[0],v);}}
      if(cfg===1||cfg===2){if(outs[1]!==undefined){const v=cfg===2?Math.floor(tok/2):tok;nf.draws.push({f:ie,t:outs[1],v});trace(n.q,n.r,outs[1],v);}}
      return;
    }
    if(nd.bidir){
      const acts=nd.ports.filter(p=>p.d==='b').map(p=>tp(nt,p.e));
      if(!acts.includes(ie))return;const ao=acts.find(a=>a!==ie);
      if(ao===undefined)return;nf.draws.push({f:ie,t:ao,v:tok});trace(n.q,n.r,ao,tok);return;
    }
    for(const port of nd.ports){
      if(port.d==='i'){const ai=tp(nt,port.e);if(ai===ie){
        const op=nd.ports.find(p=>p.d==='o');if(!op)return;
        let out=tok;
        if(nd.clamp!==undefined)out=Math.min(out,nd.clamp);
        if(nd.amp!==undefined&&tok>=1)out=nd.amp;
        if(nd.red!==undefined)out=Math.max(0,out-nd.red);
        if(out<=0)return;
        const ao=tp(nt,op.e);nf.draws.push({f:ie,t:ao,v:out});trace(n.q,n.r,ao,out);
      }}
    }
  }

  for(const[k,tile]of Object.entries(board)){
    const d=T[tile.type];if(d.cat!=='src')continue;
    if(d.isWell&&!wells[k])continue;
    const[q,r]=k.split(',').map(Number);
    const ao=tp(tile,d.ports.find(p=>p.d==='o').e);
    const f=gf(k);f.draws.push({f:-1,t:ao,v:d.w});trace(q,r,ao,d.w);
  }
  for(const[k,tile]of Object.entries(board)){
    const d=T[tile.type],nf=gf(k);const[q,r]=k.split(',').map(Number);
    if(d.gate==='not'&&!nf._notIn){const ao=tp(tile,d.ports.find(p=>p.d==='o').e);nf.draws.push({f:-1,t:ao,v:d.notPow});trace(q,r,ao,d.notPow);}
    if(d.gate==='nand'&&!nf._notIn){const ao=tp(tile,d.ports.find(p=>p.d==='o').e);nf.draws.push({f:-1,t:ao,v:d.notPow});trace(q,r,ao,d.notPow);}
    if(d.gate==='nor'&&!nf._anyIn){const ao=tp(tile,d.ports.find(p=>p.d==='o').e);nf.draws.push({f:-1,t:ao,v:d.notPow});trace(q,r,ao,d.notPow);}
  }
}

function calcAdj(){
  adjInfo={};
  for(const[k,tile]of Object.entries(board)){
    if(T[tile.type].cat!=='ter')continue;
    const[q,r]=k.split(',').map(Number);
    let flowCount=0,maxAdjFlow=0,direct=0;
    for(let e=0;e<6;e++){
      const n=nbr(q,r,e),nk=hk(n.q,n.r),nf=fl[nk];
      if(!nf)continue;
      // Check if neighbor has active flow (non-sink draws)
      const hasFlow=nf.draws.some(d=>d.v>0&&d.t>=0);
      if(hasFlow){
        flowCount++;
        // Max flow volume passing through this neighbor
        for(const d of nf.draws) if(d.v>0&&d.t>=0) maxAdjFlow=Math.max(maxAdjFlow,d.v);
      }
      // Direct input: flow aimed at this terrain tile
      for(const d of nf.draws){if(d.t===opp(e)&&d.v>0)direct=Math.max(direct,d.v);}
    }
    adjInfo[k]={flowCount,maxAdjFlow,direct};
  }
}

function growTerrain(){
  const ch={};
  for(const[k,info]of Object.entries(adjInfo)){
    const tile=board[k];if(!tile)continue;
    const ty=tile.type,{flowCount,maxAdjFlow,direct}=info;

    // Direct input = flooding (highest priority)
    if(direct>0){
      if(['barren','scrubland','grassland','forest','oldgrowth'].includes(ty)){
        ch[k]=direct>=3?'lake':direct>=2?'pond':'wetland';
      }
      continue;
    }

    // Adjacent flow >= 2 volume on any single tile = wetland conversion
    if(maxAdjFlow>=2&&['barren','scrubland','grassland'].includes(ty)){
      ch[k]='wetland';
      continue;
    }

    // Normal adjacency growth (flow present but gentle)
    if(flowCount>0){
      if(ty==='barren')ch[k]='scrubland';
      else if(ty==='scrubland')ch[k]='grassland';
      else if(ty==='grassland')ch[k]='forest';
      else if(ty==='forest')ch[k]='oldgrowth';
    } else {
      // Degradation
      if(ty==='oldgrowth')ch[k]='forest';
      else if(ty==='forest')ch[k]='grassland';
    }
  }
  return ch;
}

function harvest(){
  let s=0,w=0,wi=0,rd=0;
  for(const tile of Object.values(board)){
    const t=tile.type;
    if(t==='scrubland')s+=1;else if(t==='grassland')s+=2;
    else if(t==='forest')w+=1;else if(t==='oldgrowth'){w+=2;wi+=1;}
    else if(t==='wetland'||t==='pond'||t==='lake')rd+=1;
  }
  return{seed:s,wood:w,wisdom:wi,reed:rd};
}

// ─── SVG Rendering ───
const pad=S*2.5;
const allPx=hexes.map(h=>h2p(h.q,h.r));
const x0=Math.min(...allPx.map(p=>p.x))-pad;
const x1=Math.max(...allPx.map(p=>p.x))+pad;
const y0=Math.min(...allPx.map(p=>p.y))-pad;
const y1=Math.max(...allPx.map(p=>p.y))+pad;
const vW=x1-x0,vH=y1-y0;

function wCol(n){return n>=3?'#2090FF':n>=2?'#50AAFF':'#80CCFF';}
function wWid(n){return n>=3?5:n>=2?3.5:2;}

function render(){
  const gridEl=document.getElementById('grid');
  let svg=`<svg viewBox="${x0} ${y0} ${vW} ${vH}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%">`;
  svg+=`<defs><filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;

  for(const{q,r}of hexes){
    const p=h2p(q,r),k=hk(q,r),tile=board[k],d=tile?T[tile.type]:null;
    const hf=fl[k],a=adjInfo[k],isSel=bSel===k;

    // Hex background
    let sc=d?d.str:'#222530',sw=d?1:0.5;
    if(isSel){sc='#D0A840';sw=2.5;}
    else if(rmMode&&d){sc='#802020';sw=1.5;}
    else if(a?.direct>0){sc='#2870A0';sw=1.5;}
    else if(a?.flowCount>0){sc='#307828';sw=1.5;}

    svg+=`<polygon points="${hexPts(p.x,p.y)}" fill="${d?d.fill:'#181A1E'}" stroke="${sc}" stroke-width="${sw}" opacity="${d?1:0.45}"/>`;

    // Color band (N edge)
    if(d){
      const va=vtx(p.x,p.y,1),vb=vtx(p.x,p.y,2);
      svg+=`<line x1="${va.x}" y1="${va.y}" x2="${vb.x}" y2="${vb.y}" stroke="${d.band}" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>`;
    }

    // Mirror indicator
    if(d&&tile.mir){
      const va=vtx(p.x,p.y,4),vb=vtx(p.x,p.y,5);
      svg+=`<line x1="${va.x}" y1="${va.y}" x2="${vb.x}" y2="${vb.y}" stroke="#606880" stroke-width="1.5" stroke-linecap="round" opacity="0.5" stroke-dasharray="2 2"/>`;
    }

    // Port arrows
    if(d){
      for(const port of d.ports){
        const ae=rpf(port.e,tile.rot,tile.mir);
        const dir=port.d==='i2'?'i':port.d==='o2'?'o':port.d;
        svg+=drawArrow(p.x,p.y,ae,dir);
      }
      for(const port of d.ports){
        if(port.d==='b'){
          const ae=rpf(port.e,tile.rot,tile.mir);
          svg+=drawArrow(p.x,p.y,ae,'i');
        }
      }
    }

    // Labels
    if(d){
      const fs=d.cat==='ter'?11:10;
      svg+=`<text x="${p.x}" y="${p.y-2}" text-anchor="middle" style="font-size:${fs}px;font-weight:700;fill:#C0D0E0;pointer-events:none;font-family:monospace">${d.l}</text>`;
      svg+=`<text x="${p.x}" y="${p.y+10}" text-anchor="middle" style="font-size:6px;font-weight:600;fill:#5A6A80;pointer-events:none;letter-spacing:0.3px">${d.s}</text>`;
    } else {
      const nm=eMid(p.x,p.y,0);
      svg+=`<text x="${nm.x}" y="${nm.y+3}" text-anchor="middle" style="font-size:4.5px;fill:#282C38;pointer-events:none;font-weight:700">N</text>`;
    }

    // Water flow lines
    if(hf){
      for(const dd of hf.draws){
        if(dd.v>0&&dd.t>=0){
          const pt=eMid(p.x,p.y,dd.t);
          const pf=dd.f<0?{x:p.x,y:p.y}:eMid(p.x,p.y,dd.f);
          const mx=(pf.x+pt.x)/2+(p.y-(pf.y+pt.y)/2)*0.15;
          const my=(pf.y+pt.y)/2+((pf.x+pt.x)/2-p.x)*0.15;
          svg+=`<path d="M${pf.x},${pf.y} Q${mx},${my} ${pt.x},${pt.y}" fill="none" stroke="${wCol(dd.v)}" stroke-width="${wWid(dd.v)}" stroke-linecap="round" opacity="0.8" filter="url(#gl)"/>`;
        }
      }
      for(const[edge,tk]of Object.entries(hf.edges)){
        if(tk<=0)continue;
        const m=eMid(p.x,p.y,parseInt(edge));
        svg+=`<circle cx="${m.x}" cy="${m.y}" r="${3.5+tk*1.2}" fill="${wCol(tk)}" opacity="0.2" filter="url(#gl)"/>`;
        svg+=`<circle cx="${m.x}" cy="${m.y}" r="${2+tk*0.6}" fill="${wCol(tk)}" opacity="0.6"/>`;
        svg+=`<text x="${m.x}" y="${m.y+2.5}" text-anchor="middle" style="font-size:6px;font-weight:800;fill:#fff;pointer-events:none">${tk}</text>`;
      }
    }

    // Adjacency indicators
    if(a?.flowCount>0&&!a?.direct){
      svg+=`<circle cx="${p.x-S*0.5}" cy="${p.y-S*0.4}" r="3" fill="#307828" opacity="0.7"/>`;
    }
    if(a?.direct>0){
      svg+=`<circle cx="${p.x-S*0.5}" cy="${p.y-S*0.4}" r="4" fill="#2870A0" opacity="0.7"/>`;
      svg+=`<text x="${p.x-S*0.5}" y="${p.y-S*0.4+2.2}" text-anchor="middle" style="font-size:5px;fill:#fff;font-weight:700;pointer-events:none">${a.direct}</text>`;
    }

    if(!d) svg+=`<circle cx="${p.x}" cy="${p.y}" r="1.2" fill="${sel?'#2A3040':'#1E2028'}"/>`;
  }
  svg+=`</svg>`;
  gridEl.innerHTML=svg;
}

function drawArrow(cx,cy,edge,dir){
  const m=eMid(cx,cy,edge),n=eNorm(edge);
  const isOut=dir==='o'||dir==='b';
  const col=dir==='o'?'#90C0E0':dir==='b'?'#D0C060':'#5080A0';
  if(isOut){
    const tx=m.x+n.x*9,ty=m.y+n.y*9,bx=m.x-n.x*2,by=m.y-n.y*2;
    const px=-n.y,py=n.x;
    return `<line x1="${bx}" y1="${by}" x2="${tx}" y2="${ty}" stroke="${col}" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>` +
      `<polygon points="${tx},${ty} ${tx-n.x*4.5+px*2.8},${ty-n.y*4.5+py*2.8} ${tx-n.x*4.5-px*2.8},${ty-n.y*4.5-py*2.8}" fill="${col}" opacity="0.85"/>`;
  }
  return `<circle cx="${m.x-n.x*3}" cy="${m.y-n.y*3}" r="2.5" fill="none" stroke="${col}" stroke-width="1.5" opacity="0.7"/>`;
}

// ─── UI Updates ───
function updateCtx(){
  const el=document.getElementById('ctx');
  if(bSel&&board[bSel]){
    const sd=T[board[bSel].type],tile=board[bSel];
    const sp=sd.ports.map(p=>{
      const ae=rpf(p.e,tile.rot,tile.mir);
      const dir=p.d==='i'||p.d==='i2'?'in':p.d==='o'||p.d==='o2'?'out':'bi';
      return dir+':'+EN[ae];
    }).join(' ');

    let h=`<span class="name">${sd.s}${tile.mir?' [M]':''}</span>`;
    h+=`<span class="ports">${sp}</span>`;
    h+=`<button class="cbtn" onclick="doRot('ccw')">↶</button>`;
    h+=`<button class="cbtn" onclick="doRot('cw')">↷</button>`;
    h+=`<button class="cbtn" style="${tile.mir?'background:#2A3848;color:#80D0F0':'color:#6080A0'}" onclick="doMir()">⇔</button>`;
    if(sd.isWell) h+=`<button class="btn" style="background:${wells[bSel]?'#1A4A30':'#3A2020'};color:${wells[bSel]?'#70D0A0':'#D08080'};font-size:9px" onclick="toggleWell()">${wells[bSel]?'ON':'OFF'}</button>`;
    if(sd.gate==='mux') h+=`<button class="btn" style="background:#3A3020;color:#D0B060;font-size:9px" onclick="cycleMux()">${['Out1','Out2','Both'][muxCfg[bSel]||0]}</button>`;
    h+=`<button class="btn" style="background:#252830;color:#5A6878;font-size:9px" onclick="setBSel(null)">OK</button>`;
    el.innerHTML=h;
  } else if(logMsg.length>0&&turn>0){
    el.innerHTML=`<span style="color:#6A8A70;font-size:9px">${logMsg.join(' | ')}</span>`;
  } else if(rmMode){
    el.innerHTML=`<span style="color:#D08080">Tap tile to remove</span>`;
  } else if(sel){
    el.innerHTML=`<span>Place: <b style="color:#8AB0D0">${T[sel].s}</b></span>`;
  } else {
    el.innerHTML=`<span>Select tile, tap grid. Tap placed tile to edit.</span>`;
  }
}

function updateRes(){
  document.getElementById('resDisp').innerHTML=`<span>${res.seed}sd</span><span>${res.wood}wd</span><span>${res.wisdom}wi</span><span>${res.reed}rd</span>`;
  document.getElementById('turnN').textContent='T'+turn;
}

function buildPalette(){
  const tabsEl=document.getElementById('tabs');
  tabsEl.innerHTML='';
  for(const c of CATS){
    const b=document.createElement('button');
    b.textContent=c.label;
    b.style.color=activeCat===c.id?c.c:'#303848';
    b.style.borderBottomColor=activeCat===c.id?c.c:'transparent';
    if(activeCat===c.id)b.classList.add('active');
    b.onclick=()=>{activeCat=c.id;setBSel(null);buildPalette();};
    tabsEl.appendChild(b);
  }

  const tilesEl=document.getElementById('tiles');
  tilesEl.innerHTML='';
  const cat=CATS.find(c=>c.id===activeCat);
  if(!cat)return;
  for(const id of cat.t){
    const t=T[id],isSel=sel===id&&!rmMode;
    const b=document.createElement('button');
    if(isSel){b.classList.add('sel');b.style.setProperty('--tf',t.fill);b.style.setProperty('--tb',t.band);}
    b.innerHTML=`<span class="tl">${t.l}</span><span class="ts">${t.s}</span>`;
    b.onclick=()=>{sel=id;rmMode=false;setBSel(null);buildPalette();updateCtx();
      document.getElementById('delBtn').style.background='#252830';
      document.getElementById('delBtn').style.color='#5A6878';};
    tilesEl.appendChild(b);
  }
}

// ─── Input ───
function s2h(cx,cy){
  const svg=document.querySelector('#grid svg');
  if(!svg)return null;
  const r=svg.getBoundingClientRect();
  const sx=x0+((cx-r.left)/r.width)*vW;
  const sy=y0+((cy-r.top)/r.height)*vH;
  let best=null,bd=S*0.88;
  for(const h of hexes){const p=h2p(h.q,h.r);const d=Math.sqrt((p.x-sx)**2+(p.y-sy)**2);if(d<bd){best=h;bd=d;}}
  return best;
}

function handleTap(cx,cy){
  const h=s2h(cx,cy);
  if(!h)return;
  const k=hk(h.q,h.r);
  if(rmMode){
    delete board[k];setBSel(null);fl={};adjInfo={};render();updateCtx();return;
  }
  if(board[k]){
    setBSel(bSel===k?null:k);sel=null;buildPalette();
  } else if(sel){
    board[k]={type:sel,rot:0,mir:false};setBSel(null);fl={};adjInfo={};
  }
  render();updateCtx();
}

function setBSel(v){bSel=v;render();updateCtx();}

window.doRot=function(dir){
  if(!bSel||!board[bSel])return;
  board[bSel].rot=(board[bSel].rot+(dir==='cw'?1:5))%6;
  fl={};adjInfo={};render();updateCtx();
};
window.doMir=function(){
  if(!bSel||!board[bSel])return;
  board[bSel].mir=!board[bSel].mir;
  fl={};adjInfo={};render();updateCtx();
};
window.toggleWell=function(){
  if(!bSel)return;wells[bSel]=!wells[bSel];updateCtx();
};
window.cycleMux=function(){
  if(!bSel)return;muxCfg[bSel]=((muxCfg[bSel]||0)+1)%3;updateCtx();
};
window.setBSel=setBSel;

// Touch handling
let tStart={x:0,y:0,moved:false};
document.getElementById('grid').addEventListener('touchstart',e=>{
  if(e.touches.length===1){tStart={x:e.touches[0].clientX,y:e.touches[0].clientY,moved:false};}
},{passive:true});
document.getElementById('grid').addEventListener('touchmove',e=>{
  if(e.touches.length===1){
    const dx=e.touches[0].clientX-tStart.x,dy=e.touches[0].clientY-tStart.y;
    if(Math.abs(dx)>10||Math.abs(dy)>10)tStart.moved=true;
  }
},{passive:true});
document.getElementById('grid').addEventListener('touchend',e=>{
  if(!tStart.moved&&e.changedTouches.length===1){
    handleTap(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
  }
});
document.getElementById('grid').addEventListener('click',e=>{
  if(e.sourceCapabilities&&e.sourceCapabilities.firesTouchEvents)return;
  handleTap(e.clientX,e.clientY);
});

// Buttons
document.getElementById('delBtn').onclick=()=>{
  rmMode=!rmMode;sel=null;setBSel(null);
  document.getElementById('delBtn').style.background=rmMode?'#6A2020':'#252830';
  document.getElementById('delBtn').style.color=rmMode?'#FF9090':'#5A6878';
  buildPalette();updateCtx();
};

document.getElementById('flowBtn').onclick=()=>{
  resolveFlow();calcAdj();render();
};

document.getElementById('turnBtn').onclick=()=>{
  resolveFlow();calcAdj();
  const ch=growTerrain();
  const msgs=[];
  if(Object.keys(ch).length>0){
    for(const[k,nt]of Object.entries(ch)){
      msgs.push(T[board[k].type].s+'>'+T[nt].s);
      board[k]={...board[k],type:nt};
    }
    resolveFlow();calcAdj();
  }
  const h=harvest();
  res.seed+=h.seed;res.wood+=h.wood;res.wisdom+=h.wisdom;res.reed+=h.reed;
  const pts=[];
  if(h.seed)pts.push('+'+h.seed+'sd');if(h.wood)pts.push('+'+h.wood+'wd');
  if(h.wisdom)pts.push('+'+h.wisdom+'wi');if(h.reed)pts.push('+'+h.reed+'rd');
  if(pts.length)msgs.push(pts.join(' '));
  turn++;logMsg=msgs.length>0?msgs:['--'];
  updateRes();render();updateCtx();
};

// Init
buildPalette();render();updateRes();updateCtx();
</script>
</body>
</html>
