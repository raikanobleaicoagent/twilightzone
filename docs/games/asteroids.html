<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile Asteroid Shooter</title>
    <style>
        /* Basic reset to make the game fullscreen */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents scrolling */
            background-color: #000;
        }
        /* Canvas will be our game window */
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas to full window size
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- Game State Variables ---
        let player, bullets, asteroids, score, gameOver;
        let bulletCooldown, asteroidSpawnTimer;

        // --- Player Object ---
        // We define the player as a simple object.
        const playerWidth = 50;
        const playerHeight = 50;
        const playerColor = '#0F0'; // Green triangle

        // --- Game Initialization ---
        function init() {
            player = {
                x: canvas.width / 2,
                y: canvas.height - 70, // Fixed y-position at the bottom
                width: playerWidth,
                height: playerHeight,
                speed: 8 // This isn't used for movement, but could be
            };
            bullets = [];
            asteroids = [];
            score = 0;
            gameOver = false;
            bulletCooldown = 0;
            asteroidSpawnTimer = 0; // Spawn first asteroid immediately
        }

        // --- Input Handlers (Mobile First) ---

        // This function handles both mouse movement for desktop testing
        // and touch movement for mobile.
        function movePlayer(clientX) {
            if (gameOver) return; // Don't move if game is over
            
            // Move player's center to the finger/mouse position
            player.x = clientX;

            // Clamp player position to screen edges
            if (player.x < player.width / 2) {
                player.x = player.width / 2;
            }
            if (player.x > canvas.width - player.width / 2) {
                player.x = canvas.width - player.width / 2;
            }
        }

        // Touch Events
        canvas.addEventListener('touchstart', (e) => {
            // Prevent screen from scrolling
            e.preventDefault();
            if (gameOver) {
                init(); // Restart game on tap
                gameLoop(); // Re-trigger the loop
            } else {
                movePlayer(e.touches[0].clientX);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            movePlayer(e.touches[0].clientX);
        }, { passive: false });

        // Mouse events (for desktop fallback)
        canvas.addEventListener('mousedown', (e) => {
            if (gameOver) {
                init();
                gameLoop();
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            movePlayer(e.clientX);
        });

        // --- Game Object Creation ---

        function createBullet() {
            bullets.push({
                x: player.x,
                y: player.y,
                width: 5,
                height: 15,
                speed: 10,
                color: '#FFF' // White
            });
            bulletCooldown = 15; // Cooldown (frames) between shots
        }

        function createAsteroid() {
            const size = Math.random() * 30 + 20; // Random size (20 to 50)
            asteroids.push({
                x: Math.random() * canvas.width, // Random x position
                y: -size, // Start just above the screen
                radius: size,
                speed: Math.random() * 2 + 1, // Random speed (1 to 3)
                color: '#AAA' // Grey
            });
            
            // Spawn next asteroid faster as score increases
            const spawnRate = Math.max(20, 100 - score / 10);
            asteroidSpawnTimer = spawnRate;
        }

        // --- Update Function (Runs every frame) ---
        function update() {
            if (gameOver) return;

            // -- Auto-shoot --
            bulletCooldown--;
            if (bulletCooldown <= 0) {
                createBullet();
            }

            // -- Update Bullets --
            // Loop backwards for safe removal
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.y -= b.speed;
                // Remove if off-screen
                if (b.y < 0) {
                    bullets.splice(i, 1);
                }
            }

            // -- Update Asteroids --
            asteroidSpawnTimer--;
            if (asteroidSpawnTimer <= 0) {
                createAsteroid();
            }

            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                a.y += a.speed;
                // Remove if off-screen
                if (a.y - a.radius > canvas.height) {
                    asteroids.splice(i, 1);
                }
            }

            // -- Check Collisions --
            checkCollisions();
        }

        // --- Collision Detection ---
        function checkCollisions() {
            // Player vs. Asteroid
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                
                // Simple AABB (Axis-Aligned Bounding Box) for player
                // and Circle (asteroid) collision.
                // Find closest point on player rect to asteroid center
                const closestX = Math.max(player.x - player.width / 2, Math.min(a.x, player.x + player.width / 2));
                const closestY = Math.max(player.y - player.height / 2, Math.min(a.y, player.y + player.height / 2));
                
                // Get distance from closest point to asteroid center
                const dist = Math.hypot(closestX - a.x, closestY - a.y);
                
                if (dist < a.radius) {
                    // Collision!
                    gameOver = true;
                    return; // Stop checking
                }
            }

            // Bullet vs. Asteroid
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const b = bullets[i];
                    const a = asteroids[j];

                    // Simple AABB vs Circle
                    const closestX = Math.max(b.x - b.width / 2, Math.min(a.x, b.x + b.width / 2));
                    const closestY = Math.max(b.y - b.height / 2, Math.min(a.y, b.y + b.height / 2));
                    const dist = Math.hypot(closestX - a.x, closestY - a.y);

                    if (dist < a.radius) {
                        // Hit!
                        asteroids.splice(j, 1); // Remove asteroid
                        bullets.splice(i, 1);   // Remove bullet
                        score += 10;
                        
                        // Break inner loop since bullet is gone
                        break; 
                    }
                }
            }
        }

        // --- Draw Function (Runs every frame) ---
        function draw() {
            // Clear the screen with a black background
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameOver) {
                drawGameOver();
            } else {
                // -- Draw Player (as a triangle) --
                ctx.fillStyle = playerColor;
                ctx.beginPath();
                ctx.moveTo(player.x, player.y - player.height / 2); // Top point
                ctx.lineTo(player.x - player.width / 2, player.y + player.height / 2); // Bottom left
                ctx.lineTo(player.x + player.width / 2, player.y + player.height / 2); // Bottom right
                ctx.closePath();
                ctx.fill();

                // -- Draw Bullets --
                bullets.forEach(b => {
                    ctx.fillStyle = b.color;
                    ctx.fillRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height);
                });

                // -- Draw Asteroids (as circles) --
                asteroids.forEach(a => {
                    ctx.strokeStyle = a.color;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(a.x, a.y, a.radius, 0, Math.PI * 2);
                    ctx.stroke();
                });

                // -- Draw Score --
                ctx.fillStyle = '#FFF';
                ctx.font = '24px Arial';
                ctx.textAlign = 'left';
                ctx.fillText(`Score: ${score}`, 10, 30);
            }
        }
        
        // --- Game Over Screen ---
        function drawGameOver() {
            // Dim the background
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#F00';
            ctx.font = '48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);

            ctx.fillStyle = '#FFF';
            ctx.font = '24px Arial';
            ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2);
            
            ctx.font = '20px Arial';
            ctx.fillText('Tap to Restart', canvas.width / 2, canvas.height / 2 + 40);
        }

        // --- Game Loop ---
        function gameLoop() {
            update();
            draw();
            
            // Continue the loop only if game is not over
            if (!gameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        // --- Start the Game ---
        // We wrap the start in `window.onload` to ensure all
        // page elements are loaded, though it's not strictly
        // necessary since the script is at the end of <body>.
        window.onload = () => {
            init();
            gameLoop();
        };

        // Handle window resizing (e.g., phone orientation change)
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Re-center player on resize
            player.y = canvas.height - 70;
            if (player.x > canvas.width - player.width / 2) {
                player.x = canvas.width - player.width / 2;
            }
        });

    </script>
</body>
</html>
