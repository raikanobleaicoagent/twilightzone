<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Z-OS | GRANULAR PROTOCOL (v5.24)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@600;700&display=swap');
        
        :root {
            --bg-color: #000000;
            --panel-color: #0a0a0a;
            --border-color: #1f1f1f;
            --accent-color: #00ff9d;
            --text-color: #c0c0c0;
            --danger-color: #ff0055;
            --warn-color: #ffbb00;
            --process-color: #00aaff;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Tree Structure */
        .tree-line {
            border-left: 1px solid #333;
            padding-left: 6px; 
            margin-left: 3px;
        }
        
        /* Inputs */
        textarea.edit-input {
            background: #111;
            color: var(--accent-color);
            border: 1px solid #333;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            padding: 4px 6px;
            width: 100%;
            min-height: 40px; 
            resize: vertical; 
            border-radius: 2px;
            white-space: pre-wrap;
            overflow: auto;
        }
        textarea.edit-input:focus { outline: none; border-color: var(--accent-color); }

        /* Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            height: 18px;
            cursor: pointer;
            width: 100%; 
        }
        input[type=range]:focus { outline: none; }
        
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #333;
            border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 12px;
            width: 12px;
            border-radius: 0; 
            background: var(--accent-color);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -4px; 
            box-shadow: 0 0 5px var(--accent-color);
        }
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #333;
        }
        input[type=range]::-moz-range-thumb {
            height: 12px;
            width: 12px;
            border: none;
            border-radius: 0;
            background: var(--accent-color);
            cursor: pointer;
        }

        /* Priority Badges */
        .badge { font-size: 10px; font-weight: bold; padding: 1px 4px; border-radius: 2px; letter-spacing: 0.5px; }
        .badge-critical { background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid rgba(255, 0, 85, 0.4); }
        .badge-high { background: rgba(255, 187, 0, 0.2); color: #ffbb00; border: 1px solid rgba(255, 187, 0, 0.4); }
        .badge-medium { background: rgba(0, 170, 255, 0.2); color: #00aaff; border: 1px solid rgba(0, 170, 255, 0.4); }
        .badge-low { background: rgba(100, 100, 100, 0.2); color: #888; border: 1px solid #444; }

        /* Buttons */
        .btn-action { opacity: 0.6; transition: opacity 0.2s; padding: 4px 12px; cursor: pointer; }
        .btn-action:hover { opacity: 1; }
        
        .large-control-btn {
            padding: 4px 6px;
            cursor: pointer;
            border-radius: 4px;
            line-height: 1;
            display: flex;
            align-items: center;
        }
        .large-control-btn i { font-size: 16px; }
        .large-control-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .reorder-arrows {
            display: flex;
            flex-direction: column;
            margin-right: 8px; 
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .reorder-arrows:hover { opacity: 1; }
        .reorder-arrows button {
            background: none;
            border: none;
            padding: 0;
            color: #333; 
            font-size: 10px;
            cursor: pointer;
            line-height: 1;
            margin: 1px 0;
        }
        .reorder-arrows button:hover { color: var(--accent-color); }
        .reorder-arrows button:disabled { color: #1a1a1a; cursor: not-allowed; }

        .node-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #111;
            min-height: 36px;
        }
        
        .key-display {
            color: #666;
            font-size: 11px;
            font-weight: 700;
            margin-right: 6px;
            white-space: nowrap;
            letter-spacing: 0.5px;
            padding: 2px 4px;
            border-radius: 2px;
        }
        
        .val-display {
            font-size: 13px;
            word-break: break-word; 
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 2px;
            transition: background 0.2s;
        }
        .val-display:hover { background: #111; }

        /* State Colors */
        .state-active { color: var(--accent-color); font-weight: bold; }
        .state-inactive { color: #555; }
        .state-pending { color: var(--warn-color); }
        .state-inprogress { color: var(--process-color); font-style: italic; }
        .state-incomplete { color: var(--danger-color); }
        .state-neutral { color: #ddd; }

        #io-modal { background: rgba(0,0,0,0.95); backdrop-filter: blur(5px); }
        #viewport { overflow-x: hidden; }
        
        /* Stepper Button Style */
        .stepper-btn {
            font-size: 10px; 
            background: #111; 
            color: #666; 
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px; 
            border: 1px solid #333;
            transition: all 0.1s;
        }
        .stepper-btn:hover { color: white; border-color: #555; }
        .stepper-btn:active { background: #222; }
    </style>
</head>
<body class="flex flex-col h-screen">

<header class="bg-black border-b border-green-900/30 p-3 flex justify-between items-center sticky top-0 z-50 shadow-lg shadow-green-900/10">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-network-wired text-green-500 text-sm"></i>
            <span class="text-green-500 font-bold tracking-widest text-sm">Z-OS <span class="text-gray-600 text-xs">v5.24</span></span>
        </div>
        <div class="flex gap-2">
            <button onclick="app.reset()" class="text-red-800 hover:text-red-500 text-[10px] border border-red-900/30 px-2 py-1 rounded font-bold tracking-wider">RESET</button>
            <button onclick="app.toggleIO('import')" class="bg-blue-900/20 text-blue-400 border border-blue-800 px-3 py-1 text-[10px] font-bold rounded hover:bg-blue-900/40 tracking-wider">IMPORT</button>
            <button onclick="app.toggleIO('export')" class="bg-green-900/20 text-green-400 border border-green-800 px-3 py-1 text-[10px] font-bold rounded hover:bg-green-900/40 tracking-wider">EXPORT</button>
        </div>
    </header>

<main id="viewport" class="flex-grow overflow-y-auto p-2 pb-20">
</main>

<div id="io-modal" class="fixed inset-0 z-[60] hidden flex flex-col">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-black">
            <h2 id="modal-header" class="text-green-500 font-bold text-xs tracking-[0.2em]">DATA SYNCHRONIZATION</h2>
            <button onclick="app.toggleIO()" class="text-gray-500 hover:text-white"><i class="fa-solid fa-xmark fa-lg"></i></button>
        </div>
        <textarea id="raw-json" class="flex-grow bg-black text-green-400 p-4 text-xs mono resize-none focus:outline-none" spellcheck="false" placeholder="// PASTE WORLD MODEL HERE //"></textarea>
        <div class="flex border-t border-gray-800">
            <button id="copy-btn" onclick="app.copyRaw()" class="flex-1 bg-[#050505] text-white py-4 text-xs font-bold border-r border-gray-800 hover:bg-[#111] tracking-wider">COPY TO CLIPBOARD</button>
            <button id="load-btn" onclick="app.saveRaw()" class="flex-1 bg-[#0a1a0a] text-green-400 py-4 text-xs font-bold hover:bg-[#0f2f0f] tracking-wider">LOAD DATA</button>
        </div>
    </div>

<script>
        const NULL_STATE = { 
            "system_status": "BOOT_REQUIRED",
            "timestamp": "2025-11-25 @ 14:30",
            "battery_level": "75%",
            "elapsed_time": "00:45",
            "current_priority": "HIGH"
        };

        class ZyqralOS {
            constructor() {
                this.state = this.load();
                this.editingPath = null;
                this.render();
            }

            load() {
                const s = localStorage.getItem('zos_v5_24');
                let sJSON = s ? JSON.parse(s) : null;
                if (sJSON && sJSON.system_status === "BOOT_REQUIRED" && sJSON.battery_level === "75%" && !sJSON.elapsed_time) {
                    sJSON = null; 
                }
                return sJSON || JSON.parse(JSON.stringify(NULL_STATE));
            }

            save() {
                localStorage.setItem('zos_v5_24', JSON.stringify(this.state));
                this.render();
            }

            reset() {
                if(confirm('FACTORY RESET: Purge all local data?')) {
                    this.state = JSON.parse(JSON.stringify(NULL_STATE));
                    this.save();
                }
            }

            // --- CORE LOGIC ---
            safePath(path) { return path.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

            getParent(pathStr) {
                const parts = pathStr.split('|');
                const targetKey = parts.pop();
                let current = this.state;
                for (const part of parts) {
                    if (current[part] === undefined) return null;
                    current = current[part];
                }
                const isArray = Array.isArray(current);
                const index = isArray ? parseInt(targetKey) : null;
                return { parent: current, key: targetKey, isArray: isArray, index: index, parentPath: parts.join('|') };
            }

            reorderInObject(obj, oldKey, newKey, newIndex) {
                const keys = Object.keys(obj);
                const oldIndex = keys.indexOf(oldKey);
                const [keyToMove] = keys.splice(oldIndex, 1);
                keys.splice(newIndex, 0, keyToMove);
                const rebuiltObject = {};
                for (const k of keys) rebuiltObject[k] = obj[k];
                Object.keys(obj).forEach(k => delete obj[k]);
                Object.assign(obj, rebuiltObject);
            }

            moveItem(pathStr, direction) {
                const { parent, isArray, key, index } = this.getParent(pathStr);
                if (isArray) {
                    const arr = parent;
                    const oldIndex = index;
                    let newIndex = oldIndex;
                    if (direction === 'up' && oldIndex > 0) newIndex = oldIndex - 1;
                    else if (direction === 'down' && oldIndex < arr.length - 1) newIndex = oldIndex + 1;
                    else return;
                    const [item] = arr.splice(oldIndex, 1);
                    arr.splice(newIndex, 0, item);
                } else {
                    const keys = Object.keys(parent);
                    const oldKey = key;
                    const oldIndex = keys.indexOf(oldKey);
                    let newIndex = oldIndex;
                    if (direction === 'up' && oldIndex > 0) newIndex = oldIndex - 1;
                    else if (direction === 'down' && oldIndex < keys.length - 1) newIndex = oldIndex + 1;
                    else return;
                    const targetKey = keys[newIndex];
                    this.reorderInObject(parent, oldKey, targetKey, newIndex);
                }
                this.editingPath = null; 
                this.save();
            }
            
            moveUp(pathStr) { this.moveItem(pathStr, 'up'); }
            moveDown(pathStr) { this.moveItem(pathStr, 'down'); }

            toggleState(pathStr, currentVal) {
                const { parent, key } = this.getParent(pathStr);
                if (!parent) return;
                let nextVal = currentVal;
                const v = String(currentVal).toUpperCase();
                
                if (v === 'ACTIVE') nextVal = 'INACTIVE';
                else if (v === 'INACTIVE') nextVal = 'ACTIVE';
                else if (v === 'PENDING') nextVal = 'IN PROGRESS'; 
                else if (v === 'IN PROGRESS') nextVal = 'COMPLETED'; 
                else if (v === 'COMPLETED') nextVal = 'PENDING'; 
                else if (v === 'TRUE') nextVal = 'FALSE';
                else if (v === 'FALSE') nextVal = 'TRUE';
                else if (currentVal === true) nextVal = 'FALSE';
                else if (currentVal === false) nextVal = 'TRUE';
                
                parent[key] = nextVal;
                this.save();
            }

            updateValue(pathStr, newValue) {
                const { parent, key } = this.getParent(pathStr);
                if (!parent) return;
                let val = newValue;
                const vUpper = String(newValue).toUpperCase();
                if (!isNaN(Number(newValue)) && newValue.trim() !== '') val = Number(newValue);
                else if (vUpper === 'TRUE') val = 'TRUE';
                else if (vUpper === 'FALSE') val = 'FALSE';
                parent[key] = val;
                this.editingPath = null;
                this.save();
            }

            updateSlider(pathStr, newValue) {
                const { parent, key } = this.getParent(pathStr);
                if (!parent) return;
                parent[key] = `${newValue}%`;
                this.save();
            }

            incrementValue(pathStr, amount) {
                const { parent, key } = this.getParent(pathStr);
                if (!parent) return;
                if (typeof parent[key] === 'number') {
                    parent[key] += amount;
                    this.save();
                }
            }

            // BASE-60 TIME STEPPER
            incrementTime(pathStr, amount) {
                const { parent, key } = this.getParent(pathStr);
                if (!parent) return;
                const val = parent[key];
                
                // Expect HH:MM format
                const parts = String(val).split(':');
                if (parts.length !== 2) return;
                
                let h = parseInt(parts[0]);
                let m = parseInt(parts[1]);
                
                // Convert to minutes, add amount
                let totalMin = (h * 60) + m + amount;
                if (totalMin < 0) totalMin = 0; // Clamp to 0
                
                // Convert back
                let newH = Math.floor(totalMin / 60);
                let newM = totalMin % 60;
                
                parent[key] = `${String(newH).padStart(2, '0')}:${String(newM).padStart(2, '0')}`;
                this.save();
            }

            injectTime(pathStr) {
                const now = new Date();
                const iso = now.toISOString().split('T')[0] + ' @ ' + now.toTimeString().split(' ')[0].substring(0,5);
                this.updateValue(pathStr, iso);
            }

            deleteItem(pathStr) {
                if(!confirm('DESTROY NODE: Confirm?')) return;
                const { parent, key } = this.getParent(pathStr);
                if (!parent) return;
                if (Array.isArray(parent)) parent.splice(Number(key), 1);
                else delete parent[key];
                this.editingPath = null;
                this.save();
            }

            addItem(pathStr, isArray) {
                const { parent, key } = this.getParent(pathStr);
                let target;
                if (pathStr === '') target = this.state;
                else target = key ? parent[key] : this.state;

                if (isArray) {
                    const newVal = prompt("VALUE:");
                    if (newVal === null) return;
                    target.push(this.parseInput(newVal));
                } else {
                    const newKey = prompt("FIELD NAME:");
                    if (!newKey) return;
                    const structureType = prompt(`Enter type for '${newKey}': (VALUE, OBJECT, or ARRAY)`);
                    if (structureType === null) return;
                    let newVal;
                    if (structureType.toUpperCase() === 'OBJECT') newVal = {};
                    else if (structureType.toUpperCase() === 'ARRAY') newVal = [];
                    else {
                        const valuePrompt = prompt("VALUE:");
                        if (valuePrompt === null) return;
                        newVal = this.parseInput(valuePrompt);
                    }
                    target[newKey] = newVal;
                }
                this.save();
            }

            parseInput(input) {
                let val = input;
                const vUpper = String(input).toUpperCase();
                if (!isNaN(Number(input)) && input.trim() !== '') val = Number(input);
                else if (vUpper === 'TRUE') val = 'TRUE';
                else if (vUpper === 'FALSE') val = 'FALSE';
                return val;
            }

            // --- RENDERING ---
            render() {
                const root = document.getElementById('viewport');
                root.innerHTML = this.buildTree(this.state, '');
            }

            buildReorderArrows(path, key, parentLength) {
                const { isArray, parent } = this.getParent(path);
                const isReorderable = isArray || (typeof parent === 'object' && !Array.isArray(parent) && path !== '');
                if (!isReorderable) return '';

                const length = isArray ? parentLength : Object.keys(parent).length; 
                const index = isArray ? parseInt(key) : Object.keys(parent).indexOf(key);
                if (index === -1) return ''; 

                const upDisabled = index === 0;
                const downDisabled = index === length - 1;

                return `
                    <div class="reorder-arrows">
                        <button onclick="app.moveUp('${this.safePath(path)}')" ${upDisabled ? 'disabled' : ''}><i class="fa-solid fa-angle-up"></i></button>
                        <button onclick="app.moveDown('${this.safePath(path)}')" ${downDisabled ? 'disabled' : ''}><i class="fa-solid fa-angle-down"></i></button>
                    </div>
                `;
            }

            buildTree(data, path) {
                if (data === null) return `<span class="text-gray-600 italic">null</span>`;
                if (typeof data !== 'object') return this.buildPrimitive(data, path);

                const isArray = Array.isArray(data);
                let html = `<div class="w-full">`;

                Object.keys(data).forEach(key => {
                    const currentPath = path ? `${path}|${key}` : key;
                    const safeP = this.safePath(currentPath);
                    const value = data[key];
                    const isPrimitive = typeof value !== 'object' || value === null;
                    
                    if (isPrimitive) {
                        html += `
                            <div class="node-row group hover:bg-[#0a0a0a]">
                                <div class="flex-grow flex items-center mr-2"> 
                                    ${this.buildReorderArrows(currentPath, key, data.length)}
                                    ${this.buildKeyDisplay(key, safeP, isArray)}
                                    ${this.buildPrimitive(value, safeP, key)}
                                </div>
                                ${this.buildPrimitiveControls(safeP, isArray, key, data.length)}
                            </div>`;
                    } else {
                        html += `
                            <div class="mt-2 mb-1">
                                <div class="flex justify-between items-center bg-[#0a0a0a] px-2 py-1 border-b border-[#222] rounded-t">
                                    <div class="flex items-center">
                                        ${this.buildReorderArrows(currentPath, key, data.length)}
                                        <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest transition">
                                            ${this.buildKeyDisplay(key, safeP, isArray, true)}
                                        </div>
                                    </div>
                                    <div class="flex gap-2 items-center">
                                        <button onclick="app.addItem('${safeP}', ${Array.isArray(value)})" class="text-green-700 hover:text-green-400 text-[10px]"><i class="fa-solid fa-plus"></i></button>
                                        <button onclick="app.deleteItem('${safeP}')" class="text-red-900 hover:text-red-500 text-[10px]"><i class="fa-solid fa-xmark"></i></button>
                                    </div>
                                </div>
                                <div class="tree-line">
                                    ${this.buildTree(value, currentPath)}
                                </div>
                            </div>`;
                    }
                });
                
                if (Object.keys(data).length === 0) {
                    const safeP = this.safePath(path);
                    html += `<div class="text-[10px] text-gray-700 italic p-2 flex items-center">EMPTY <button onclick="app.addItem('${safeP}', ${isArray})" class="ml-2 text-green-700 hover:text-green-400"><i class="fa-solid fa-plus"></i></button></div>`;
                }

                html += `</div>`;
                return html;
            }
            
            buildKeyDisplay(key, path, isArray, isHeader = false) {
                if (isArray) return `<span class="text-green-800 font-bold mr-2 text-[10px]">[${key}]</span>`;
                const displayClass = isHeader ? 'text-gray-400 uppercase tracking-widest' : 'key-display uppercase';
                return `<span class="${displayClass}">${key}</span>`;
            }
            
            buildPrimitiveControls(safeP, isArray, key, arrayLength) {
                if (this.editingPath === safeP) return ''; 
                // Don't show delete button here if it's already in the slider block
                const { parent } = this.getParent(safeP);
                const val = parent[isArray ? key : key]; 
                const isSlider = String(val).match(/^(\d{1,3})%$/);
                
                if (isSlider) return ''; // Slider block handles its own delete button

                let html = `<div class="flex items-center gap-2">`;
                html += `<button onclick="app.deleteItem('${safeP}')" class="btn-action text-red-900 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button></div>`;
                return html;
            }

            buildPrimitive(val, path, keyName) {
                const initialValue = typeof val === 'object' && val !== null ? JSON.stringify(val) : val;
                
                // --- Value Editing Mode ---
                if (this.editingPath === path) {
                    const lineCount = String(initialValue).split('\n').length;
                    const rows = Math.max(3, lineCount + 1); 
                    const showClock = String(keyName).toLowerCase().includes('timestamp');
                    
                    return `
                        <div class="flex items-start w-full gap-1">
                            <textarea id="input-${path}" class="edit-input" rows="${rows}" onkeydown="if(event.key==='Enter' && event.shiftKey) {event.preventDefault(); app.updateValue('${path}', this.value)}" >${initialValue}</textarea>
                            <div class="flex flex-col gap-1 mt-1">
                                <div class="flex items-center gap-1">
                                    <button onclick="app.updateValue('${path}', document.getElementById('input-${path}').value)" class="text-green-500 hover:bg-green-900/50 large-control-btn"><i class="fa-solid fa-check"></i></button>
                                    ${showClock ? `<button onclick="app.injectTime('${path}')" class="text-blue-400 hover:bg-blue-900/30 large-control-btn" title="Inject Timestamp"><i class="fa-solid fa-clock"></i></button>` : ''}
                                </div>
                            </div>
                        </div>
                    `; 
                }

                // --- Slider Detection Logic ---
                const percentMatch = String(val).match(/^(\d{1,3})%$/);
                if (percentMatch) {
                    const numVal = parseInt(percentMatch[1]);
                    if (numVal >= 0 && numVal <= 100) {
                        return `
                        <div class="flex-grow flex items-center gap-2">
                            <input type="range" class="flex-grow" min="0" max="100" value="${numVal}" 
                                onchange="app.updateSlider('${path}', this.value)" 
                                oninput="this.nextElementSibling.innerText = this.value + '%'">
                            <span class="mono text-xs text-[#00ff9d] font-bold w-10 text-right">${val}</span>
                            <button class="ml-2 text-xs text-red-900 hover:text-red-500" onclick="app.deleteItem('${path}')"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        `;
                    }
                }
                
                // --- Numeric Stepper Logic ---
                if (typeof val === 'number') {
                     return `
                        <div class="flex items-center gap-1">
                            <button class="stepper-btn" onclick="app.incrementValue('${path}', -10)"><i class="fa-solid fa-angles-left"></i></button>
                            <button class="stepper-btn" onclick="app.incrementValue('${path}', -1)"><i class="fa-solid fa-minus"></i></button>
                            <span class="val-display mono text-green-400 hover:underline mx-1" onclick="app.setEdit('${path}')">${val}</span>
                            <button class="stepper-btn" onclick="app.incrementValue('${path}', 1)"><i class="fa-solid fa-plus"></i></button>
                            <button class="stepper-btn" onclick="app.incrementValue('${path}', 10)"><i class="fa-solid fa-angles-right"></i></button>
                        </div>
                     `;
                }
                
                // --- Time Stepper Logic (HH:MM) ---
                const timeMatch = String(val).match(/^\d{1,2}:\d{2}$/);
                if (timeMatch) {
                    return `
                        <div class="flex items-center gap-1">
                            <button class="stepper-btn" onclick="app.incrementTime('${path}', -10)"><i class="fa-solid fa-angles-left"></i></button>
                            <button class="stepper-btn" onclick="app.incrementTime('${path}', -1)"><i class="fa-solid fa-minus"></i></button>
                            <span class="val-display mono text-blue-400 hover:underline mx-1" onclick="app.setEdit('${path}')">${val}</span>
                            <button class="stepper-btn" onclick="app.incrementTime('${path}', 1)"><i class="fa-solid fa-plus"></i></button>
                            <button class="stepper-btn" onclick="app.incrementTime('${path}', 10)"><i class="fa-solid fa-angles-right"></i></button>
                        </div>
                    `;
                }

                // --- Heuristic Priority Tags ---
                const vUpper = String(val).toUpperCase();
                if (vUpper === 'CRITICAL') return `<span class="badge badge-critical cursor-pointer" onclick="app.setEdit('${path}')">CRITICAL</span>`;
                if (vUpper === 'HIGH') return `<span class="badge badge-high cursor-pointer" onclick="app.setEdit('${path}')">HIGH</span>`;
                if (vUpper === 'MEDIUM') return `<span class="badge badge-medium cursor-pointer" onclick="app.setEdit('${path}')">MEDIUM</span>`;
                if (vUpper === 'LOW') return `<span class="badge badge-low cursor-pointer" onclick="app.setEdit('${path}')">LOW</span>`;

                // --- Display Mode (Standard) ---
                const isToggle = ['ACTIVE', 'INACTIVE', 'COMPLETED', 'PENDING', 'IN PROGRESS', 'TRUE', 'FALSE'].includes(vUpper) || typeof val === 'boolean';
                if (isToggle) {
                    let colorClass = 'state-neutral';
                    if (['ACTIVE', 'COMPLETED', 'TRUE'].includes(vUpper)) colorClass = 'state-active';
                    else if (['INACTIVE', 'FALSE'].includes(vUpper)) colorClass = 'state-inactive';
                    else if (['PENDING'].includes(vUpper)) colorClass = 'state-pending';
                    else if (['IN PROGRESS'].includes(vUpper)) colorClass = 'state-inprogress';
                    return `<span class="val-display mono ${colorClass}" onclick="app.toggleState('${path}', '${val}')">${vUpper} <i class="fa-solid fa-toggle-on ml-1 text-[10px] opacity-50"></i></span>`;
                }
                return `<span class="val-display mono text-green-400 hover:underline" onclick="app.setEdit('${path}')">${val}</span>`;
            }

            setEdit(path) { this.editingPath = path; this.render(); setTimeout(() => { const el = document.getElementById(`input-${path}`); if(el) { el.focus(); el.select(); } }, 50); }
            cancelEdit() { this.editingPath = null; this.render(); }
            
            toggleIO(mode) {
                const modal = document.getElementById('io-modal');
                const ta = document.getElementById('raw-json');
                const header = document.getElementById('modal-header');
                const copyBtn = document.getElementById('copy-btn');
                const loadBtn = document.getElementById('load-btn');
                if (modal.classList.contains('hidden')) {
                    if (mode === 'export') { ta.value = JSON.stringify(this.state, null, 2); ta.readOnly = true; header.textContent = 'DATA EXTRACTION'; ta.placeholder = '// COPY DATA STREAM BELOW //'; copyBtn.classList.remove('hidden'); loadBtn.classList.add('hidden'); }
                    else if (mode === 'import') { ta.value = ''; ta.readOnly = false; header.textContent = 'DATA INJECTION'; ta.placeholder = '// PASTE WORLD MODEL HERE //'; copyBtn.classList.add('hidden'); loadBtn.classList.remove('hidden'); }
                    modal.classList.remove('hidden');
                } else { modal.classList.add('hidden'); ta.readOnly = false; }
            }
            saveRaw() { try { const ta = document.getElementById('raw-json'); const newState = JSON.parse(ta.value); this.state = newState; this.save(); this.toggleIO(); } catch(e) { alert("SYNTAX ERROR: Invalid JSON."); } }
            copyRaw() { const ta = document.getElementById('raw-json'); ta.select(); document.execCommand('copy'); const tempBtnText = document.getElementById('copy-btn').textContent; document.getElementById('copy-btn').textContent = 'COPIED!'; setTimeout(() => { document.getElementById('copy-btn').textContent = tempBtnText; }, 1000); }
        }
        const app = new ZyqralOS();
    </script>
</body>
</html>
