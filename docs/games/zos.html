<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Z-OS | AGENCY PROTOCOL (v6.02)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@600;700&display=swap');
        
        :root {
            --bg-color: #000000;
            --panel-color: #0a0a0a;
            --border-color: #1f1f1f;
            --accent-color: #00ff9d;
            --text-color: #c0c0c0;
            --danger-color: #ff0055;
            --warn-color: #ffbb00;
            --process-color: #00aaff;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Tree Structure */
        .tree-line {
            border-left: 1px solid #333;
            padding-left: 6px; 
            margin-left: 3px;
        }
        
        /* Inputs */
        textarea.edit-input {
            background: #111;
            color: var(--accent-color);
            border: 1px solid #333;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            padding: 4px 6px;
            width: 100%;
            min-height: 40px; 
            resize: vertical; 
            border-radius: 2px;
            white-space: pre-wrap;
            overflow: auto;
        }
        textarea.edit-input:focus { outline: none; border-color: var(--accent-color); }
        
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* Search Input */
        .search-input {
            background: #111;
            border: 1px solid #333;
            color: var(--accent-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            padding: 3px 8px; 
            border-radius: 4px;
            width: 60px; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            height: 24px; 
            line-height: 1;
        }
        .search-input:focus { 
            outline: none; 
            border-color: var(--accent-color); 
            width: 160px; 
        }
        .search-input::placeholder { color: #444; line-height: 16px; }

        /* Priority Badges */
        .badge { font-size: 10px; font-weight: bold; padding: 1px 4px; border-radius: 2px; letter-spacing: 0.5px; }
        .badge-critical { background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid rgba(255, 0, 85, 0.4); }
        .badge-high { background: rgba(255, 187, 0, 0.2); color: #ffbb00; border: 1px solid rgba(255, 187, 0, 0.4); }
        .badge-medium { background: rgba(0, 170, 255, 0.2); color: #00aaff; border: 1px solid rgba(0, 170, 255, 0.4); }
        .badge-low { background: rgba(100, 100, 100, 0.2); color: #888; border: 1px solid #444; }

        /* Buttons */
        .btn-action { opacity: 0.6; transition: opacity 0.2s; padding: 4px 12px; cursor: pointer; }
        .btn-action:hover { opacity: 1; }
        
        .large-control-btn {
            padding: 4px 6px;
            cursor: pointer;
            border-radius: 4px;
            line-height: 1;
            display: flex;
            align-items: center;
        }
        .large-control-btn i { font-size: 16px; }
        .large-control-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .reorder-arrows {
            display: flex;
            flex-direction: column;
            margin-right: 8px; 
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .reorder-arrows:hover { opacity: 1; }
        .reorder-arrows button {
            background: none;
            border: none;
            padding: 0;
            color: #333; 
            font-size: 10px;
            cursor: pointer;
            line-height: 1;
            margin: 1px 0;
        }
        .reorder-arrows button:hover { color: var(--accent-color); }
        .reorder-arrows button:disabled { color: #1a1a1a; cursor: not-allowed; }

        .node-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #111;
            min-height: 36px;
            position: relative;
        }
        
        .key-display {
            color: #666;
            font-size: 11px;
            font-weight: 700;
            margin-right: 6px;
            white-space: nowrap;
            letter-spacing: 0.5px;
            padding: 2px 4px;
            border-radius: 2px;
            position: relative; z-index: 10;
        }
        
        .val-display {
            font-size: 13px;
            word-break: break-word; 
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 2px;
            transition: background 0.2s;
            position: relative; z-index: 10;
        }
        .val-display:hover { background: #111; }

        /* State Switchers */
        .state-switch { display: flex; border: 1px solid #222; border-radius: 4px; overflow: hidden; position: relative; z-index: 10; }
        .state-btn { 
            font-size: 9px; 
            font-family: 'JetBrains Mono', monospace; 
            padding: 2px 6px; 
            cursor: pointer; 
            background: #050505; 
            color: #444; 
            border-right: 1px solid #222;
            transition: all 0.2s;
        }
        .state-btn:last-child { border-right: none; }
        .state-btn:hover { color: #888; }
        
        .state-btn-active-pend { background: rgba(255, 187, 0, 0.15); color: #ffbb00; font-weight: bold; }
        .state-btn-active-prog { background: rgba(0, 170, 255, 0.15); color: #00aaff; font-weight: bold; }
        .state-btn-active-comp { background: rgba(0, 255, 157, 0.15); color: #00ff9d; font-weight: bold; }
        
        .state-btn-active-on { background: rgba(0, 255, 157, 0.15); color: #00ff9d; font-weight: bold; }
        .state-btn-active-off { background: rgba(80, 80, 80, 0.3); color: #888; font-weight: bold; }

        #io-modal, #log-modal { background: rgba(0,0,0,0.95); backdrop-filter: blur(5px); }
        #viewport { overflow-x: hidden; }
        
        /* Stepper Button Style */
        .stepper-btn {
            font-size: 10px; 
            background: #111; 
            color: #666; 
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px; 
            border: 1px solid #333;
            transition: all 0.1s;
            flex-shrink: 0; 
            position: relative; z-index: 10;
        }
        .stepper-btn:hover { color: white; border-color: #555; }
        .stepper-btn:active { background: #222; }
        
        /* Log Styles */
        .log-entry {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            border-bottom: 1px solid #222;
            padding: 8px 0;
            color: #888;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
        }
        .log-ts { color: #444; font-size: 9px; margin-bottom: 2px; }
        .log-act { color: #aaa; word-break: break-all; }
        .log-hl { color: var(--accent-color); }
    </style>
</head>
<body class="flex flex-col h-screen">

<header class="bg-black border-b border-green-900/30 p-3 flex justify-between items-center sticky top-0 z-50 shadow-lg shadow-green-900/10">
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-network-wired text-green-500 text-sm"></i>
                <span class="text-green-500 font-bold tracking-widest text-sm">Z-OS <span class="text-white text-xs">v6.02</span></span>
            </div>
            <div class="relative mr-2">
                <input type="text" id="tree-search" class="search-input" placeholder="FILTER" onkeyup="app.updateSearch(this.value)">
                <i class="fa-solid fa-filter text-gray-700 text-[9px] absolute right-2 top-1.5 pointer-events-none"></i>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="app.reset()" class="text-red-800 hover:text-red-500 text-[10px] border border-red-900/30 px-2 py-1 rounded font-bold tracking-wider">RESET</button>
            <button onclick="app.toggleLog()" class="bg-gray-900/50 text-gray-300 border border-gray-700 px-3 py-1 text-[10px] font-bold rounded hover:bg-gray-800 tracking-wider">LOG</button>
            <button onclick="app.toggleIO('import')" class="bg-blue-900/20 text-blue-400 border border-blue-800 px-3 py-1 text-[10px] font-bold rounded hover:bg-blue-900/40 tracking-wider">IMPORT</button>
            <button onclick="app.toggleIO('export')" class="bg-green-900/20 text-green-400 border border-green-800 px-3 py-1 text-[10px] font-bold rounded hover:bg-green-900/40 tracking-wider">EXPORT</button>
        </div>
    </header>

<main id="viewport" class="flex-grow overflow-y-auto p-2 pb-20">
</main>

<div id="io-modal" class="fixed inset-0 z-[60] hidden flex flex-col">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-black">
            <div class="flex items-center gap-4">
                <h2 id="modal-header" class="text-green-500 font-bold text-xs tracking-[0.2em]">DATA SYNCHRONIZATION</h2>
                <label id="export-option-container" class="hidden flex items-center gap-2 cursor-pointer group">
                    <input type="checkbox" id="export-visible-check" onchange="app.updateExportPreview()" class="accent-green-500 cursor-pointer w-3 h-3">
                    <span class="text-[10px] text-gray-500 font-bold tracking-wider group-hover:text-green-400">VISIBLE ONLY</span>
                </label>
            </div>
            <button onclick="app.toggleIO()" class="text-gray-500 hover:text-white"><i class="fa-solid fa-xmark fa-lg"></i></button>
        </div>
        <textarea id="raw-json" class="flex-grow bg-black text-green-400 p-4 text-xs mono resize-none focus:outline-none" spellcheck="false" placeholder="// PASTE WORLD MODEL HERE //"></textarea>
        <div class="flex border-t border-gray-800">
            <button id="copy-btn" onclick="app.copyRaw()" class="flex-1 bg-[#050505] text-white py-4 text-xs font-bold border-r border-gray-800 hover:bg-[#111] tracking-wider">COPY TO CLIPBOARD</button>
            <button id="load-btn" onclick="app.saveRaw()" class="flex-1 bg-[#0a1a0a] text-green-400 py-4 text-xs font-bold hover:bg-[#0f2f0f] tracking-wider">LOAD DATA</button>
        </div>
</div>

<div id="log-modal" class="fixed inset-0 z-[60] hidden flex flex-col">
    <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-black">
        <h2 id="log-header-text" class="text-green-500 font-bold text-xs tracking-[0.2em]">SYSTEM LOGS</h2>
        <button onclick="app.toggleLog()" class="text-gray-500 hover:text-white"><i class="fa-solid fa-xmark fa-lg"></i></button>
    </div>
    
    <div class="p-2 border-b border-gray-900 bg-[#050505] flex justify-between items-center text-[10px] font-mono">
        <div class="flex items-center gap-2">
            <span class="text-gray-500 uppercase">Limit:</span>
            <input type="number" id="log-limit-input" class="bg-[#111] border border-gray-700 text-green-400 w-12 px-1 py-0.5 text-center focus:outline-none focus:border-green-500 rounded-sm" min="0" onchange="app.updateLogLimit(this.value)">
        </div>
        <div class="flex items-center gap-2">
            <button id="log-toggle-btn" onclick="app.toggleLogState()" class="border px-2 py-0.5 rounded text-[9px] font-bold tracking-wider transition-colors"></button>
            <button onclick="app.clearLogs()" class="text-red-900 hover:text-red-500 hover:bg-red-900/10 border border-red-900/30 px-2 py-0.5 rounded text-[9px] transition-colors">CLEAR</button>
        </div>
    </div>

    <div id="log-viewport" class="flex-grow overflow-y-auto p-4 bg-black"></div>
</div>

<script>
        const NULL_STATE = { 
            "system_status": "BOOT_REQUIRED",
            "timestamp": "2025-11-25 @ 14:30",
            "battery_level": "75%",
            "elapsed_time": "00:45",
            "current_priority": "HIGH",
            "log_config": { "limit": 10, "enabled": true },
            "_meta_log": []
        };

        const STORAGE_KEY = 'zos_v6_02';
        const LEGACY_KEY = 'zos_v6_00';

        class ZyqralOS {
            constructor() {
                this.searchTerm = '';
                this.state = this.load();
                this.editingPath = null;
                this.collapsed = new Set(); 
                this.pendingEdits = {}; 
                
                if(!this.state.log_config) this.state.log_config = { "limit": 10, "enabled": true };
                if(!this.state._meta_log) this.state._meta_log = [];
                
                this.render();
            }

            load() {
                let s = localStorage.getItem(STORAGE_KEY);
                if (!s) {
                    const legacy = localStorage.getItem(LEGACY_KEY);
                    if (legacy) {
                        s = legacy;
                        localStorage.setItem(STORAGE_KEY, s);
                    }
                }
                let sJSON = s ? JSON.parse(s) : null;
                if (sJSON && sJSON.system_status === "BOOT_REQUIRED" && sJSON.battery_level === "75%" && !sJSON.elapsed_time) {
                    sJSON = null; 
                }
                return sJSON || JSON.parse(JSON.stringify(NULL_STATE));
            }

            save() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
                this.render();
            }

            reset() {
                if(confirm('FACTORY RESET: Purge all local data?')) {
                    this.state = JSON.parse(JSON.stringify(NULL_STATE));
                    this.collapsed.clear();
                    this.pendingEdits = {};
                    this.searchTerm = '';
                    document.getElementById('tree-search').value = '';
                    this.save();
                }
            }
            
            updateSearch(val) {
                this.searchTerm = val.toLowerCase();
                this.render();
            }

            hasMatch(data, term) {
                if (typeof data !== 'object' || data === null) {
                    return String(data).toLowerCase().includes(term);
                }
                return Object.keys(data).some(key => {
                    if (key.toLowerCase().includes(term)) return true;
                    return this.hasMatch(data[key], term);
                });
            }

            addLog(action) {
                if (!this.state.log_config.enabled) return;
                const now = new Date();
                const ts = now.toTimeString().split(' ')[0];
                const entry = { t: ts, a: action };
                if(!this.state._meta_log) this.state._meta_log = [];
                this.state._meta_log.unshift(entry);
                const limit = parseInt(this.state.log_config.limit) || 10;
                if(this.state._meta_log.length > limit) {
                    this.state._meta_log = this.state._meta_log.slice(0, limit);
                }
            }

            logGranular(type, pathStr, displayOld, displayNew) {
                if (!this.state.log_config.enabled) return;
                const now = new Date();
                const ts = now.toTimeString().split(' ')[0];
                const p = this.formatPath(pathStr);
                const logContent = `${type} <span class="log-hl">[${p}]</span><br> ${displayOld} \u81f3 <span class="text-white">${displayNew}</span>`;
                const pending = this.pendingEdits[pathStr];
                const nowTime = Date.now();
                if (pending && (nowTime - pending.startTime < 30000)) {
                    const combinedContent = `${type} <span class="log-hl">[${p}]</span><br> ${pending.initialVal} \u81f3 <span class="text-white">${displayNew}</span>`;
                    pending.entry.t = ts; 
                    pending.entry.a = combinedContent;
                } else {
                    const limit = parseInt(this.state.log_config.limit) || 10;
                    if(!this.state._meta_log) this.state._meta_log = [];
                    const entry = { t: ts, a: logContent };
                    this.state._meta_log.unshift(entry);
                    if (this.state._meta_log.length > limit) {
                         this.state._meta_log = this.state._meta_log.slice(0, limit);
                    }
                    this.pendingEdits[pathStr] = {
                        startTime: nowTime,
                        initialVal: displayOld,
                        entry: this.state._meta_log[0]
                    };
                }
            }
            
            updateLogLimit(val) {
                let limit = parseInt(val);
                if (limit < 0) limit = 0;
                this.state.log_config.limit = limit;
                if (this.state._meta_log.length > limit) {
                    this.state._meta_log = this.state._meta_log.slice(0, limit);
                }
                this.save();
                this.renderLogs(); 
            }

            toggleLogState() {
                this.state.log_config.enabled = !this.state.log_config.enabled;
                this.save();
                this.updateLogControlUI();
            }

            clearLogs() {
                if(confirm("Clear all log history?")) {
                    this.state._meta_log = [];
                    this.pendingEdits = {}; 
                    this.save();
                    this.renderLogs();
                }
            }

            updateLogControlUI() {
                const btn = document.getElementById('log-toggle-btn');
                const input = document.getElementById('log-limit-input');
                const headerText = document.getElementById('log-header-text');
                input.value = this.state.log_config.limit;
                headerText.textContent = `SYSTEM LOGS (${this.state._meta_log.length})`;
                if (this.state.log_config.enabled) {
                    btn.textContent = "ENABLED";
                    btn.className = "bg-green-900/30 text-green-400 border border-green-800 px-2 py-0.5 rounded text-[9px] font-bold tracking-wider hover:bg-green-900/50";
                } else {
                    btn.textContent = "DISABLED";
                    btn.className = "bg-red-900/30 text-red-400 border border-red-800 px-2 py-0.5 rounded text-[9px] font-bold tracking-wider hover:bg-red-900/50";
                }
            }

            renderLogs() {
                const vp = document.getElementById('log-viewport');
                let html = '';
                if(this.state._meta_log && this.state._meta_log.length > 0) {
                    this.state._meta_log.forEach(log => {
                        html += `<div class="log-entry">
                            <span class="log-ts">${log.t}</span>
                            <span class="log-act">${log.a}</span>
                        </div>`;
                    });
                } else {
                    html = '<div class="text-gray-600 italic text-xs mt-4 text-center">NO LOGS RECORDED</div>';
                }
                vp.innerHTML = html;
                this.updateLogControlUI();
            }

            toggleLog() {
                const el = document.getElementById('log-modal');
                if(el.classList.contains('hidden')) {
                    this.renderLogs();
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            }

            formatPath(pathStr) {
                return pathStr.replace(/\|/g, ' > ');
            }

            safePath(path) { return path.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

            getParent(pathStr) {
                const parts = pathStr.split('|');
                const targetKey = parts.pop();
                let current = this.state;
                for (const part of parts) {
                    if (current[part] === undefined) return null;
                    current = current[part];
                }
                const isArray = Array.isArray(current);
                const index = isArray ? parseInt(targetKey) : null;
                return { parent: current, key: targetKey, isArray: isArray, index: index, parentPath: parts.join('|') };
            }

            reorderInObject(obj, oldKey, newKey, newIndex) {
                const keys = Object.keys(obj);
                const oldIndex = keys.indexOf(oldKey);
                const [keyToMove] = keys.splice(oldIndex, 1);
                keys.splice(newIndex, 0, keyToMove);
                const rebuiltObject = {};
                for (const k of keys) rebuiltObject[k] = obj[k];
                Object.keys(obj).forEach(k => delete obj[k]);
                Object.assign(obj, rebuiltObject);
            }

            moveItem(pathStr, direction) {
                const { parent, isArray, key, index } = this.getParent(pathStr);
                if (isArray) {
                    const arr = parent;
                    const oldIndex = index;
                    let newIndex = oldIndex;
                    if (direction === 'up' && oldIndex > 0) newIndex = oldIndex - 1;
                    else if (direction === 'down' && oldIndex < arr.length - 1) newIndex = oldIndex + 1;
                    else return;
                    const [item] = arr.splice(oldIndex, 1);
                    arr.splice(newIndex, 0, item);
                } else {
                    const keys = Object.keys(parent);
                    const oldKey = key;
                    const oldIndex = keys.indexOf(oldKey);
                    let newIndex = oldIndex;
                    if (direction === 'up' && oldIndex > 0) newIndex = oldIndex - 1;
                    else if (direction === 'down' && oldIndex < keys.length - 1) newIndex = oldIndex + 1;
                    else return;
                    const targetKey = keys[newIndex];
                    this.reorderInObject(parent, oldKey, targetKey, newIndex);
                }
                this.editingPath = null; 
                this.save();
            }
            
            moveUp(pathStr) { this.moveItem(pathStr, 'up'); }
            moveDown(pathStr) { this.moveItem(pathStr, 'down'); }

            updateValue(pathStr, newValue) {
                const { parent, key } = this.getParent(pathStr);
                if (!parent) return;
                
                const oldValue = parent[key];
                
                let val = newValue;
                const vUpper = String(newValue).toUpperCase();
                if (!isNaN(Number(newValue)) && newValue.trim() !== '') val = Number(newValue);
                else if (vUpper === 'TRUE') val = 'TRUE';
                else if (vUpper === 'FALSE') val = 'FALSE';
                
                if (oldValue === val) {
                    this.editingPath = null;
                    this.render();
                    return;
                }
                
                parent[key] = val;
                this.editingPath = null;
                
                if(this.pendingEdits[pathStr]) delete this.pendingEdits[pathStr];
                
                const p = this.formatPath(pathStr);
                this.addLog(`UPDATE <span class="log-hl">[${p}]</span><br> ${oldValue} \u81f3 <span class="text-white">${val}</span>`);
                this.save();
            }

            incrementValue(pathStr, amount) {
                const { parent, key } = this.getParent(pathStr);
                if (!parent) return;
                if (typeof parent[key] === 'number') {
                    const oldValue = parent[key];
                    parent[key] += amount;
                    this.logGranular('MATH', pathStr, oldValue, parent[key]);
                    this.save();
                }
            }

            incrementPercent(pathStr, amount) {
                const { parent, key } = this.getParent(pathStr);
                if (!parent) return;
                const oldValue = parent[key];
                const match = String(oldValue).match(/^(\d{1,3})%$/);
                if (match) {
                    let val = parseInt(match[1]);
                    val += amount;
                    if (val < 0) val = 0;
                    if (val > 100) val = 100;
                    parent[key] = `${val}%`;
                    this.logGranular('MATH', pathStr, oldValue, parent[key]);
                    this.save();
                }
            }

            incrementTime(pathStr, amount) {
                const { parent, key } = this.getParent(pathStr);
                if (!parent) return;
                const oldValue = parent[key];
                const parts = String(oldValue).split(':');
                if (parts.length !== 2) return;
                let h = parseInt(parts[0]);
                let m = parseInt(parts[1]);
                let totalMin = (h * 60) + m + amount;
                if (totalMin < 0) totalMin = 0;
                let newH = Math.floor(totalMin / 60);
                let newM = totalMin % 60;
                parent[key] = `${String(newH).padStart(2, '0')}:${String(newM).padStart(2, '0')}`;
                this.logGranular('TIME', pathStr, oldValue, parent[key]);
                this.save();
            }

            injectTime(pathStr) {
                const now = new Date();
                const iso = now.toISOString().split('T')[0] + ' @ ' + now.toTimeString().split(' ')[0].substring(0,5);
                this.updateValue(pathStr, iso); 
            }

            deleteItem(pathStr) {
                if(!confirm('DESTROY NODE: Confirm?')) return;
                const { parent, key } = this.getParent(pathStr);
                if (!parent) return;
                
                const valToDelete = parent[key];
                let valLog = typeof valToDelete === 'object' ? '{OBJECT}' : valToDelete;
                
                if (Array.isArray(parent)) parent.splice(Number(key), 1);
                else delete parent[key];
                
                this.editingPath = null;
                if(this.pendingEdits[pathStr]) delete this.pendingEdits[pathStr];

                const p = this.formatPath(pathStr);
                this.addLog(`DELETE <span class="log-hl">[${p}]</span><br> VALUE: ${valLog}`);
                this.save();
            }

            addItem(pathStr, isArray) {
                const { parent, key } = this.getParent(pathStr);
                let target;
                if (pathStr === '') target = this.state;
                else target = key ? parent[key] : this.state;

                if (isArray) {
                    const newVal = prompt("VALUE:");
                    if (newVal === null) return;
                    target.push(this.parseInput(newVal));
                    const p = this.formatPath(pathStr);
                    this.addLog(`ADD <span class="log-hl">[${p} > INDEX ${target.length-1}]</span><br> VALUE: ${newVal}`);
                } else {
                    const newKey = prompt("FIELD NAME:");
                    if (!newKey) return;
                    const structureType = prompt(`Enter type for '${newKey}': (VALUE, OBJECT, or ARRAY)`);
                    if (structureType === null) return;
                    let newVal;
                    let typeLog = "VALUE";
                    if (structureType.toUpperCase() === 'OBJECT') { newVal = {}; typeLog = "{OBJECT}"; }
                    else if (structureType.toUpperCase() === 'ARRAY') { newVal = []; typeLog = "[ARRAY]"; }
                    else {
                        const valuePrompt = prompt("VALUE:");
                        if (valuePrompt === null) return;
                        newVal = this.parseInput(valuePrompt);
                        typeLog = newVal;
                    }
                    target[newKey] = newVal;
                    const p = this.formatPath(pathStr);
                    const separator = p ? ' > ' : '';
                    this.addLog(`CREATE <span class="log-hl">[${p}${separator}${newKey}]</span><br> INITIAL: ${typeLog}`);
                }
                this.save();
            }

            parseInput(input) {
                let val = input;
                const vUpper = String(input).toUpperCase();
                if (!isNaN(Number(input)) && input.trim() !== '') val = Number(input);
                else if (vUpper === 'TRUE') val = 'TRUE';
                else if (vUpper === 'FALSE') val = 'FALSE';
                return val;
            }

            toggleCollapse(path) {
                if (this.collapsed.has(path)) this.collapsed.delete(path);
                else this.collapsed.add(path);
                this.render();
            }

            // --- FILTER LOGIC (NEW) ---
            filterVisible(data, path = '') {
                if (data === null || typeof data !== 'object') return data;

                // Prepare result container based on type
                const isArray = Array.isArray(data);
                const result = isArray ? [] : {};

                Object.keys(data).forEach(key => {
                    // Always skip hidden system fields in "Visible Only" mode
                    if (key === '_meta_log' || key === 'log_config') return;

                    const value = data[key];
                    
                    const currentPath = path ? `${path}|${key}` : key;
                    const isCollapsed = this.collapsed.has(currentPath);
                    const isSearchActive = this.searchTerm.length > 0;
                    
                    if (isCollapsed && !isSearchActive) {
                        // Node is minimized. Return a placeholder.
                        if (Array.isArray(value)) {
                            result[key] = `[ARRAY(${value.length}) - MINIMIZED]`;
                        } else if (typeof value === 'object' && value !== null) {
                            result[key] = '{OBJECT - MINIMIZED}';
                        } else {
                            result[key] = value;
                        }
                    } else {
                        // Node is expanded or search is active. Recurse.
                        result[key] = this.filterVisible(value, currentPath);
                    }
                });

                return result;
            }

            updateExportPreview() {
                const ta = document.getElementById('raw-json');
                const checkbox = document.getElementById('export-visible-check');
                
                let dataToExport;

                if (checkbox.checked) {
                    // Filter based on collapsed state
                    dataToExport = this.filterVisible(this.state);
                } else {
                    // Full Export
                    dataToExport = JSON.parse(JSON.stringify(this.state));
                }

                // Handle Log Formatting for Export
                if (dataToExport._meta_log) {
                    dataToExport._meta_log = dataToExport._meta_log.map(log => {
                        log.a = log.a
                            .replace(/<span class="log-hl">/g, '『ハイライト』')
                            .replace(/<span class="text-white">/g, '『ホワイト』')
                            .replace(/<\/span>/g, '『エンド』')
                            .replace(/<br>/g, '『改行』')
                            .replace(/\u81f3/g, '『トゥ』'); 
                        return log;
                    });
                }

                ta.value = JSON.stringify(dataToExport, null, 2);
            }

            // --- RENDERING ---
            render() {
                const root = document.getElementById('viewport');
                root.innerHTML = this.buildTree(this.state, '');
            }

            buildReorderArrows(path, key, parentLength) {
                const { isArray, parent } = this.getParent(path);
                const isReorderable = isArray || (typeof parent === 'object' && !Array.isArray(parent) && path !== '');
                if (!isReorderable) return '';

                const length = isArray ? parentLength : Object.keys(parent).length; 
                const index = isArray ? parseInt(key) : Object.keys(parent).indexOf(key);
                if (index === -1) return ''; 

                const upDisabled = index === 0;
                const downDisabled = index === length - 1;

                return `
                    <div class="reorder-arrows">
                        <button onclick="app.moveUp('${this.safePath(path)}')" ${upDisabled ? 'disabled' : ''}><i class="fa-solid fa-angle-up"></i></button>
                        <button onclick="app.moveDown('${this.safePath(path)}')" ${downDisabled ? 'disabled' : ''}><i class="fa-solid fa-angle-down"></i></button>
                    </div>
                `;
            }

            buildTree(data, path, forceShow = false) {
                if (data === null) return `<span class="text-gray-600 italic">null</span>`;
                if (typeof data !== 'object') return this.buildPrimitive(data, path);

                const isArray = Array.isArray(data);
                let html = `<div class="w-full">`;

                Object.keys(data).forEach(key => {
                    if (key === '_meta_log') return; 
                    if (key === 'log_config') return; 
                    
                    const value = data[key];
                    
                    // SEARCH LOGIC:
                    const keyMatches = this.searchTerm && key.toLowerCase().includes(this.searchTerm);
                    const childMatches = this.searchTerm && this.hasMatch(value, this.searchTerm);
                    
                    // SHOW IF: 
                    // 1. No search active
                    // 2. Parent matched (forceShow)
                    // 3. Key matches directly
                    // 4. Children contain match
                    const isVisible = !this.searchTerm || forceShow || keyMatches || childMatches;
                    
                    if (!isVisible) return;

                    // FORCE EXPANSION IF:
                    // 1. Parent was forced (inherit)
                    // 2. This key matches directly (User typed "INVENTORY" -> Show all inventory)
                    const nextForceShow = forceShow || keyMatches;

                    const currentPath = path ? `${path}|${key}` : key;
                    const safeP = this.safePath(currentPath);
                    const isPrimitive = typeof value !== 'object' || value === null;
                    
                    let rowStyle = '';
                    if (typeof value === 'string') {
                        const match = value.match(/^(\d{1,3})%$/);
                        if (match) {
                            const pct = parseInt(match[1]);
                            rowStyle = `style="background: linear-gradient(to right, rgba(128,128,128,0.15) ${pct}%, transparent ${pct}%)"`;
                        }
                    }
                    
                    if (isPrimitive) {
                        html += `
                            <div class="node-row group hover:bg-[#0a0a0a]" ${rowStyle}>
                                <div class="flex-grow flex items-center mr-2"> 
                                    ${this.buildReorderArrows(currentPath, key, data.length)}
                                    ${this.buildKeyDisplay(key, safeP, isArray)}
                                    ${this.buildPrimitive(value, safeP, key)}
                                </div>
                                ${this.buildPrimitiveControls(safeP, isArray, key, data.length, value)}
                            </div>`;
                    } else {
                        // AUTO-EXPAND if searching OR forced
                        const isCollapsed = this.searchTerm ? false : this.collapsed.has(currentPath);
                        
                        html += `
                            <div class="mt-2 mb-1">
                                <div class="flex justify-between items-center bg-[#0a0a0a] px-2 py-1 border-b border-[#222] rounded-t">
                                    <div class="flex items-center">
                                        <button onclick="app.toggleCollapse('${safeP}')" class="mr-2 text-gray-500 hover:text-white w-4 text-center transition-transform">
                                            <i class="fa-solid fa-caret-${isCollapsed ? 'right' : 'down'}"></i>
                                        </button>
                                        ${this.buildReorderArrows(currentPath, key, data.length)}
                                        <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest transition cursor-pointer" onclick="app.toggleCollapse('${safeP}')">
                                            ${this.buildKeyDisplay(key, safeP, isArray, true)}
                                        </div>
                                    </div>
                                    <div class="flex gap-2 items-center">
                                        <button onclick="app.addItem('${safeP}', ${Array.isArray(value)})" class="text-green-700 hover:text-green-400 text-[10px]"><i class="fa-solid fa-plus"></i></button>
                                        <button onclick="app.deleteItem('${safeP}')" class="text-red-900 hover:text-red-500 text-[10px]"><i class="fa-solid fa-xmark"></i></button>
                                    </div>
                                </div>
                                <div class="tree-line ${isCollapsed ? 'hidden' : ''}">
                                    ${!isCollapsed ? this.buildTree(value, currentPath, nextForceShow) : ''}
                                </div>
                            </div>`;
                    }
                });
                
                const visibleKeys = Object.keys(data).filter(k => k !== '_meta_log' && k !== 'log_config');
                if (visibleKeys.length === 0 && !this.searchTerm) {
                    const safeP = this.safePath(path);
                    html += `<div class="text-[10px] text-gray-700 italic p-2 flex items-center">EMPTY <button onclick="app.addItem('${safeP}', ${isArray})" class="ml-2 text-green-700 hover:text-green-400"><i class="fa-solid fa-plus"></i></button></div>`;
                }

                html += `</div>`;
                return html;
            }
            
            buildKeyDisplay(key, path, isArray, isHeader = false) {
                if (isArray) return `<span class="text-green-800 font-bold mr-2 text-[10px]">[${key}]</span>`;
                const displayClass = isHeader ? 'text-gray-400 uppercase tracking-widest' : 'key-display uppercase';
                // HIGHLIGHT MATCH IN KEY
                if (this.searchTerm && key.toLowerCase().includes(this.searchTerm)) {
                    return `<span class="${displayClass} text-green-400 border-b border-green-500">${key}</span>`;
                }
                return `<span class="${displayClass}">${key}</span>`;
            }
            
            buildPrimitiveControls(safeP, isArray, key, arrayLength, val) {
                if (this.editingPath === safeP) return ''; 
                
                const vUpper = String(val).toUpperCase();
                const isSwitch = ['PENDING', 'IN PROGRESS', 'COMPLETED', 'ACTIVE', 'INACTIVE', 'TRUE', 'FALSE'].includes(vUpper) || typeof val === 'boolean';

                if (isSwitch) {
                     return `<div class="flex items-center gap-2 ml-2"><button onclick="app.deleteItem('${safeP}')" class="btn-action text-red-900 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button></div>`;
                }
                return ''; 
            }

            buildPrimitive(val, path, keyName) {
                const initialValue = typeof val === 'object' && val !== null ? JSON.stringify(val) : val;
                
                if (this.editingPath === path) {
                    const lineCount = String(initialValue).split('\n').length;
                    const rows = Math.max(3, lineCount + 1); 
                    const showClock = /timestamp/i.test(keyName);
                    
                    return `
                        <div class="flex items-start w-full gap-1">
                            <textarea id="input-${path}" class="edit-input" rows="${rows}" onkeydown="if(event.key==='Enter' && event.shiftKey) {event.preventDefault(); app.updateValue('${path}', this.value)}" >${initialValue}</textarea>
                            <div class="flex flex-col gap-1 mt-1">
                                <div class="flex items-center gap-1">
                                    <button onclick="app.updateValue('${path}', document.getElementById('input-${path}').value)" class="text-green-500 hover:bg-green-900/50 large-control-btn"><i class="fa-solid fa-check"></i></button>
                                    <button onclick="app.cancelEdit()" class="text-gray-500 hover:bg-gray-800 large-control-btn"><i class="fa-solid fa-ban"></i></button>
                                    ${showClock ? `<button onclick="app.injectTime('${path}')" class="text-blue-400 hover:bg-blue-900/30 large-control-btn" title="Inject Timestamp"><i class="fa-solid fa-clock"></i></button>` : ''}
                                </div>
                                <button onclick="app.deleteItem('${path}')" class="text-red-900 hover:text-red-500 text-[10px] p-1 mt-1 text-right"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        </div>
                    `; 
                }

                const percentMatch = String(val).match(/^(\d{1,3})%$/);
                if (percentMatch) {
                    return `
                        <div class="flex items-center">
                            <button class="stepper-btn" onclick="app.incrementPercent('${path}', -25)"><i class="fa-solid fa-angles-left"></i></button>
                            <button class="stepper-btn" onclick="app.incrementPercent('${path}', -5)"><i class="fa-solid fa-minus"></i></button>
                            <span class="val-display mono text-[#00ff9d] hover:underline mx-0 whitespace-nowrap min-w-[3rem] text-center flex-shrink-0" onclick="app.setEdit('${path}')">${val}</span>
                            <button class="stepper-btn" onclick="app.incrementPercent('${path}', 5)"><i class="fa-solid fa-plus"></i></button>
                            <button class="stepper-btn" onclick="app.incrementPercent('${path}', 25)"><i class="fa-solid fa-angles-right"></i></button>
                        </div>
                    `;
                }
                
                const vUpper = String(val).toUpperCase();
                if (['PENDING', 'IN PROGRESS', 'COMPLETED'].includes(vUpper)) {
                    return `
                    <div class="state-switch">
                        <div class="state-btn ${vUpper === 'PENDING' ? 'state-btn-active-pend' : ''}" onclick="app.updateValue('${path}', 'PENDING')">PEND</div>
                        <div class="state-btn ${vUpper === 'IN PROGRESS' ? 'state-btn-active-prog' : ''}" onclick="app.updateValue('${path}', 'IN PROGRESS')">PROG</div>
                        <div class="state-btn ${vUpper === 'COMPLETED' ? 'state-btn-active-comp' : ''}" onclick="app.updateValue('${path}', 'COMPLETED')">DONE</div>
                    </div>`;
                }
                
                if (['ACTIVE', 'INACTIVE'].includes(vUpper)) {
                    return `
                    <div class="state-switch">
                        <div class="state-btn ${vUpper === 'ACTIVE' ? 'state-btn-active-on' : ''}" onclick="app.updateValue('${path}', 'ACTIVE')">ACTIVE</div>
                        <div class="state-btn ${vUpper === 'INACTIVE' ? 'state-btn-active-off' : ''}" onclick="app.updateValue('${path}', 'INACTIVE')">INACTIVE</div>
                    </div>`;
                }
                
                if (['TRUE', 'FALSE'].includes(vUpper) || typeof val === 'boolean') {
                    const isTrue = vUpper === 'TRUE' || val === true;
                    return `
                    <div class="state-switch">
                        <div class="state-btn ${isTrue ? 'state-btn-active-on' : ''}" onclick="app.updateValue('${path}', 'TRUE')">TRUE</div>
                        <div class="state-btn ${!isTrue ? 'state-btn-active-off' : ''}" onclick="app.updateValue('${path}', 'FALSE')">FALSE</div>
                    </div>`;
                }
                
                if (typeof val === 'number') {
                     return `
                        <div class="flex items-center">
                            <button class="stepper-btn" onclick="app.incrementValue('${path}', -10)"><i class="fa-solid fa-angles-left"></i></button>
                            <button class="stepper-btn" onclick="app.incrementValue('${path}', -1)"><i class="fa-solid fa-minus"></i></button>
                            <span class="val-display mono text-green-400 hover:underline mx-0 whitespace-nowrap min-w-[3rem] text-center flex-shrink-0" onclick="app.setEdit('${path}')">${val}</span>
                            <button class="stepper-btn" onclick="app.incrementValue('${path}', 1)"><i class="fa-solid fa-plus"></i></button>
                            <button class="stepper-btn" onclick="app.incrementValue('${path}', 10)"><i class="fa-solid fa-angles-right"></i></button>
                        </div>
                     `;
                }
                
                const timeMatch = String(val).match(/^\d{1,2}:\d{2}$/);
                if (timeMatch) {
                    return `
                        <div class="flex items-center">
                            <button class="stepper-btn" onclick="app.incrementTime('${path}', -10)"><i class="fa-solid fa-angles-left"></i></button>
                            <button class="stepper-btn" onclick="app.incrementTime('${path}', -1)"><i class="fa-solid fa-minus"></i></button>
                            <span class="val-display mono text-blue-400 hover:underline mx-0 whitespace-nowrap min-w-[3rem] text-center flex-shrink-0" onclick="app.setEdit('${path}')">${val}</span>
                            <button class="stepper-btn" onclick="app.incrementTime('${path}', 1)"><i class="fa-solid fa-plus"></i></button>
                            <button class="stepper-btn" onclick="app.incrementTime('${path}', 10)"><i class="fa-solid fa-angles-right"></i></button>
                        </div>
                    `;
                }

                if (vUpper === 'CRITICAL') return `<span class="badge badge-critical cursor-pointer" onclick="app.setEdit('${path}')">CRITICAL</span>`;
                if (vUpper === 'HIGH') return `<span class="badge badge-high cursor-pointer" onclick="app.setEdit('${path}')">HIGH</span>`;
                if (vUpper === 'MEDIUM') return `<span class="badge badge-medium cursor-pointer" onclick="app.setEdit('${path}')">MEDIUM</span>`;
                if (vUpper === 'LOW') return `<span class="badge badge-low cursor-pointer" onclick="app.setEdit('${path}')">LOW</span>`;

                return `<span class="val-display mono text-green-400 hover:underline" onclick="app.setEdit('${path}')">${val}</span>`;
            }

            setEdit(path) { this.editingPath = path; this.render(); setTimeout(() => { const el = document.getElementById(`input-${path}`); if(el) { el.focus(); el.select(); } }, 50); }
            cancelEdit() { this.editingPath = null; this.render(); }
            
            toggleIO(mode) {
                const modal = document.getElementById('io-modal');
                const ta = document.getElementById('raw-json');
                const header = document.getElementById('modal-header');
                const copyBtn = document.getElementById('copy-btn');
                const loadBtn = document.getElementById('load-btn');
                const exportOption = document.getElementById('export-option-container');
                const exportCheck = document.getElementById('export-visible-check');

                if (modal.classList.contains('hidden')) {
                    if (mode === 'export') { 
                        exportOption.classList.remove('hidden'); 
                        exportCheck.checked = false; 
                        
                        this.updateExportPreview(); 
                        
                        ta.readOnly = true; 
                        header.textContent = 'DATA EXTRACTION'; 
                        ta.placeholder = '// COPY DATA STREAM BELOW //'; 
                        copyBtn.classList.remove('hidden'); 
                        loadBtn.classList.add('hidden'); 
                    }
                    else if (mode === 'import') { 
                        exportOption.classList.add('hidden'); 
                        
                        ta.value = ''; 
                        ta.readOnly = false; 
                        header.textContent = 'DATA INJECTION'; 
                        ta.placeholder = '// PASTE WORLD MODEL HERE //'; 
                        copyBtn.classList.add('hidden'); 
                        loadBtn.classList.remove('hidden'); 
                    }
                    modal.classList.remove('hidden');
                } else { 
                    modal.classList.add('hidden'); 
                    ta.readOnly = false; 
                    exportOption.classList.add('hidden');
                }
            }
            saveRaw() { 
                try { 
                    const ta = document.getElementById('raw-json'); 
                    let newState = JSON.parse(ta.value); 
                    if (newState._meta_log) {
                        newState._meta_log = newState._meta_log.map(log => {
                            log.a = log.a
                                .replace(/『ハイライト』/g, '<span class="log-hl">')
                                .replace(/『ホワイト』/g, '<span class="text-white">')
                                .replace(/『エンド』/g, '</span>')
                                .replace(/『改行』/g, '<br>')
                                .replace(/『トゥ』/g, '\u81f3'); 
                            return log;
                        });
                    }
                    this.state = newState; 
                    this.save(); 
                    this.toggleIO(); 
                } catch(e) { alert("SYNTAX ERROR: Invalid JSON."); } 
            }
            copyRaw() { const ta = document.getElementById('raw-json'); ta.select(); document.execCommand('copy'); const tempBtnText = document.getElementById('copy-btn').textContent; document.getElementById('copy-btn').textContent = 'COPIED!'; setTimeout(() => { document.getElementById('copy-btn').textContent = tempBtnText; }, 1000); }
        }
        const app = new ZyqralOS();
    </script>
</body>
</html>
