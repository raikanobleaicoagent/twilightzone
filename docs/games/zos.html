                this.save();
            return;
        }
        
        // Check for plain number
        const numMatch = String(content).match(/^-?\d+(?:\.\d+)?$/);
        if (numMatch) {
            let val = parseFloat(content);
            val += amount;
            // Round to avoid floating point errors
            val = Math.round(val * 1000) / 1000;
            // Apply clamp if present (preserves decimals, only clamps at boundaries)
            const clampConfig = this.parseClampConfig(oldValue);
            if (clampConfig) {
                val = Math.max(clampConfig.min, Math.min(clampConfig.max, val));
            }
            parent[key] = `${metaPrefix}${val}`;
            this.logGranular('MATH', pathStr, oldValue, parent[key]);
                this.save();
        }
    }
    
    // --- POMODORO TIMER METHODS ---
    startPomTimer(pathStr) {
        // Stop any existing timer for this path
        if (this._pomTimers[pathStr]) {
            clearInterval(this._pomTimers[pathStr]);
        }
        
        // Start new timer that ticks every second
        this._pomTimers[pathStr] = setInterval(() => {
            this.pomTickSilent(pathStr);
        }, 1000);
        
        // Re-render to show pause button
        this.render();
    }
    
    // Silent tick that doesn't disrupt text editing
    pomTickSilent(pathStr) {
        const { parent, key } = this.getParent(pathStr);
        if (!parent) return;
        
        const oldValue = parent[key];
        const metaPrefix = this.getMetaPrefix(oldValue);
        const content = this.stripMetaTags(oldValue);
        const intMatch = String(content).match(/^-?\d+$/);
        
        if (intMatch) {
            let val = parseInt(content);
            val += 1;
            parent[key] = `${metaPrefix}${val}`;
            
            // Save to localStorage WITHOUT triggering render
            localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
            
            // Update just the pom display element directly
            const safeId = pathStr.replace(/\|/g, '_');
            const displayEl = document.getElementById(`pom-val-${safeId}`);
            if (displayEl) {
                displayEl.textContent = val;
            }
            
            // Update all formula displays that might depend on this value
            this.updateFormulaDisplaysSilent();
        }
    }
    
    // Update all visible formula displays without full render
    updateFormulaDisplaysSilent() {
        const formulaSpans = document.querySelectorAll('[data-formula-path]');
        formulaSpans.forEach(span => {
            const path = span.getAttribute('data-formula-path');
            if (!path) return;
            
            // Get the current formula value from state
            const { parent, key } = this.getParent(path);
            if (!parent || parent[key] === undefined) return;
            
            const val = parent[key];
            const displayVal = this.stripMetaTags(val);
            
            if (typeof displayVal === 'string' && displayVal.startsWith('=')) {
                const processedVal = this.processFormula(displayVal, 0, path);
                // Escape to prevent >= ligature
                const escapedProcessed = String(processedVal).replace(/>/g, '&gt;').replace(/</g, '&lt;');
                span.innerHTML = escapedProcessed;
            }
        });
    }
    
    stopPomTimer(pathStr) {
        if (this._pomTimers[pathStr]) {
            clearInterval(this._pomTimers[pathStr]);
            delete this._pomTimers[pathStr];
        }
        this.render();
    }
    
    togglePomTimer(pathStr) {
        if (this._pomTimers[pathStr]) {
            this.stopPomTimer(pathStr);
        } else {
            this.startPomTimer(pathStr);
        }
    }
    
    resetPomTimer(pathStr) {
        if (!confirm('Reset timer to 0?')) return;
        
        // Stop timer if running
        if (this._pomTimers[pathStr]) {
            clearInterval(this._pomTimers[pathStr]);
            delete this._pomTimers[pathStr];
        }
        
        // Reset value to 0
        const { parent, key } = this.getParent(pathStr);
        if (!parent) return;
        const oldValue = parent[key];
        const metaPrefix = this.getMetaPrefix(oldValue);
        parent[key] = `${metaPrefix}0`;
        this.logGranular('RESET', pathStr, oldValue, parent[key]);
        this.save();
    }
    
    isPomRunning(pathStr) {
        return !!this._pomTimers[pathStr];
    }
    
    setRickPresent(pathStr, metaPrefix = '') {
        // First, set all other RICK PRESENT fields to FALSE
        const clearRickPresence = (obj, currentPath = '') => {
            for (let k in obj) {
                if (k === '_meta_log' || k === 'log_config' || k === '_mood_history' || k === 'export_config' || k === '_dly_reset_date') continue;
                const thisPath = currentPath ? `${currentPath}|${k}` : k;
                
                if (k.toUpperCase() === 'RICK' && typeof obj[k] === 'object' && obj[k] !== null) {
                    for (let subK in obj[k]) {
                        if (subK.toUpperCase() === 'PRESENT') {
                            const subPath = `${thisPath}|${subK}`;
                            // Don't clear the one we're setting
                            if (subPath !== pathStr) {
                                const oldVal = obj[k][subK];
                                const existingMeta = this.getMetaPrefix(oldVal);
                                obj[k][subK] = existingMeta + 'FALSE';
                            }
                        }
                    }
                }
                if (typeof obj[k] === 'object' && obj[k] !== null) {
                    clearRickPresence(obj[k], thisPath);
                }
            }
        };
        
        clearRickPresence(this.state);
        
        // Now set the target to TRUE
        this.updateValue(pathStr, metaPrefix + 'TRUE');
        this.addLog(`SYSTEM <span class="log-hl">[RICK LOCATION]</span> UPDATED`);
    }

    injectTime(pathStr) {
        const iso = this.getTimestamp();
        this.updateValue(pathStr, iso); 
    }

    deleteItem(pathStr) {
        if(!confirm('DESTROY NODE: Confirm?')) return;
        const { parent, key } = this.getParent(pathStr);
        if (!parent) return;
        const valToDelete = parent[key];
        let valLog = typeof valToDelete === 'object' ? '{OBJECT}' : valToDelete;
        if (Array.isArray(parent)) parent.splice(Number(key), 1);
        else delete parent[key];
        this.editingPath = null;
        if(this.pendingEdits[pathStr]) delete this.pendingEdits[pathStr];
        
        const p = this.formatPath(pathStr);
        this.addLog(`DELETE <span class="log-hl">[${p}]</span><br> VALUE: ${valLog}`);
        this.save();
    }

    addItem(pathStr, isArray) {
        const { parent, key } = this.getParent(pathStr);
        let target;
        if (pathStr === '') target = this.state;
        else target = key ? parent[key] : this.state;
        if (isArray) {
            const newVal = prompt("VALUE:");
            if (newVal === null) return;
            target.push(this.parseInput(newVal));
            const p = this.formatPath(pathStr);
            this.addLog(`ADD <span class="log-hl">[${p} > INDEX ${target.length-1}]</span><br> VALUE: ${newVal}`);
        } else {
            const newKey = prompt("FIELD NAME:");
            if (!newKey) return;
            const structureType = prompt(`Enter type for '${newKey}': (VALUE, OBJECT, or ARRAY)`);
            if (structureType === null) return;
            let newVal;
            let typeLog = "VALUE";
            if (structureType.toUpperCase() === 'OBJECT') { newVal = {}; typeLog = "{OBJECT}"; }
            else if (structureType.toUpperCase() === 'ARRAY') { newVal = []; typeLog = "[ARRAY]"; }
            else {
                const valuePrompt = prompt("VALUE:");
                if (valuePrompt === null) return;
                newVal = this.parseInput(valuePrompt);
                typeLog = newVal;
            }
            target[newKey] = newVal;
            const p = this.formatPath(pathStr);
            const separator = p ? ' > ' : '';
            this.addLog(`CREATE <span class="log-hl">[${p}${separator}${newKey}]</span><br> INITIAL: ${typeLog}`);
        }
        this.save();
    }
    
    renameKey(pathStr) {
        const { parent, key } = this.getParent(pathStr);
        if (!parent) return;
        
        // Don't allow renaming array indices
        if (Array.isArray(parent)) {
            alert('Cannot rename array indices');
            return;
        }
        
        const newKey = prompt(`Rename "${key}" to:`, key);
        if (!newKey || newKey === key) return;
        
        // Check if new key already exists
        if (parent.hasOwnProperty(newKey)) {
            alert(`Key "${newKey}" already exists`);
            return;
        }
        
        // Preserve key order by rebuilding the object
        const value = parent[key];
        const keys = Object.keys(parent);
        const index = keys.indexOf(key);
        
        // Create new object with renamed key in same position
        const newParent = {};
        keys.forEach((k, i) => {
            if (i === index) {
                newParent[newKey] = value;
            } else {
                newParent[k] = parent[k];
            }
        });
        
        // Replace parent contents
        Object.keys(parent).forEach(k => delete parent[k]);
        Object.keys(newParent).forEach(k => parent[k] = newParent[k]);
        
        // Update collapsed paths that start with old path
        const oldPath = pathStr;
        const pathParts = pathStr.split('|');
        pathParts[pathParts.length - 1] = newKey;
        const newPath = pathParts.join('|');
        
        // Update collapsed set
        const toUpdate = [];
        this.collapsed.forEach(p => {
            if (p === oldPath || p.startsWith(oldPath + '|')) {
                toUpdate.push({ old: p, new: p.replace(oldPath, newPath) });
            }
        });
        toUpdate.forEach(({ old: o, new: n }) => {
            this.collapsed.delete(o);
            this.collapsed.add(n);
        });
        this.saveUI();
        
        // Update locked paths
        const lockedToUpdate = [];
        this.lockedPaths.forEach(p => {
            if (p === oldPath || p.startsWith(oldPath + '|')) {
                lockedToUpdate.push({ old: p, new: p.replace(oldPath, newPath) });
            }
        });
        lockedToUpdate.forEach(({ old: o, new: n }) => {
            this.lockedPaths.delete(o);
            this.lockedPaths.add(n);
        });
        this.saveLockedPaths();
        
        this.addLog(`RENAME <span class="log-hl">[${this.formatPath(oldPath)}]</span> → <span class="log-hl">${newKey}</span>`);
        this.save();
    }
    
    safeEvaluate(input) {
        if (typeof input !== 'string') return input;
        
        // Check if this looks like a math expression
        const mathChars = /[+\-*/()]/;
        if (!mathChars.test(input)) return input;
        
        const cleanExpr = input.replace(/,/g, '').trim();
        
        // Allow: digits, operators, decimal points, parentheses, spaces, and negative numbers
        if (/[^0-9+\-*/.() ]/.test(cleanExpr)) return input;
        
        // Validate balanced parentheses
        let parenCount = 0;
        for (const char of cleanExpr) {
            if (char === '(') parenCount++;
            if (char === ')') parenCount--;
            if (parenCount < 0) return input; // More closing than opening
        }
        if (parenCount !== 0) return input; // Unbalanced
        
        try {
            const result = new Function('return ' + cleanExpr)();
            if (!isFinite(result)) return input;
            const rounded = Math.round(result * 100) / 100;
            return rounded;
        } catch(e) { return input; }
    }

    parseInput(input) {
        if (typeof input === 'string' && input.startsWith('=')) return input;
        let val = this.safeEvaluate(input);
        if (typeof val === 'string') {
            const vUpper = val.toUpperCase();
            if (!isNaN(Number(val)) && val.trim() !== '') val = Number(val);
            else if (vUpper === 'TRUE') val = 'TRUE';
            else if (vUpper === 'FALSE') val = 'FALSE';
        }
        return val;
    }
    
    toggleCollapse(path) {
        if (this.collapsed.has(path)) this.collapsed.delete(path);
        else this.collapsed.add(path);
        this.saveUI(); 
        this.render();
    }
    
    filterVisible(data, path = '') {
        if (data === null || typeof data !== 'object') return data;
        const isArray = Array.isArray(data);
        const result = isArray ? [] : {};
        Object.keys(data).forEach(key => {
            if (key === '_meta_log' || key === 'log_config' || key === '_mood_history' || key === 'export_config' || key === '_dly_reset_date') return;
            const value = data[key];
            const currentPath = path ? `${path}|${key}` : key;
            const isCollapsed = this.collapsed.has(currentPath);
            const isSearchActive = this.searchTerm.length > 0;
            // Completely exclude minimized objects/arrays when visible filter is on
            if (isCollapsed && !isSearchActive) {
                if (typeof value === 'object' && value !== null) {
                    // Skip this key entirely - don't add to result
                    return;
                } else {
                    result[key] = value;
                }
            } else {
                result[key] = this.filterVisible(value, currentPath);
            }
        });
        return result;
    }
    
    updateExportConfig() {
        const visibleCheck = document.getElementById('export-visible-check');
        const logsCheck = document.getElementById('export-logs-check');
        const metadataCheck = document.getElementById('export-metadata-check');
        const formulasCheck = document.getElementById('export-formulas-check');
        const moodCheck = document.getElementById('export-mood-check');
        if(!this.state.export_config) this.state.export_config = { visible_only: false, include_logs: true, include_metadata: true, include_formulas: false, include_mood: false };
        this.state.export_config.visible_only = visibleCheck.checked;
        this.state.export_config.include_logs = logsCheck.checked;
        this.state.export_config.include_metadata = metadataCheck.checked;
        this.state.export_config.include_formulas = formulasCheck.checked;
        this.state.export_config.include_mood = moodCheck.checked;
        this.includeDV = moodCheck.checked;
        this.save();
        this.updateExportPreview();
    }

    // Recursively scrub metadata tags from all string values in an object
    scrubMetadataFromObject(obj) {
        if (typeof obj !== 'object' || obj === null) {
            if (typeof obj === 'string') {
                return this.stripMetaTags(obj);
            }
            return obj;
        }
        
        if (Array.isArray(obj)) {
            return obj.map(item => this.scrubMetadataFromObject(item));
        }
        
        const result = {};
        for (const key of Object.keys(obj)) {
            result[key] = this.scrubMetadataFromObject(obj[key]);
        }
        return result;
    }
    
    // Recursively calculate all formulas in an object
    calculateFormulasInObject(obj, path = '') {
        if (typeof obj !== 'object' || obj === null) {
            if (typeof obj === 'string') {
                const stripped = this.stripMetaTags(obj);
                if (stripped.startsWith('=')) {
                    // Temporarily set flag to prevent side effects during export calculation
                    const wasExporting = this._exportingFormulas;
                    this._exportingFormulas = true;
                    try {
                        const result = this.processFormula(stripped, 0, path);
                        // Keep metadata prefix but replace formula with result
                        const metaPrefix = this.getMetaPrefix(obj);
                        return metaPrefix + String(result);
                    } finally {
                        this._exportingFormulas = wasExporting;
                    }
                }
            }
            return obj;
        }
        
        if (Array.isArray(obj)) {
            return obj.map((item, idx) => this.calculateFormulasInObject(item, path ? `${path}|${idx}` : String(idx)));
        }
        
        const result = {};
        for (const key of Object.keys(obj)) {
            const currentPath = path ? `${path}|${key}` : key;
            result[key] = this.calculateFormulasInObject(obj[key], currentPath);
        }
        return result;
    }

    updateExportPreview() {
        try {
        const ta = document.getElementById('raw-json');
        const visibleCheck = document.getElementById('export-visible-check');
        const logsCheck = document.getElementById('export-logs-check');
        const metadataCheck = document.getElementById('export-metadata-check');
        const formulasCheck = document.getElementById('export-formulas-check');
        const moodCheck = document.getElementById('export-mood-check');
        
        let dataToExport;
        if (visibleCheck && visibleCheck.checked) {
            dataToExport = this.filterVisible(this.state);
        } else {
            dataToExport = JSON.parse(JSON.stringify(this.state));
        }
        
        // Calculate formulas if checkbox is unchecked (keep formulas raw if checked)
        if (formulasCheck && !formulasCheck.checked) {
            try {
                dataToExport = this.calculateFormulasInObject(dataToExport);
            } catch (e) {
                console.error('Formula calculation error:', e);
            }
        }

        // Scrub metadata if checkbox is unchecked
        if (metadataCheck && !metadataCheck.checked) {
            dataToExport = this.scrubMetadataFromObject(dataToExport);
        }

        if (logsCheck && logsCheck.checked) {
            const fullLogs = this.state._meta_log || [];
            dataToExport._meta_log = fullLogs.map(log => {
                if (!log || !log.a) return { t: log?.t || '', a: '' };
                let cleanText = log.a.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').replace(/\u81f3/g, '至');
                return { t: log.t, a: cleanText };
            });
        } else {
            delete dataToExport._meta_log;
        }

        if (!moodCheck || !moodCheck.checked) {
            delete dataToExport._mood_history;
        } else {
            dataToExport._mood_history = this.state._mood_history || [];
        }
        
        
        delete dataToExport.export_config; 
        if(dataToExport.log_config) delete dataToExport.log_config.chart_limit;

        ta.value = JSON.stringify(dataToExport, null, 2);
        } catch (e) {
            console.error('Export preview error:', e);
            const ta = document.getElementById('raw-json');
            if (ta) ta.value = '{"error": "Export preview failed"}';
        }
    }

    render() {
        const root = document.getElementById('viewport');
        root.innerHTML = this.buildTree(this.state, '');
    }
    
    buildReorderArrows(path, key, parentLength) {
        const { isArray, parent } = this.getParent(path);
        const isReorderable = isArray || (typeof parent === 'object' && !Array.isArray(parent) && path !== '');
        if (!isReorderable) return '';
        const length = isArray ? parentLength : Object.keys(parent).length; 
        const index = isArray ? parseInt(key) : Object.keys(parent).indexOf(key);
        if (index === -1) return ''; 
        const upDisabled = index === 0;
        const downDisabled = index === length - 1;
        return `<div class="reorder-arrows"><button onclick="app.moveUp('${this.safePath(path)}')" ${upDisabled ? 'disabled' : ''}><i class="fa-solid fa-angle-up"></i></button><button onclick="app.moveDown('${this.safePath(path)}')" ${downDisabled ? 'disabled' : ''}><i class="fa-solid fa-angle-down"></i></button></div>`;
    }

    buildTree(data, path, forceShow = false) {
        if (data === null) return `<span class="text-gray-600 italic">null</span>`;
        if (typeof data !== 'object') return this.buildPrimitive(data, path);
        const isArray = Array.isArray(data);
        let html = `<div class="w-full">`;
        Object.keys(data).forEach(key => {
            if (key === '_meta_log' || key === 'log_config' || key === '_mood_history' || key === 'export_config' || key === '_dly_reset_date') return; 
            const value = data[key];
            const keyMatches = this.searchTerm && key.toLowerCase().includes(this.searchTerm);
            const childMatches = this.searchTerm && this.hasMatch(value, this.searchTerm);
            const isVisible = !this.searchTerm || forceShow || keyMatches || childMatches;
            if (!isVisible) return;
            const nextForceShow = forceShow || keyMatches;
            const currentPath = path ? `${path}|${key}` : key;
            const safeP = this.safePath(currentPath);
            const isPrimitive = typeof value !== 'object' || value === null;
            let rowStyle = '';
            if (isPrimitive) {
                html += `<div class="node-row group hover:bg-[#0a0a0a]" ${rowStyle}><div class="flex-grow flex items-center mr-2"> ${this.buildReorderArrows(currentPath, key, data.length)}${this.buildKeyDisplay(key, safeP, isArray)}${this.buildPrimitive(value, safeP, key)}</div>${this.buildPrimitiveControls(safeP, isArray, key, data.length, value)}</div>`;
            } else {
                const isCollapsed = this.searchTerm ? false : this.collapsed.has(currentPath);
                html += `<div class="mt-2 mb-1"><div class="flex justify-between items-center bg-[#0a0a0a] px-2 py-1 border-b border-[#222] rounded-t"><div class="flex items-center"><button onclick="app.toggleCollapse('${safeP}')" class="mr-2 text-gray-500 hover:text-white w-4 text-center transition-transform"><i class="fa-solid fa-caret-${isCollapsed ? 'right' : 'down'}"></i></button>${this.buildReorderArrows(currentPath, key, data.length)}<div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest transition cursor-pointer" onclick="app.toggleCollapse('${safeP}')">${this.buildKeyDisplay(key, safeP, isArray, true)}</div></div><div class="flex gap-2 items-center"><button onclick="app.renameKey('${safeP}')" class="text-gray-700 hover:text-gray-400 text-[10px]" title="Rename"><i class="fa-solid fa-pen"></i></button><button onclick="app.openTemplatePanel('${safeP}')" class="text-gray-700 hover:text-gray-400 text-[10px]" title="Templates"><i class="fa-solid fa-bookmark"></i></button><button onclick="app.addItem('${safeP}', ${Array.isArray(value)})" class="text-green-700 hover:text-green-400 text-[10px]"><i class="fa-solid fa-plus"></i></button><button onclick="app.deleteItem('${safeP}')" class="text-red-900 hover:text-red-500 text-[10px]"><i class="fa-solid fa-xmark"></i></button></div></div><div class="tree-line ${isCollapsed ? 'hidden' : ''}">${!isCollapsed ? this.buildTree(value, currentPath, nextForceShow) : ''}</div></div>`;
            }
        });
        const visibleKeys = Object.keys(data).filter(k => k !== '_meta_log' && k !== 'log_config' && k !== '_mood_history' && k !== 'export_config' && k !== '_dly_reset_date');
        if (visibleKeys.length === 0 && !this.searchTerm) {
            const safeP = this.safePath(path);
            html += `<div class="text-[10px] text-gray-700 italic p-2 flex items-center">EMPTY <button onclick="app.addItem('${safeP}', ${isArray})" class="ml-2 text-green-700 hover:text-green-400"><i class="fa-solid fa-plus"></i></button></div>`;
        }
        html += `</div>`;
        return html;
    }

    buildKeyDisplay(key, path, isArray, isHeader = false) {
        if (isArray) return `<span class="text-green-800 font-bold mr-2 text-[10px]">[${key}]</span>`;
        const displayClass = isHeader ? 'text-gray-400 uppercase tracking-widest' : 'key-display uppercase';
        if (this.searchTerm && key.toLowerCase().includes(this.searchTerm)) {
            return `<span class="${displayClass} text-green-400 border-b border-green-500">${key}</span>`;
        }
        return `<span class="${displayClass}">${key}</span>`;
    }

    buildPrimitiveControls(safeP, isArray, key, arrayLength, val) {
        if (this.editingPath === safeP) return ''; 
        const vUpper = String(this.stripMetaTags(val)).toUpperCase();
        const isSwitch = ['PENDING', 'IN PROGRESS', 'COMPLETED', 'ACTIVE', 'INACTIVE', 'TRUE', 'FALSE', 'FAILED', 'NOBODY', 'RICK', 'TRIBE MEMBER', 'TRIBE', 'BASELINE', 'COME UP', 'PLATEAU', 'COME DOWN', 'FASTING', 'RISING', 'STABLE', 'FALLING'].includes(vUpper) || typeof val === 'boolean';
        const hasOptions = this.parseOptionsConfig(val) !== null;
        if (isSwitch || hasOptions) {
                return `<div class="flex items-center gap-2 ml-2"><button onclick="app.deleteItem('${safeP}')" class="btn-action text-red-900 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button></div>`;
        }
        // Show lock icon for non-switch values
        const isLocked = this.isLocked(safeP);
        const lockIcon = isLocked ? 'fa-lock' : 'fa-lock-open';
        const lockColor = isLocked ? 'text-yellow-600 hover:text-yellow-400' : 'text-gray-700 hover:text-gray-400';
        return `<div class="flex items-center gap-2 ml-2"><button onclick="app.toggleLock('${safeP}')" class="btn-action ${lockColor}" title="${isLocked ? 'Unlock' : 'Lock'}"><i class="fa-solid ${lockIcon}"></i></button></div>`;
    }

    // --- METADATA TAG SYSTEM ---
    // Extract metadata tags like <rst>, <lock>, etc. from a value
    extractMetaTags(val) {
        if (typeof val !== 'string') return { tags: [], content: val };
        const tagRegex = /<([a-zA-Z_][a-zA-Z0-9_]*)>/g;
        const tags = [];
        let match;
        while ((match = tagRegex.exec(val)) !== null) {
            tags.push(match[1].toLowerCase());
        }
        const content = val.replace(tagRegex, '').trim();
        return { tags, content };
    }
    
    // Strip metadata tags from value for display
    stripMetaTags(val) {
        if (typeof val !== 'string') return val;
        // Strip stepper tags, options tags, rst tags, prio tags, color tags, pct tags, pctinv tags, clamp tags, then regular tags
        return val.replace(/<stepper:[^>]+>/gi, '').replace(/<options:[^>]+>/gi, '').replace(/<rst:[^>]+>/gi, '').replace(/<prio:[^>]+>/gi, '').replace(/<color:[^>]+>/gi, '').replace(/<pct:[^>]+>/gi, '').replace(/<pctinv:[^>]+>/gi, '').replace(/<clamp:[^>]+>/gi, '').replace(/<([a-zA-Z_][a-zA-Z0-9_]*)>/g, '').trim();
    }
    
    // Get just the metadata prefix from a value (including stepper, options, rst, prio, color, pct, pctinv, and clamp tags)
    getMetaPrefix(val) {
        if (typeof val !== 'string') return '';
        // Match regular tags, stepper tags, options tags, rst tags, prio tags, color tags, pct tags, pctinv tags, and clamp tags
        const regularTags = val.match(/<([a-zA-Z_][a-zA-Z0-9_]*)>/g) || [];
        const stepperTags = val.match(/<stepper:[^>]+>/gi) || [];
        const optionsTags = val.match(/<options:[^>]+>/gi) || [];
        const rstTags = val.match(/<rst:[^>]+>/gi) || [];
        const prioTags = val.match(/<prio:[^>]+>/gi) || [];
        const colorTags = val.match(/<color:[^>]+>/gi) || [];
        const pctTags = val.match(/<pct:[^>]+>/gi) || [];
        const pctInvTags = val.match(/<pctinv:[^>]+>/gi) || [];
        const clampTags = val.match(/<clamp:[^>]+>/gi) || [];
        return [...regularTags, ...stepperTags, ...optionsTags, ...rstTags, ...prioTags, ...colorTags, ...pctTags, ...pctInvTags, ...clampTags].join('');
    }
    
    // Check if value has a specific tag
    hasMetaTag(val, tagName) {
        const { tags } = this.extractMetaTags(val);
        return tags.includes(tagName.toLowerCase());
    }

    // Parse stepper configuration from <stepper:...> tag
    // Format: <stepper:-5@--,-1@-,+1@+,+5@++>
    parseStepperConfig(val) {
        if (typeof val !== 'string') return null;
        const stepperMatch = val.match(/<stepper:([^>]+)>/i);
        if (!stepperMatch) return null;
        
        const configStr = stepperMatch[1];
        const buttons = [];
        const parts = configStr.split(',');
        
        for (const part of parts) {
            const [deltaStr, symbol] = part.trim().split('@');
            if (deltaStr && symbol) {
                const delta = parseFloat(deltaStr);
                if (!isNaN(delta)) {
                    buttons.push({ delta, symbol: symbol.trim() });
                }
            }
        }
        
        // Sort by delta so negative values are on left, positive on right
        buttons.sort((a, b) => a.delta - b.delta);
        return buttons.length > 0 ? buttons : null;
    }
    
    // Strip stepper tag (with content) from value
    stripStepperTag(val) {
        if (typeof val !== 'string') return val;
        return val.replace(/<stepper:[^>]+>/gi, '').trim();
    }
    
    // Get meta prefix excluding stepper tag
    getMetaPrefixWithoutStepper(val) {
        if (typeof val !== 'string') return '';
        // First get all tags, then filter out stepper
        const tagRegex = /<([a-zA-Z_][a-zA-Z0-9_]*)>/g;
        const matches = val.match(tagRegex);
        return matches ? matches.join('') : '';
    }
    
    // Parse options configuration from <options:...> tag
    // Format: <options:value1@label1,value2@label2,value3@label3>
    parseOptionsConfig(val) {
        if (typeof val !== 'string') return null;
        const optionsMatch = val.match(/<options:([^>]+)>/i);
        if (!optionsMatch) return null;
        
        const configStr = optionsMatch[1];
        const options = [];
        const parts = configStr.split(',');
        
        for (const part of parts) {
            const atIndex = part.indexOf('@');
            if (atIndex > 0) {
                const value = part.substring(0, atIndex).trim();
                const label = part.substring(atIndex + 1).trim();
                if (value !== undefined && label) {
                    options.push({ label, value });
                }
            }
        }
        
        return options.length > 0 ? options : null;
    }
    
    // Build custom options toggle from config
    buildOptionsToggle(path, optionsConfig, currentValue, metaPrefix) {
        let html = '<div class="state-switch">';
        
        for (const opt of optionsConfig) {
            const isSelected = currentValue === opt.value;
            const activeClass = isSelected ? 'state-btn-active-custom' : '';
            const escapedLabel = this.escapeHtml(opt.label);
            const escapedValue = opt.value.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            html += `<div class="state-btn ${activeClass}" onclick="app.updateValue('${path}', '${metaPrefix}${escapedValue}')">${escapedLabel}</div>`;
        }
        
        html += '</div>';
        return html;
    }
    
    // Parse rst configuration from <rst:value> tag
    // Format: <rst:0> or <rst:00:00> or <rst:default text>
    parseRstConfig(val) {
        if (typeof val !== 'string') return null;
        const rstMatch = val.match(/<rst:([^>]*)>/i);
        if (!rstMatch) return null;
        return rstMatch[1]; // Return the reset value
    }
    
    // Reset value to the specified default while preserving metadata
    resetToValue(pathStr, resetValue) {
        const { parent, key } = this.getParent(pathStr);
        if (!parent) return;
        const oldValue = parent[key];
        const metaPrefix = this.getMetaPrefix(oldValue);
        parent[key] = `${metaPrefix}${resetValue}`;
        this.logGranular('RESET', pathStr, oldValue, parent[key]);
        this.save();
        this.render();
    }
    
    // Build reset button if rst tag is present
    buildResetButton(path, val) {
        const resetValue = this.parseRstConfig(val);
        if (resetValue === null) return '';
        const escapedValue = resetValue.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        return `<button class="stepper-btn ml-0.5" onclick="app.resetToValue('${path}', '${escapedValue}')" title="Reset to ${this.escapeHtml(resetValue)}"><i class="fa-solid fa-rotate-left"></i></button>`;
    }
    
    // Parse priority configuration from <prio:#hexcolor> tag
    // Format: <prio:#ff0055> or <prio:#00aaff>
    parsePrioConfig(val) {
        if (typeof val !== 'string') return null;
        const prioMatch = val.match(/<prio:(#[0-9a-fA-F]{6})>/i);
        if (!prioMatch) return null;
        return prioMatch[1]; // Return the hex color
    }
    
    // Darken a hex color by a percentage (0-1)
    darkenColor(hex, amount) {
        let r = parseInt(hex.slice(1, 3), 16);
        let g = parseInt(hex.slice(3, 5), 16);
        let b = parseInt(hex.slice(5, 7), 16);
        r = Math.max(0, Math.floor(r * (1 - amount)));
        g = Math.max(0, Math.floor(g * (1 - amount)));
        b = Math.max(0, Math.floor(b * (1 - amount)));
        return `rgb(${r}, ${g}, ${b})`;
    }
    
    // Parse color configuration from <color:#hexcolor> tag
    // Format: <color:#ff0055> or <color:#00aaff>
    parseColorConfig(val) {
        if (typeof val !== 'string') return null;
        const colorMatch = val.match(/<color:(#[0-9a-fA-F]{6})>/i);
        if (!colorMatch) return null;
        return colorMatch[1]; // Return the hex color
    }
    
    // Parse percentage range configuration from <pct:min:max> tag
    // Format: <pct:0:100> or <pct:0:12>
    // Returns { min, max } or null
    parsePctConfig(val) {
        if (typeof val !== 'string') return null;
        const pctMatch = val.match(/<pct:(-?\d+(?:\.\d+)?):(-?\d+(?:\.\d+)?)>/i);
        if (!pctMatch) return null;
        return { 
            min: parseFloat(pctMatch[1]), 
            max: parseFloat(pctMatch[2]) 
        };
    }
    
    // Parse inverted percentage range configuration from <pctinv:min:max> tag
    // Format: <pctinv:0:100> - green at 0%, red at 100%
    // Returns { min, max } or null
    parsePctInvConfig(val) {
        if (typeof val !== 'string') return null;
        const pctMatch = val.match(/<pctinv:(-?\d+(?:\.\d+)?):(-?\d+(?:\.\d+)?)>/i);
        if (!pctMatch) return null;
        return { 
            min: parseFloat(pctMatch[1]), 
            max: parseFloat(pctMatch[2]) 
        };
    }
    
    // Parse clamp configuration from <clamp:min:max> tag
    // Format: <clamp:-10:10> or <clamp:0:100> or <clamp:0:99.9>
    // Clamps value between min and max, preserves decimals until boundary
    // Returns { min, max } or null
    parseClampConfig(val) {
        if (typeof val !== 'string') return null;
        const clampMatch = val.match(/<clamp:(-?\d+(?:\.\d+)?):(-?\d+(?:\.\d+)?)>/i);
        if (!clampMatch) return null;
        return { 
            min: parseFloat(clampMatch[1]), 
            max: parseFloat(clampMatch[2])
        };
    }
    
    // Build a value display with percentage bar background
    // currentVal: the numeric value
    // pctConfig: { min, max }
    // displayText: what to show in the span
    // path: for onclick
    // colorClass: CSS color class or hex
    // inverted: if true, green at low values, red at high values
    buildPctBar(path, currentVal, pctConfig, displayText, colorClass, originalVal, inverted = false) {
        const { min, max } = pctConfig;
        const range = max - min;
        const percent = range > 0 ? Math.max(0, Math.min(100, ((currentVal - min) / range) * 100)) : 0;
        
        // Determine bar color based on percentage
        let barColor;
        const isLightMode = document.body.classList.contains('theme-light');
        
        if (inverted) {
            // Inverted: green at low, red at high
            if (percent <= 25) {
                barColor = isLightMode ? 'rgba(34, 197, 94, 0.3)' : 'rgba(0, 255, 157, 0.25)'; // green
            } else if (percent <= 50) {
                barColor = isLightMode ? 'rgba(234, 179, 8, 0.3)' : 'rgba(255, 187, 0, 0.25)'; // yellow
            } else if (percent <= 75) {
                barColor = isLightMode ? 'rgba(249, 115, 22, 0.3)' : 'rgba(255, 136, 0, 0.25)'; // orange
            } else {
                barColor = isLightMode ? 'rgba(239, 68, 68, 0.3)' : 'rgba(255, 0, 85, 0.25)'; // red
            }
        } else {
            // Normal: green at high, red at low
            if (percent >= 75) {
                barColor = isLightMode ? 'rgba(34, 197, 94, 0.3)' : 'rgba(0, 255, 157, 0.25)'; // green
            } else if (percent >= 50) {
                barColor = isLightMode ? 'rgba(234, 179, 8, 0.3)' : 'rgba(255, 187, 0, 0.25)'; // yellow
            } else if (percent >= 25) {
                barColor = isLightMode ? 'rgba(249, 115, 22, 0.3)' : 'rgba(255, 136, 0, 0.25)'; // orange
            } else {
                barColor = isLightMode ? 'rgba(239, 68, 68, 0.3)' : 'rgba(255, 0, 85, 0.25)'; // red
            }
        }
        
        const bgStyle = `background: linear-gradient(to right, ${barColor} ${percent}%, transparent ${percent}%); padding: 2px 6px; border-radius: 3px;`;
        
        // Check if steppers are needed
        const stepperConfig = this.parseStepperConfig(originalVal);
        if (stepperConfig) {
            return this.buildPctStepperButtons(path, stepperConfig, currentVal, pctConfig, displayText, colorClass, originalVal, bgStyle);
        }
        
        const resetBtn = this.buildResetButton(path, originalVal);
        const colorStyle = colorClass.startsWith('#') ? `style="color: ${colorClass}; ${bgStyle}"` : `style="${bgStyle}"`;
        const classAttr = colorClass.startsWith('#') ? 'val-display mono hover:underline' : `val-display mono ${colorClass} hover:underline`;
        
        return `<div class="flex items-center"><span class="${classAttr}" ${colorStyle} onclick="app.setEdit('${path}')">${displayText}</span>${resetBtn}</div>`;
    }
    
    // Build stepper buttons with percentage bar background
    buildPctStepperButtons(path, stepperConfig, currentVal, pctConfig, displayText, colorStyle, originalVal, bgStyle) {
        const leftButtons = stepperConfig.filter(b => b.delta < 0);
        const rightButtons = stepperConfig.filter(b => b.delta >= 0);
        
        let html = '<div class="flex items-center">';
        
        // Left buttons (negative deltas)
        for (const btn of leftButtons) {
            html += `<button class="stepper-btn" onclick="app.incrementMetaValue('${path}', ${btn.delta})">${this.escapeHtml(btn.symbol)}</button>`;
        }
        
        // Value display with percentage bar background
        if (colorStyle.startsWith('#')) {
            html += `<span class="val-display mono hover:underline mx-0 whitespace-nowrap min-w-[3rem] text-center flex-shrink-0" style="color: ${colorStyle}; ${bgStyle}" onclick="app.setEdit('${path}')">${displayText}</span>`;
        } else {
            html += `<span class="val-display mono ${colorStyle} hover:underline mx-0 whitespace-nowrap min-w-[3rem] text-center flex-shrink-0" style="${bgStyle}" onclick="app.setEdit('${path}')">${displayText}</span>`;
        }
        
        // Right buttons (positive deltas)
        for (const btn of rightButtons) {
            html += `<button class="stepper-btn" onclick="app.incrementMetaValue('${path}', ${btn.delta})">${this.escapeHtml(btn.symbol)}</button>`;
        }
        
        // Reset button if rst tag present
        html += this.buildResetButton(path, originalVal);
        
        html += '</div>';
        return html;
    }
    
    // Build a percentage bar for formula results (read-only, no steppers)
    buildFormulaPctBar(path, currentVal, pctConfig, displayText, colorStyle, escapedFormula) {
        const { min, max } = pctConfig;
        const range = max - min;
        const percent = range > 0 ? Math.max(0, Math.min(100, ((currentVal - min) / range) * 100)) : 0;
        
        // Determine bar color based on percentage
        let barColor;
        if (percent >= 75) {
            barColor = 'rgba(0, 255, 157, 0.25)'; // green
        } else if (percent >= 50) {
            barColor = 'rgba(255, 187, 0, 0.25)'; // yellow
        } else if (percent >= 25) {
            barColor = 'rgba(255, 136, 0, 0.25)'; // orange
        } else {
            barColor = 'rgba(255, 0, 85, 0.25)'; // red
        }
        
        // Light mode colors
        const isLightMode = document.body.classList.contains('theme-light');
        if (isLightMode) {
            if (percent >= 75) {
                barColor = 'rgba(34, 197, 94, 0.3)'; // green
            } else if (percent >= 50) {
                barColor = 'rgba(234, 179, 8, 0.3)'; // yellow
            } else if (percent >= 25) {
                barColor = 'rgba(249, 115, 22, 0.3)'; // orange
            } else {
                barColor = 'rgba(239, 68, 68, 0.3)'; // red
            }
        }
        
        const bgStyle = `background: linear-gradient(to right, ${barColor} ${percent}%, transparent ${percent}%); padding: 2px 6px; border-radius: 3px;`;
        
        if (colorStyle.startsWith('#')) {
            return `<span class="val-display mono hover:underline" style="color: ${colorStyle}; ${bgStyle}" onclick="app.setEdit('${path}')" title="${escapedFormula}">${displayText}</span>`;
        } else {
            return `<span class="val-display mono ${colorStyle} hover:underline" style="${bgStyle}" onclick="app.setEdit('${path}')" title="${escapedFormula}">${displayText}</span>`;
        }
    }
    
    // Build priority badge with dynamic colors
    buildPrioBadge(path, displayVal, hexColor) {
        const textColor = hexColor;
        const bgColor = this.darkenColor(hexColor, 0.8); // 80% darker for background
        const borderColor = this.darkenColor(hexColor, 0.6); // 60% darker for border
        return `<span class="badge cursor-pointer" style="background: ${bgColor}; color: ${textColor}; border: 1px solid ${borderColor};" onclick="app.setEdit('${path}')">${displayVal}</span>`;
    }
    
    // Build stepper buttons from config
    buildStepperButtons(path, stepperConfig, incrementFn, displayVal, colorStyle, originalVal) {
        const leftButtons = stepperConfig.filter(b => b.delta < 0);
        const rightButtons = stepperConfig.filter(b => b.delta >= 0);
        
        let html = '<div class="flex items-center">';
        
        // Left buttons (negative deltas)
        for (const btn of leftButtons) {
            html += `<button class="stepper-btn" onclick="app.${incrementFn}('${path}', ${btn.delta})">${this.escapeHtml(btn.symbol)}</button>`;
        }
        
        // Value display - colorStyle can be a class or inline style
        const styleAttr = colorStyle.startsWith('#') ? `style="color: ${colorStyle}"` : `class="val-display mono ${colorStyle} hover:underline mx-0 whitespace-nowrap min-w-[3rem] text-center flex-shrink-0"`;
        const classAttr = colorStyle.startsWith('#') ? 'class="val-display mono hover:underline mx-0 whitespace-nowrap min-w-[3rem] text-center flex-shrink-0"' : '';
        if (colorStyle.startsWith('#')) {
            html += `<span class="val-display mono hover:underline mx-0 whitespace-nowrap min-w-[3rem] text-center flex-shrink-0" style="color: ${colorStyle}" onclick="app.setEdit('${path}')">${displayVal}</span>`;
        } else {
            html += `<span class="val-display mono ${colorStyle} hover:underline mx-0 whitespace-nowrap min-w-[3rem] text-center flex-shrink-0" onclick="app.setEdit('${path}')">${displayVal}</span>`;
        }
        
        // Right buttons (positive deltas)
        for (const btn of rightButtons) {
            html += `<button class="stepper-btn" onclick="app.${incrementFn}('${path}', ${btn.delta})">${this.escapeHtml(btn.symbol)}</button>`;
        }
        
        // Reset button if rst tag present
        html += this.buildResetButton(path, originalVal);
        
        html += '</div>';
        return html;
    }
    
    // Helper to escape HTML in button symbols
    escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    buildPrimitive(val, path, keyName) {
        const initialValue = typeof val === 'object' && val !== null ? JSON.stringify(val) : val;
        
        // Extract metadata for display purposes
        const metaPrefix = this.getMetaPrefix(val);
        const displayVal = this.stripMetaTags(val);
        const hasMeta = metaPrefix.length > 0;
        
        if (this.editingPath === path) {
            const lineCount = String(initialValue).split('\n').length;
            const rows = Math.max(3, lineCount + 1); 
            const showClock = /timestamp/i.test(keyName);
            const safep = this.safePath(path);
            // Only escape </textarea to prevent breaking out, preserve other characters
            const safeInitial = String(initialValue).replace(/<\/textarea/gi, '&lt;/textarea');
            return `<div class="flex items-start w-full gap-1"><textarea id="input-${safep}" class="edit-input" rows="${rows}" onkeydown="if(event.key==='Enter' && event.shiftKey) {event.preventDefault(); app.updateValue('${safep}', this.value)}" >${safeInitial}</textarea><div class="flex flex-col gap-1 mt-1"><div class="flex items-center gap-1"><button onclick="app.updateValue('${safep}', document.getElementById('input-${safep}').value)" class="text-green-500 hover:bg-green-900/50 large-control-btn"><i class="fa-solid fa-check"></i></button><button onclick="app.cancelEdit()" class="text-gray-500 hover:bg-gray-800 large-control-btn"><i class="fa-solid fa-ban"></i></button>${showClock ? `<button onclick="app.injectTime('${safep}')" class="text-blue-400 hover:bg-blue-900/30 large-control-btn" title="Inject Timestamp"><i class="fa-solid fa-clock"></i></button>` : ''}</div><button onclick="app.deleteItem('${safep}')" class="text-red-900 hover:text-red-500 text-[10px] p-1 mt-1 text-right"><i class="fa-solid fa-xmark"></i></button></div></div>`; 
        }
        
        // Check for formula using displayVal (after metadata stripped)
        if (typeof displayVal === 'string' && displayVal.startsWith('=')) {
            const processedVal = this.processFormula(displayVal, 0, path);
            const processedStr = String(processedVal);
            
            // Check if the formula result contains a prio tag - render as badge
            const resultPrioColor = this.parsePrioConfig(processedStr);
            if (resultPrioColor) {
                const resultDisplayVal = this.stripMetaTags(processedStr);
                const escapedFormula = String(val).replace(/"/g, '&quot;').replace(/>/g, '&gt;').replace(/</g, '&lt;');
                const textColor = resultPrioColor;
                const bgColor = this.darkenColor(resultPrioColor, 0.8);
                const borderColor = this.darkenColor(resultPrioColor, 0.6);
                return `<span class="badge cursor-pointer" style="background: ${bgColor}; color: ${textColor}; border: 1px solid ${borderColor};" onclick="app.setEdit('${path}')" title="${escapedFormula}">${resultDisplayVal}</span>`;
            }
            
            // Check if result has color tag
            const resultColor = this.parseColorConfig(processedStr);
            const resultDisplayVal = this.stripMetaTags(processedStr);
            
            // Check if the original value has a <pct:min:max> tag - render formula result with percentage bar
            const pctConfig = this.parsePctConfig(val);
            if (pctConfig) {
                const numericVal = typeof processedVal === 'number' ? processedVal : parseFloat(resultDisplayVal);
                if (!isNaN(numericVal)) {
                    // Build pct bar for formula result
                    const escapedFormula = String(val).replace(/"/g, '&quot;').replace(/>/g, '&gt;').replace(/</g, '&lt;');
                    return this.buildFormulaPctBar(path, numericVal, pctConfig, resultDisplayVal, resultColor || 'text-green-400', escapedFormula);
                }
            }
            
            // Escape the formula for title attribute and prevent >= ligature by using HTML entities
            const escapedFormula = String(val).replace(/"/g, '&quot;').replace(/>/g, '&gt;').replace(/</g, '&lt;');
            // Also escape the processed value to prevent >= ligature in display
            const escapedProcessed = String(resultDisplayVal).replace(/>/g, '&gt;').replace(/</g, '&lt;');
            const safePathAttr = path.replace(/"/g, '&quot;');
            const customColor = resultColor || this.parseColorConfig(val);
            const colorClass = customColor ? '' : 'text-green-400';
            return `<span class="val-display mono hover:underline ${colorClass}" ${customColor ? `style="color: ${customColor}"` : ''} data-formula-path="${safePathAttr}" onclick="app.setEdit('${path}')" title="${escapedFormula}">${escapedProcessed}</span>`;
        }
        
        // Check for custom options toggle <options:label@value,...>
        const optionsConfig = this.parseOptionsConfig(val);
        if (optionsConfig) {
            return this.buildOptionsToggle(path, optionsConfig, displayVal, metaPrefix);
        }
        
        // Use displayVal (stripped of meta tags) for type detection
        const checkVal = hasMeta ? displayVal : val;
        const checkStr = String(checkVal);
        
        // Old percentage format removed - use <pct:min:max> tag instead
        
        const vUpper = checkStr.toUpperCase();
        if (['PENDING', 'IN PROGRESS', 'COMPLETED', 'FAILED'].includes(vUpper)) {
            return `<div class="state-switch"><div class="state-btn ${vUpper === 'PENDING' ? 'state-btn-active-pend' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}PENDING')">PEND</div><div class="state-btn ${vUpper === 'IN PROGRESS' ? 'state-btn-active-prog' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}IN PROGRESS')">PROG</div><div class="state-btn ${vUpper === 'COMPLETED' ? 'state-btn-active-comp' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}COMPLETED')">DONE</div><div class="state-btn ${vUpper === 'FAILED' ? 'state-btn-active-fail' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}FAILED')">FAIL</div></div>`;
        }
        if (['ACTIVE', 'INACTIVE'].includes(vUpper)) {
            return `<div class="state-switch"><div class="state-btn ${vUpper === 'ACTIVE' ? 'state-btn-active-on' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}ACTIVE')">ACTIVE</div><div class="state-btn ${vUpper === 'INACTIVE' ? 'state-btn-active-off' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}INACTIVE')">INACTIVE</div></div>`;
        }
        if (['NOBODY', 'RICK', 'TRIBE MEMBER', 'TRIBE'].includes(vUpper)) {
            return `<div class="state-switch"><div class="state-btn ${vUpper === 'NOBODY' ? 'state-btn-active-off' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}NOBODY')">NOBODY</div><div class="state-btn ${vUpper === 'RICK' ? 'state-btn-active-on' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}RICK')">RICK</div><div class="state-btn ${vUpper.includes('TRIBE') ? 'state-btn-active-prog' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}TRIBE MEMBER')">TRIBE</div></div>`;
        }
        if (['BASELINE', 'COME UP', 'PLATEAU', 'COME DOWN'].includes(vUpper)) {
            return `<div class="state-switch"><div class="state-btn ${vUpper === 'BASELINE' ? 'state-btn-active-off' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}BASELINE')">BASE</div><div class="state-btn ${vUpper === 'COME UP' ? 'state-btn-active-on' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}COME UP')">RISE</div><div class="state-btn ${vUpper === 'PLATEAU' ? 'state-btn-active-pend' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}PLATEAU')">FLAT</div><div class="state-btn ${vUpper === 'COME DOWN' ? 'state-btn-active-fail' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}COME DOWN')">FALL</div></div>`;
        }
        if (['FASTING', 'RISING', 'STABLE', 'FALLING'].includes(vUpper)) {
            return `<div class="state-switch"><div class="state-btn ${vUpper === 'FASTING' ? 'state-btn-active-off' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}FASTING')">FAST</div><div class="state-btn ${vUpper === 'RISING' ? 'state-btn-active-on' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}RISING')">RISE</div><div class="state-btn ${vUpper === 'STABLE' ? 'state-btn-active-pend' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}STABLE')">STABLE</div><div class="state-btn ${vUpper === 'FALLING' ? 'state-btn-active-fail' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}FALLING')">FALL</div></div>`;
        }
        if (['TRUE', 'FALSE'].includes(vUpper) || typeof val === 'boolean') {
            const isTrue = vUpper === 'TRUE' || val === true;
            // Check if this is a RICK PRESENT field for exclusive toggle
            const isRickPresent = path.toUpperCase().includes('RICK') && keyName && keyName.toUpperCase() === 'PRESENT';
            if (isRickPresent) {
                return `<div class="state-switch"><div class="state-btn ${isTrue ? 'state-btn-active-on' : ''}" onclick="app.setRickPresent('${path}', '${metaPrefix}')">TRUE</div><div class="state-btn ${!isTrue ? 'state-btn-active-off' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}FALSE')">FALSE</div></div>`;
            }
            return `<div class="state-switch"><div class="state-btn ${isTrue ? 'state-btn-active-on' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}TRUE')">TRUE</div><div class="state-btn ${!isTrue ? 'state-btn-active-off' : ''}" onclick="app.updateValue('${path}', '${metaPrefix}FALSE')">FALSE</div></div>`;
        }
        // Native number type
        if (typeof val === 'number') {
            const customColor = this.parseColorConfig(val);
            if (customColor) {
                return `<span class="val-display mono hover:underline" style="color: ${customColor}" onclick="app.setEdit('${path}')">${val}</span>`;
            }
            return `<span class="val-display mono text-green-400 hover:underline" onclick="app.setEdit('${path}')">${val}</span>`;
        }
        
        // Get custom color if specified
        const customColor = this.parseColorConfig(val);
        const valueColor = customColor || '#4ade80'; // green-400 default
        const valueColorClass = customColor ? '' : 'text-green-400';
        
        // Percentage format (e.g., "50%")
        const percentMatch = checkStr.match(/^(-?\d+(?:\.\d+)?)%$/);
        if (percentMatch) {
            const numericVal = parseFloat(percentMatch[1]);
            
            // Check for <pct:min:max> tag - show percentage bar background
            const pctConfig = this.parsePctConfig(val);
            if (pctConfig) {
                return this.buildPctBar(path, numericVal, pctConfig, checkVal, customColor || 'text-[#00ff9d]', val, false);
            }
            
            // Check for <pctinv:min:max> tag - show inverted percentage bar (green at low, red at high)
            const pctInvConfig = this.parsePctInvConfig(val);
            if (pctInvConfig) {
                return this.buildPctBar(path, numericVal, pctInvConfig, checkVal, customColor || 'text-[#00ff9d]', val, true);
            }
            
            const stepperConfig = this.parseStepperConfig(val);
            if (stepperConfig) {
                return this.buildStepperButtons(path, stepperConfig, 'incrementMetaValue', checkVal, customColor || 'text-[#00ff9d]', val);
            }
            const resetBtn = this.buildResetButton(path, val);
            if (customColor) {
                return `<div class="flex items-center"><span class="val-display mono hover:underline" style="color: ${customColor}" onclick="app.setEdit('${path}')">${checkVal}</span>${resetBtn}</div>`;
            }
            return `<div class="flex items-center"><span class="val-display mono text-[#00ff9d] hover:underline" onclick="app.setEdit('${path}')">${checkVal}</span>${resetBtn}</div>`;
        }
        
        // Time format HH:MM or H:MM
        const timeMatch = checkStr.match(/^\d{1,2}:\d{2}$/);
        if (timeMatch) {
            const stepperConfig = this.parseStepperConfig(val);
            if (stepperConfig) {
                return this.buildStepperButtons(path, stepperConfig, 'incrementTime', checkVal, customColor || 'text-green-400', val);
            }
            const resetBtn = this.buildResetButton(path, val);
            if (customColor) {
                return `<div class="flex items-center"><span class="val-display mono hover:underline" style="color: ${customColor}" onclick="app.setEdit('${path}')">${checkVal}</span>${resetBtn}</div>`;
            }
            return `<div class="flex items-center"><span class="val-display mono text-green-400 hover:underline" onclick="app.setEdit('${path}')">${checkVal}</span>${resetBtn}</div>`;
        }
        // String that looks like a number (integer or float, including metadata-tagged)
        const numMatch = checkStr.match(/^-?\d+(?:\.\d+)?$/);
        if (numMatch) {
            // Check for <pom> tag - show timer controls instead of steppers
            if (this.hasMetaTag(val, 'pom')) {
                const isRunning = this.isPomRunning(path);
                const playPauseIcon = isRunning ? 'fa-pause' : 'fa-play';
                const playPauseColor = isRunning ? 'text-yellow-400' : 'text-green-400';
                const pomValueColor = isRunning ? 'text-yellow-400' : 'text-green-400';
                const safeId = path.replace(/\|/g, '_');
                return `<div class="flex items-center gap-1"><span id="pom-val-${safeId}" class="val-display mono ${pomValueColor} hover:underline mx-0 whitespace-nowrap min-w-[3rem] text-center flex-shrink-0" onclick="app.setEdit('${path}')">${checkVal}</span><button class="stepper-btn ${playPauseColor}" onclick="app.togglePomTimer('${path}')" title="${isRunning ? 'Pause' : 'Play'}"><i class="fa-solid ${playPauseIcon}"></i></button><button class="stepper-btn text-red-400" onclick="app.resetPomTimer('${path}')" title="Reset"><i class="fa-solid fa-rotate-left"></i></button></div>`;
            }
            
            // Check for <pct:min:max> tag - show percentage bar background
            const pctConfig = this.parsePctConfig(val);
            if (pctConfig) {
                const numericVal = parseFloat(checkVal);
                return this.buildPctBar(path, numericVal, pctConfig, checkVal, customColor || 'text-green-400', val, false);
            }
            
            // Check for <pctinv:min:max> tag - show inverted percentage bar (green at low, red at high)
            const pctInvConfig = this.parsePctInvConfig(val);
            if (pctInvConfig) {
                const numericVal = parseFloat(checkVal);
                return this.buildPctBar(path, numericVal, pctInvConfig, checkVal, customColor || 'text-green-400', val, true);
            }
            
            const stepperConfig = this.parseStepperConfig(val);
            if (stepperConfig) {
                return this.buildStepperButtons(path, stepperConfig, 'incrementMetaValue', checkVal, customColor || 'text-green-400', val);
            }
            const resetBtn = this.buildResetButton(path, val);
            if (customColor) {
                return `<div class="flex items-center"><span class="val-display mono hover:underline" style="color: ${customColor}" onclick="app.setEdit('${path}')">${checkVal}</span>${resetBtn}</div>`;
            }
            return `<div class="flex items-center"><span class="val-display mono text-green-400 hover:underline" onclick="app.setEdit('${path}')">${checkVal}</span>${resetBtn}</div>`;
        }
        
        // Check for <prio:#hexcolor> tag for priority badges
        const prioColor = this.parsePrioConfig(val);
        if (prioColor) {
            return this.buildPrioBadge(path, displayVal, prioColor);
        }
        
        // Default string display - check for rst tag and color tag
        const resetBtn = this.buildResetButton(path, val);
        if (customColor) {
            if (resetBtn) {
                return `<div class="flex items-center"><span class="val-display mono hover:underline" style="color: ${customColor}" onclick="app.setEdit('${path}')">${displayVal}</span>${resetBtn}</div>`;
            }
            return `<span class="val-display mono hover:underline" style="color: ${customColor}" onclick="app.setEdit('${path}')">${displayVal}</span>`;
        }
        if (resetBtn) {
            return `<div class="flex items-center"><span class="val-display mono text-green-400 hover:underline" onclick="app.setEdit('${path}')">${displayVal}</span>${resetBtn}</div>`;
        }
        return `<span class="val-display mono text-green-400 hover:underline" onclick="app.setEdit('${path}')">${displayVal}</span>`;
    }

    setEdit(path) { 
        // Don't allow editing locked paths
        if (this.isLocked(path)) return;
        
        this.editingPath = path; 
        this.render(); 
        setTimeout(() => { 
            const el = document.getElementById(`input-${path}`); 
            if(el) { 
                el.focus(); 
                // Calculate metadata prefix length to select only the value part
                const fullVal = el.value;
                const metaPrefixLen = this.getMetaPrefix(fullVal).length;
                el.setSelectionRange(metaPrefixLen, fullVal.length);
            } 
        }, 50); 
    }
    cancelEdit() { this.editingPath = null; this.render(); }
    
    toggleIO(mode) {
        const modal = document.getElementById('io-modal');
        const ta = document.getElementById('raw-json');
        const header = document.getElementById('modal-header');
        const copyBtn = document.getElementById('copy-btn');
        const loadBtn = document.getElementById('load-btn');
        const exportOption = document.getElementById('export-option-container');
        const exportCheck = document.getElementById('export-visible-check');
        const logsCheck = document.getElementById('export-logs-check');
        const metadataCheck = document.getElementById('export-metadata-check');
        const formulasCheck = document.getElementById('export-formulas-check');
        const moodCheck = document.getElementById('export-mood-check');

        if (modal.classList.contains('hidden')) {
            if (mode === 'export') { 
                exportOption.classList.remove('hidden'); 
                
                if(this.state.export_config) {
                    exportCheck.checked = this.state.export_config.visible_only;
                    logsCheck.checked = this.state.export_config.include_logs;
                    metadataCheck.checked = this.state.export_config.include_metadata !== false;
                    formulasCheck.checked = this.state.export_config.include_formulas || false;
                    moodCheck.checked = this.state.export_config.include_mood || false;
                    this.includeDV = moodCheck.checked;
                } else {
                    metadataCheck.checked = true;
                    formulasCheck.checked = false;
                    moodCheck.checked = false;
                }

                this.updateExportPreview(); 
                
                ta.readOnly = true; 
                header.textContent = 'DATA EXTRACTION'; 
                ta.placeholder = '// COPY DATA STREAM BELOW //'; 
                copyBtn.classList.remove('hidden'); 
                loadBtn.classList.add('hidden'); 
            }
            else if (mode === 'import') { 
                exportOption.classList.add('hidden'); 
                
                ta.value = ''; 
                ta.readOnly = false; 
                header.textContent = 'DATA INJECTION'; 
                ta.placeholder = '// PASTE WORLD MODEL HERE //'; 
                copyBtn.classList.add('hidden'); 
                loadBtn.classList.remove('hidden');
                loadBtn.textContent = 'LOAD DATA';
                loadBtn.onclick = () => this.saveRaw();
            }
            else if (mode === 'cron_prompt') {
                exportOption.classList.add('hidden');
                
                ta.value = '';
                ta.readOnly = false;
                header.textContent = 'CRON SUB-AGENT PROMPT';
                ta.placeholder = '// LOADING PROMPT FROM KV... //';
                copyBtn.classList.add('hidden');
                loadBtn.classList.remove('hidden');
                loadBtn.textContent = 'SAVE PROMPT';
                loadBtn.onclick = () => this.saveCronPrompt();
            }
            modal.classList.remove('hidden');
        } else { 
            modal.classList.add('hidden'); 
            ta.readOnly = false; 
            exportOption.classList.add('hidden');
        }
    }

    saveRaw() { 
        try { 
            const ta = document.getElementById('raw-json'); 
            let newState = JSON.parse(ta.value); 
            newState._meta_log = []; 
            if (!newState.log_config) newState.log_config = { "limit": 10, "enabled": true, "chart_limit": 10, "log_scratchpad": false };
            if (!newState.export_config) newState.export_config = { "visible_only": false, "include_logs": true, "include_metadata": true, "include_formulas": false, "include_mood": false };
            if (!newState._mood_history) newState._mood_history = [];
            if (!newState._dly_reset_date) newState._dly_reset_date = null;
            this.state = newState;
            // Re-init cache to prevent huge XP drops/gains on load
                this.save(); 
            this.toggleIO(); 
        } catch(e) { alert("SYNTAX ERROR: Invalid JSON."); } 
    }

    copyRaw() { const ta = document.getElementById('raw-json'); ta.select(); document.execCommand('copy'); const tempBtnText = document.getElementById('copy-btn').textContent; document.getElementById('copy-btn').textContent = 'COPIED!'; setTimeout(() => { document.getElementById('copy-btn').textContent = tempBtnText; }, 1000); }

    toggleChart() {
        const modal = document.getElementById('chart-modal');
        const limitInput = document.getElementById('chart-limit-input');
        const dvToggle = document.getElementById('dv-export-toggle');
        
        if(modal.classList.contains('hidden')) {
            limitInput.value = this.state.log_config.chart_limit || 10;
            dvToggle.checked = this.includeDV;
            this.renderChart();
            modal.classList.remove('hidden');
        } else {
            modal.classList.add('hidden');
        }
    }
    
    updateChartLimit(val) {
        let limit = parseInt(val);
        if (limit < 2) limit = 2;
        this.state.log_config.chart_limit = limit;
        this.save();
        this.renderChart();
    }

    toggleDVExport() {
        const el = document.getElementById('dv-export-toggle');
        this.includeDV = el.checked;
        if(!this.state.export_config) this.state.export_config = { "visible_only": false, "include_logs": true, "include_metadata": true, "include_formulas": false, "include_mood": false };
        this.state.export_config.include_mood = el.checked;
        this.save();
    }

    stringToColor(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        const h = Math.abs(hash % 360);
        return `hsl(${h}, 70%, 50%)`;
    }

    renderChart() {
        const container = document.getElementById('chart-svg-container');
        const legendContainer = document.getElementById('chart-legend');
        if(!container) return;
        
        const history = this.state._mood_history || [];
        const limit = this.state.log_config.chart_limit || 10;
        const data = history.slice(-limit);
        
        if (data.length < 2) {
            container.innerHTML = `<div class="flex items-center justify-center h-full text-gray-600 text-xs">INSUFFICIENT DATA (${data.length}/2)</div>`;
            legendContainer.innerHTML = '';
            return;
        }

        document.getElementById('chart-cycle-count').textContent = data.length;

        const width = container.clientWidth || 300;
        const height = 300;
        const padding = 20;
        const contentW = width - (padding * 2);
        const contentH = height - (padding * 2);

        const parsePct = (val) => {
            if(typeof val === 'string') {
                const m = val.match(/^(\d+)/);
                return m ? parseInt(m[1]) : 0;
            }
            return 0;
        };
        
        const lastEntry = data[data.length-1].data;
        const keys = Object.keys(lastEntry).filter(k => {
            const v = lastEntry[k];
            return typeof v === 'number' || (typeof v === 'string' && v.match(/^\d+%?/));
        });

        const processedPoints = data.map((entry, idx) => {
            const x = padding + (idx / (data.length - 1)) * contentW;
            const point = { x, ts: entry.ts };
            keys.forEach(k => {
                point[k] = parsePct(entry.data[k]);
            });
            return point;
        });

        const makePath = (key, color) => {
            let d = `M ${processedPoints[0].x} ${height - padding - (processedPoints[0][key]/100 * contentH)}`;
            processedPoints.forEach((p, i) => {
                if (i === 0) return;
                const val = p[key] !== undefined ? p[key] : 0;
                d += ` L ${p.x} ${height - padding - (val/100 * contentH)}`;
            });
            return `<path d="${d}" stroke="${color}" class="chart-line" />`;
        };

        const makeDots = (key, color) => {
            return processedPoints.map(p => {
                const val = p[key] !== undefined ? p[key] : 0;
                return `<circle cx="${p.x}" cy="${height - padding - (val/100 * contentH)}" r="3" fill="${color}" stroke="#000" class="chart-dot"><title>${key.toUpperCase()}: ${val}%\n${p.ts}</title></circle>`;
            }).join('');
        };

        let legendHTML = '';
        let chartElementsHTML = '';
        
        keys.forEach(k => {
            const color = this.stringToColor(k);
            legendHTML += `<div class="legend-item"><span class="legend-color" style="background:${color}"></span>${k.toUpperCase()}</div>`;
            chartElementsHTML += makePath(k, color);
            chartElementsHTML += makeDots(k, color);
        });
        
        legendContainer.innerHTML = legendHTML;

        const svg = `
            <svg width="100%" height="100%" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">
                <line x1="${padding}" y1="${padding}" x2="${padding}" y2="${height-padding}" class="chart-axis" />
                <line x1="${padding}" y1="${height-padding}" x2="${width-padding}" y2="${height-padding}" class="chart-axis" />
                
                <line x1="${padding}" y1="${padding + contentH*0.25}" x2="${width-padding}" y2="${padding + contentH*0.25}" class="chart-grid" />
                <line x1="${padding}" y1="${padding + contentH*0.50}" x2="${width-padding}" y2="${padding + contentH*0.50}" class="chart-grid" />
                <line x1="${padding}" y1="${padding + contentH*0.75}" x2="${width-padding}" y2="${padding + contentH*0.75}" class="chart-grid" />

                <text x="${padding-5}" y="${padding + contentH*0.25 + 3}" text-anchor="end" class="chart-label">75%</text>
                <text x="${padding-5}" y="${padding + contentH*0.50 + 3}" text-anchor="end" class="chart-label">50%</text>
                <text x="${padding-5}" y="${padding + contentH*0.75 + 3}" text-anchor="end" class="chart-label">25%</text>

                ${chartElementsHTML}
            </svg>
        `;
        
        container.innerHTML = svg;
    }
}

const app = new ZyqralOS();
</script>
</body>
